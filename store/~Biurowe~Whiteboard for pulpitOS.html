<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Whiteboard</title>
<style>
  :root{
    --bg:#0b1220; --panel:#101a2c; --panel2:#0f172a; --line:#1e293b;
    --txt:#e2e8f0; --muted:#94a3b8; --accent1:#6366f1; --accent2:#3b82f6;
    --board:#f8fafc;
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--txt);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    overflow:hidden; user-select:none;
  }
  #app{display:flex; flex-direction:column; height:100vh}

  #toolbar{
    display:flex; flex-wrap:wrap; align-items:center; gap:6px;
    padding:8px 12px; background:var(--panel);
    border-bottom:1px solid var(--line);
  }
  .group{display:flex; align-items:center; gap:4px}
  .sep{width:1px; height:26px; background:var(--line); margin:0 6px}
  button{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:36px; height:36px; padding:0 8px; gap:6px;
    background:transparent; color:var(--txt);
    border:1px solid transparent; border-radius:10px;
    font:600 13px "Segoe UI",sans-serif; cursor:pointer;
    transition:background .15s, border-color .15s, transform .05s;
  }
  button:hover{background:var(--panel2); border-color:var(--line)}
  button:active{transform:scale(.94)}
  button.active{
    background:linear-gradient(90deg,var(--accent1),var(--accent2));
    color:#fff; box-shadow:0 2px 10px rgba(59,130,246,.35);
  }
  button svg{width:18px; height:18px; stroke:currentColor; fill:none;
    stroke-width:2; stroke-linecap:round; stroke-linejoin:round}
  button:disabled{opacity:.35; cursor:default}

  .swatch{width:22px; height:22px; border-radius:50%; border:2px solid transparent;
    cursor:pointer; transition:transform .1s}
  .swatch:hover{transform:scale(1.15)}
  .swatch.sel{border-color:#fff; box-shadow:0 0 0 2px var(--accent1)}
  input[type=color]{width:26px; height:26px; border:none; background:none; cursor:pointer; padding:0}
  input[type=range]{accent-color:var(--accent1); width:110px}
  #sizeDot{width:26px; text-align:center}
  #sizeDot i{display:inline-block; border-radius:50%}
  label.chk{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer}
  label.chk input{accent-color:var(--accent1)}

  #stage{flex:1; padding:12px; min-height:0}
  #frame{
    position:relative; height:100%; border-radius:14px; overflow:hidden;
    border:1px solid var(--line); background:var(--board);
    box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  #frame.dark{background:#0f172a}
  #board{position:absolute; inset:0; width:100%; height:100%;
    touch-action:none; cursor:crosshair}

  #status{
    display:flex; justify-content:space-between; align-items:center;
    padding:6px 14px; font-size:12px; color:var(--muted);
    background:var(--panel); border-top:1px solid var(--line);
  }
  #saveState.saved{color:#4ade80}
  #saveState.offline{color:#f59e0b}

  #toast{
    position:fixed; left:50%; bottom:56px; transform:translateX(-50%) translateY(20px);
    background:#1e293b; color:#fff; border:1px solid var(--line);
    padding:9px 16px; border-radius:10px; font-size:13px;
    opacity:0; pointer-events:none; transition:.25s;
    box-shadow:0 6px 24px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">

  <header id="toolbar">
    <div class="group" id="tools">
      <button data-tool="pen"    title="Piórnik (P)"><svg viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg></button>
      <button data-tool="marker" title="Zakreślacz (M)"><svg viewBox="0 0 24 24"><path d="M5 19h4l-1-4 9-9-3-3-9 9-1 4z" opacity=".5"/><path d="M12 3l6 6-3 3-6-6z"/></svg></button>
      <button data-tool="eraser" title="Gumka (E) — lub PPM"><svg viewBox="0 0 24 24"><path d="M7 17h10l4-4-7-7L6 10l1 7z"/><path d="M3 21h18"/></svg></button>
      <button data-tool="line"   title="Linia (L)"><svg viewBox="0 0 24 24"><path d="M4 20L20 4"/></svg></button>
      <button data-tool="arrow"  title="Strzałka (A)"><svg viewBox="0 0 24 24"><path d="M4 20L20 4"/><path d="M20 4h-9M20 4v9"/></svg></button>
      <button data-tool="rect"   title="Prostokąt (R)"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/></svg></button>
      <button data-tool="ellipse" title="Elipsa (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg></button>
      <button data-tool="text"   title="Tekst (T)"><svg viewBox="0 0 24 24"><path d="M5 6h14M12 6v14"/></svg></button>
    </div>

    <div class="sep"></div>

    <div class="group" id="colors"></div>
    <input type="color" id="customColor" value="#e11d48" title="Własny kolor">

    <div class="sep"></div>

    <div class="group">
      <span id="sizeDot"><i></i></span>
      <input type="range" id="size" min="1" max="40" value="4" title="Grubość">
    </div>

    <div class="sep"></div>

    <div class="group">
      <button id="btnUndo" title="Cofnij (Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5"/><path d="M4 12h11a5 5 0 0 1 0 10h-2"/></svg></button>
      <button id="btnRedo" title="Ponów (Ctrl+Y)"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5"/><path d="M20 12H9a5 5 0 0 0 0 10h2"/></svg></button>
      <button id="btnClear" title="Wyczyść tablicę"><svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/></svg></button>
    </div>

    <div class="sep"></div>

    <div class="group">
      <label class="chk"><input type="checkbox" id="fill">Wypełnij</label>
      <button id="btnDark" title="Jasna / ciemna tablica"><svg viewBox="0 0 24 24"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/><circle cx="12" cy="12" r="4"/></svg></button>
      <button id="btnSave" title="Zapisz PNG (Ctrl+S)"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg><span>PNG</span></button>
    </div>
  </header>

  <main id="stage"><div id="frame"><canvas id="board"></canvas></div></main>

  <footer id="status">
    <span id="info">Piórnik · 4 px</span>
    <span>Whiteboard · PulpitOS 1.15.1</span>
    <span id="saveState">—</span>
  </footer>

</div>
<div id="toast"></div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════
   MOST OS — identyczny z dokumentacją PulpitOS 1.15.1 pkt 11
   ═══════════════════════════════════════════════════════════ */
const OS=(function(){
  let i=0; const p={}, ev={};
  addEventListener("message",function(e){
    const d=e.data;
    if(!d||d.channel!=="pulpitos") return;
    if(d.id!=null && p[d.id]){
      const f=p[d.id]; delete p[d.id];
      d.ok ? f.res(d.result) : f.rej(new Error(d.error));
    } else if(d.event && ev[d.event]){
      ev[d.event].forEach(f=>f(d.data));
    }
  });
  return {
    call:function(m,params){
      return new Promise(function(res,rej){
        const id=++i; p[id]={res:res,rej:rej};
        parent.postMessage({channel:"pulpitos",id:id,method:m,params:params||{}},"*");
      });
    },
    on:function(n,f){ (ev[n]=ev[n]||[]).push(f); }
  };
})();

/* ── Helper: wywołanie OS z timeoutem (gdyby system nie odpowiedział) ── */
function osCall(m, p, ms){
  return Promise.race([
    OS.call(m, p).then(v=>({ok:true, v}), e=>({ok:false, err:e.message||String(e)})),
    new Promise(r=>setTimeout(()=>r({ok:false, err:'timeout'}), ms||3000))
  ]);
}

/* ── Dialogi systemowe (zamiast window.prompt/confirm) ── */
async function askText(message, defaultValue){
  const r = await osCall('ui.prompt', {message, defaultValue: defaultValue||''});
  if(r.ok && r.v!=null){
    // ui.prompt może zwrócić {text, value} lub bezpośrednio string
    if(typeof r.v==='string') return r.v;
    if(typeof r.v==='object') return r.v.text ?? r.v.value ?? '';
  }
  return null;
}
async function askConfirm(message){
  const r = await osCall('ui.confirm', {message});
  if(r.ok && typeof r.v==='boolean') return r.v;
  if(r.ok && typeof r.v==='object') return !!r.v.confirmed;
  return false;
}
function toast(m){
  const el=document.getElementById('toast');
  el.textContent=m; el.classList.add('show');
  clearTimeout(toast._t);
  toast._t=setTimeout(()=>el.classList.remove('show'), 2600);
  OS.call('ui.toast', {message:m});
}

/* ── Stan aplikacji ── */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const canvas=document.getElementById('board');
const view=canvas.getContext('2d');
const base=document.createElement('canvas');
const bctx=base.getContext('2d');

const S={
  tool:'pen', color:'#1e293b', size:4, fill:false, dark:false,
  strokes:[], redo:[], act:null, dpr:1
};

/* ── Paleta kolorów ── */
const PALETTE=['#1e293b','#ef4444','#f97316','#eab308','#22c55e','#3b82f6','#8b5cf6','#ec4899'];
const cg=document.getElementById('colors');
PALETTE.forEach(c=>{
  const d=document.createElement('div');
  d.className='swatch'+(c===S.color?' sel':'');
  d.dataset.c=c; d.style.background=c;
  cg.appendChild(d);
  d.onclick=()=>setColor(c);
});
function setColor(c){
  S.color=c;
  $$('.swatch').forEach(s=>s.classList.toggle('sel', s.dataset.c===c));
  updateInfo();
}

/* ── Skalowanie canvas ── */
function fit(){
  S.dpr=window.devicePixelRatio||1;
  const r=canvas.getBoundingClientRect();
  for(const c of [canvas, base]){
    c.width=Math.max(1, Math.round(r.width*S.dpr));
    c.height=Math.max(1, Math.round(r.height*S.dpr));
  }
  view.setTransform(S.dpr,0,0,S.dpr,0,0);
  bctx.setTransform(S.dpr,0,0,S.dpr,0,0);
  redraw();
}
window.addEventListener('resize', fit);

/* ── Rysowanie pociągnięcia ── */
function drawStroke(ctx, s){
  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';
  if(s.tool==='text'){
    ctx.fillStyle=s.color;
    ctx.font=`600 ${s.size}px "Segoe UI",sans-serif`;
    ctx.fillText(s.text, s.x, s.y);
  } else if(s.tool==='eraser'){
    ctx.globalCompositeOperation='destination-out';
    ctx.strokeStyle='rgba(0,0,0,1)'; ctx.lineWidth=s.size*3;
    path(ctx, s.pts);
  } else if(s.tool==='pen'||s.tool==='marker'){
    ctx.globalAlpha = s.tool==='marker' ? .35 : 1;
    ctx.strokeStyle=s.color;
    ctx.lineWidth = s.size * (s.tool==='marker' ? 2.5 : 1);
    path(ctx, s.pts);
  } else {
    ctx.strokeStyle=s.color; ctx.lineWidth=s.size;
    const x=Math.min(s.x1,s.x2), y=Math.min(s.y1,s.y2),
          w=Math.abs(s.x2-s.x1), h=Math.abs(s.y2-s.y1);
    if(s.tool==='rect'){
      if(S.fill && s.fill){
        ctx.globalAlpha=.25; ctx.fillStyle=s.color;
        ctx.beginPath(); ctx.roundRect(x,y,w,h,6); ctx.fill(); ctx.globalAlpha=1;
      }
      ctx.strokeRect(x,y,w,h);
    } else if(s.tool==='ellipse'){
      ctx.beginPath(); ctx.ellipse(x+w/2, y+h/2, w/2, h/2, 0, 0, 7);
      if(s.fill && S.fill){
        ctx.globalAlpha=.25; ctx.fillStyle=s.color; ctx.fill(); ctx.globalAlpha=1;
      }
      ctx.stroke();
    } else {
      ctx.beginPath(); ctx.moveTo(s.x1,s.y1); ctx.lineTo(s.x2,s.y2); ctx.stroke();
      if(s.tool==='arrow'){
        const a=Math.atan2(s.y2-s.y1, s.x2-s.x1), L=Math.max(12, s.size*4);
        ctx.beginPath();
        ctx.moveTo(s.x2,s.y2); ctx.lineTo(s.x2-L*Math.cos(a-.4), s.y2-L*Math.sin(a-.4));
        ctx.moveTo(s.x2,s.y2); ctx.lineTo(s.x2-L*Math.cos(a+.4), s.y2-L*Math.sin(a+.4));
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}
function path(ctx, pts){
  if(!pts.length) return;
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}

/* ── Pełne przerysowanie ── */
function redraw(){
  bctx.save(); bctx.setTransform(1,0,0,1,0,0);
  bctx.clearRect(0,0,base.width,base.height); bctx.restore();
  S.strokes.forEach(s=>drawStroke(bctx, s));
  copyBaseToView();
}
function copyBaseToView(){
  view.save(); view.setTransform(1,0,0,1,0,0);
  view.clearRect(0,0,canvas.width,canvas.height);
  view.drawImage(base,0,0); view.restore();
}

/* ── Wskaźnik ── */
function pos(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}

canvas.addEventListener('pointerdown', async e=>{
  if(e.button===1) return;
  canvas.setPointerCapture(e.pointerId);
  const p=pos(e);

  if(S.tool==='text'){
    const t = await askText('Wpisz tekst:', '');
    if(t){
      S.strokes.push({tool:'text', x:p.x, y:p.y, text:t, color:S.color, size:S.size*4+10});
      redraw(); commit();
    }
    return;
  }

  const tool = (e.button===2) ? 'eraser' : S.tool;
  if(tool==='pen'||tool==='marker'||tool==='eraser'){
    S.act={tool, color:S.color, size:S.size, pts:[p]};
    drawStroke(bctx, {...S.act, pts:[{x:p.x-.01,y:p.y}, p]});
    copyBaseToView();
  } else {
    S.act={tool, color:S.color, size:S.size, fill:S.fill, x1:p.x, y1:p.y, x2:p.x, y2:p.y};
  }
});

canvas.addEventListener('pointermove', e=>{
  if(!S.act) return;
  const p=pos(e);
  if(S.act.pts){
    const last=S.act.pts[S.act.pts.length-1];
    S.act.pts.push(p);
    const seg={...S.act, pts:[last, p]};
    drawStroke(bctx, seg); copyBaseToView();
  } else {
    S.act.x2=p.x; S.act.y2=p.y;
    copyBaseToView(); drawStroke(view, S.act);
  }
});

canvas.addEventListener('pointerup', ()=>{
  if(!S.act) return;
  S.strokes.push(S.act); S.act=null; S.redo=[];
  redraw(); commit();
});
canvas.addEventListener('contextmenu', e=>e.preventDefault());

/* ── Cofnij / Ponów / Wyczyść ── */
function undo(){
  if(!S.strokes.length) return;
  S.redo.push(S.strokes.pop()); redraw(); commit();
}
function redo(){
  if(!S.redo.length) return;
  S.strokes.push(S.redo.pop()); redraw(); commit();
}
async function clearBoard(){
  const ok = await askConfirm('Wyczyścić całą tablicę?');
  if(ok){ S.strokes=[]; S.redo=[]; redraw(); commit(); toast('Tablica wyczyszczona'); }
}
document.getElementById('btnUndo').onclick = undo;
document.getElementById('btnRedo').onclick = redo;
document.getElementById('btnClear').onclick = clearBoard;

/* ── Autosave przez app.state (synchronizacja z Drive) ── */
let timer=null;
function commit(){
  setSave('pending');
  clearTimeout(timer);
  timer=setTimeout(async ()=>{
    const r = await osCall('app.state', {key:'wb.board', value:S.strokes});
    await osCall('app.state', {key:'wb.dark', value:S.dark});
    setSave(r.ok ? 'saved' : 'offline');
  }, 1000);
}
function setSave(st){
  const el=document.getElementById('saveState');
  el.className=st;
  el.textContent = {pending:'Zapisywanie…', saved:'Zapisano ✓', offline:'Offline'}[st]||'—';
}
async function loadBoard(){
  const r = await osCall('app.state', {key:'wb.board'});
  if(r.ok && Array.isArray(r.v)){ S.strokes=r.v; redraw(); }
  const d = await osCall('app.state', {key:'wb.dark'});
  if(d.ok && typeof d.v==='boolean'){ S.dark=d.v; applyBoard(); }
  setSave(r.ok ? 'saved' : 'offline');
}
OS.on('ready', ()=>loadBoard());
loadBoard();

/* ── Zapis PNG przez fs.writeBlob (BEZ pobierania z przeglądarki) ── */
async function savePng(){
  const c=document.createElement('canvas');
  c.width=canvas.width; c.height=canvas.height;
  const x=c.getContext('2d');
  x.fillStyle = S.dark ? '#0f172a' : '#f8fafc';
  x.fillRect(0,0,c.width,c.height);
  x.drawImage(base,0,0);

  c.toBlob(async b=>{
    if(!b){ toast('Błąd generowania PNG'); return; }
    const t=new Date(), pad=n=>String(n).padStart(2,'0');
    const name=`whiteboard-${t.getFullYear()}${pad(t.getMonth()+1)}${pad(t.getDate())}-${pad(t.getHours())}${pad(t.getMinutes())}.png`;
    const path=`C:\\użytkownik\\Pobrane\\${name}`;

    const r = await osCall('fs.writeBlob', {path, blob:b}, 5000);
    if(r.ok){
      toast('Zapisano: '+path);
    } else {
      toast('Błąd zapisu: '+(r.err||'nieznany'));
    }
  }, 'image/png');
}
document.getElementById('btnSave').onclick = savePng;

/* ── Przełączniki ── */
document.getElementById('fill').onchange = e=>S.fill=e.target.checked;
document.getElementById('btnDark').onclick = ()=>{ S.dark=!S.dark; applyBoard(); commit(); };
function applyBoard(){ document.getElementById('frame').classList.toggle('dark', S.dark); }

/* ── Narzędzia i grubość ── */
$$('#tools button').forEach(b=>{
  b.onclick=()=>{
    S.tool=b.dataset.tool;
    $$('#tools button').forEach(x=>x.classList.toggle('active', x===b));
    updateInfo();
  };
});
document.getElementById('size').oninput = e=>{ S.size=+e.target.value; updateInfo(); };
document.getElementById('customColor').oninput = e=>setColor(e.target.value);

function updateInfo(){
  const names={pen:'Piórnik',marker:'Zakreślacz',eraser:'Gumka',line:'Linia',
    arrow:'Strzałka',rect:'Prostokąt',ellipse:'Elipsa',text:'Tekst'};
  document.getElementById('info').textContent = `${names[S.tool]} · ${S.size} px · ${S.color}`;
  const dot=document.getElementById('sizeDot').querySelector('i');
  const d=Math.min(26, Math.max(3, S.size));
  dot.style.width=dot.style.height=d+'px';
  dot.style.background=S.color;
  document.getElementById('btnUndo').disabled = !S.strokes.length;
  document.getElementById('btnRedo').disabled = !S.redo.length;
}
updateInfo();

/* ── Skróty klawiszowe ── */
addEventListener('keydown', e=>{
  if(e.ctrlKey && e.key==='z'){ e.preventDefault(); undo(); }
  else if(e.ctrlKey && (e.key==='y' || (e.shiftKey && e.key==='Z'))){ e.preventDefault(); redo(); }
  else if(e.ctrlKey && e.key==='s'){ e.preventDefault(); savePng(); }
  else {
    const map={p:'pen',m:'marker',e:'eraser',l:'line',a:'arrow',r:'rect',o:'ellipse',t:'text'};
    if(map[e.key.toLowerCase()]){
      const btn=document.querySelector(`#tools [data-tool=${map[e.key.toLowerCase()]}]`);
      if(btn) btn.click();
    }
  }
});

/* ── Motyw systemu ── */
(async ()=>{
  const t = await osCall('system.theme');
  if(t.ok && t.v){
    const dark = t.v.dark ?? (t.v.mode!=='light');
    document.documentElement.style.setProperty('--board', dark?'#0f172a':'#f8fafc');
  }
})();
OS.on('theme.change', d=>{ if(d && d.dark===false) applyBoard(); });

fit();
</script>
</body>
</html>
