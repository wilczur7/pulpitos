</script><script>var expr="",last="0",keys=["C","(",")","⌫","7","8","9","÷","4","5","6","×","1","2","3","−","±","0",",","+","%","="],g=document.getElementById("g");keys.forEach(k=>{const b=document.createElement("button");b.textContent=k;if(k==="="){b.className="eq";b.style.gridColumn="span 3"}else if("÷×−+()".includes(k))b.className="op";else if(["C","⌫","±","%"].includes(k))b.className="fn";b.onclick=()=>press(k);g.appendChild(b)});function show(){document.getElementById("ex").innerHTML=expr||"&nbsp;";document.getElementById("v").textContent=last}function calc(){var e=expr.replace(/÷/g,"/").replace(/×/g,"*").replace(/−/g,"-").replace(/,/g,".");if(!/^[-+*/(). \d]+$/.test(e))throw 0;var r=Function(String.fromCharCode(34)+"use strict"+String.fromCharCode(34)+";return("+e+")")();if(!isFinite(r))throw 0;return String(Math.round(r*1e10)/1e10)}function press(k){if(k==="C"){expr="";last="0"}else if(k==="⌫")expr=expr.slice(0,-1);else if(k==="±"){if(expr)expr="-("+expr+")"}else if(k==="%"){if(expr)expr="("+expr+")/100"}else if(k==="="){try{last=calc();expr=""}catch(e){last="Błąd";expr=""}}else{expr+=k;try{last=calc()}catch(e){}}show()}addEventListener("keydown",e=>{const m={"*":"×","/":"÷","-":"−",".":",","Enter":"=","Backspace":"⌫","Escape":"C"},k=m[e.key]||e.key;if(keys.includes(k)){e.preventDefault();press(k)}});OS.on("ready",i=>{document.documentElement.style.setProperty("--ac",i.accent);document.body.classList.toggle("light",i.theme==="light");OS.call("apps.window",{width:420,height:600,minWidth:320,minHeight:420});OS.call("apps.quickActions",{actions:[{id:"clear",label:"Wyczyść",icon:"x"},{id:"copy",label:"Kopiuj wynik",icon:"copy"}]})});OS.on("theme.change",i=>document.body.classList.toggle("light",i.mode==="light"));OS.on("quickAction",i=>{if(i.action==="clear")press("C");if(i.action==="copy")navigator.clipboard&&navigator.clipboard.writeText(last)});show();</script></body></html>
