<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PulpitOS 1.11 — Web Desktop</title>
<style>
:root{

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}

*{scrollbar-width:thin;scrollbar-color:rgba(var(--accent-rgb),.6) rgba(var(--accent-rgb),.07)}

.win-title{flex:1;min-width:0;font-size:12.5px;font-weight:650;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.win.active .win-title{color:var(--text)}

.win-body{position:absolute;inset:40px 0 0;display:flex;flex-direction:column;overflow:hidden}
.rz{position:absolute;z-index:5;touch-action:none}.win.max .rz{display:none}
.rz-n{top:-3px;left:10px;right:10px;height:7px;cursor:n-resize}.rz-s{bottom:-3px;left:10px;right:10px;height:7px;cursor:s-resize}.rz-e{right:-3px;top:10px;bottom:10px;width:7px;cursor:e-resize}.rz-w{left:-3px;top:10px;bottom:10px;width:7px;cursor:w-resize}
.rz-ne{top:-3px;right:-3px;width:13px;height:13px;cursor:ne-resize}.rz-nw{top:-3px;left:-3px;width:13px;height:13px;cursor:nw-resize}.rz-se{bottom:-3px;right:-3px;width:13px;height:13px;cursor:se-resize}.rz-sw{bottom:-3px;left:-3px;width:13px;height:13px;cursor:sw-resize}

 if(one&&!one.system)items.push({label:'Zmień nazwę',icon:'edit',accel:'F2',action:()=>renameInline(one,source)},{label:'Zmień ikonę…',icon:'image',action:()=>changeNodeIcon(one)});

function renameInline(n,source='desktop'){
 if(source==='desktop'){const d=$('[data-id="'+n.id+'"]',iconsEl);if(!d||n.system)return;
 const lbl=$('.dicon-label',d),inp=h('input','rename-input');inp.value=n.name;lbl.replaceWith(inp);inp.focus();
 const dot=n.name.lastIndexOf('.');inp.setSelectionRange(0,dot>0?dot:n.name.length);
 let done=false;const fin=()=>{if(done)return;done=true;const v=inp.value.trim();v&&v!==n.name?renameNode(n,v):renderDesktop()};
 inp.onpointerdown=e=>e.stopPropagation();inp.onblur=fin;
 inp.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter')fin();if(e.key==='Escape'){done=true;renderDesktop()}}}
 else promptDlg('Zmień nazwę',n.name,{label:'Nowa nazwa'}).then(v=>v&&renameNode(n,v))}
function renameNode(n,name){name=uniqueName(n.parent,name,n.id);
 if(n.driveId&&cloudOk())Drive.renameReal(n,name).catch(e=>toast(e.message,{type:'error'}));
 n.name=name;n.modified=Date.now();commit('rename',n.id)}
function arrangeDesktop(by){const nodes=children(DESK).sort((a,b)=>a.system!==b.system?(a.system?-1:1):by==='type'?typeLabel(a).localeCompare(typeLabel(b),'pl'):by==='date'?(b.modified||0)-(a.modified||0):a.name.localeCompare(b.name,'pl'));
 const{rows}=gridMetrics();nodes.forEach((n,i)=>n.pos={c:Math.floor(i/rows),r:i%rows});commit('arrange')}

const BAT_TEMPLATE='@echo off\nrem ============================================\nrem  Skrypt wsadowy PulpitOS\nrem ============================================\ntitle Mój skrypt\ncolor green\n\necho Uruchomiono: %DATE% %TIME%\necho Katalog: %CD%\necho.\ncd documents\ndir\necho.\nmsg Skrypt zakończony.\nexit /b 0\n';
async function createNode(type,parent=DESK,o={}){
 const z=rootOf(parent)==='Z',names={folder:'Nowy folder',text:'Nowy dokument.txt',bat:'Nowy skrypt.bat',gdoc:'Dokument Google',gsheet:'Arkusz Google',gslides:'Prezentacja Google'};
 let nm=o.name||names[type]||'Nowy';if(type==='bat'&&!isBatName(nm))nm+='.bat';
 const name=uniqueName(parent,nm);let n;
 try{
 if(['gdoc','gsheet','gslides'].includes(type)){if(!cloudOk())throw new Error('Dokumenty Google wymagają połączenia z kontem.');n=await Drive.createGoogle(type,name,z?parent:'Z')}
 else if(z&&cloudOk())n=type==='folder'?await Drive.createFolderReal(name,parent):await Drive.upload(new Blob([type==='bat'?BAT_TEMPLATE:''],{type:'text/plain'}),name,parent);
 else{n={id:uid(),name,type:type==='bat'?'text':type,parent,origin:z?'demo':'local',created:Date.now(),modified:Date.now()};
 if(type==='text')n.content=o.content||'';
 if(type==='bat'){n.content=o.content||BAT_TEMPLATE;n.mime='application/x-batch';n.iconPreset='bat'}
 if(isDesktop(parent))n.pos=findFreeCell(o.cell);state.nodes[n.id]=n}
 commit('create',n.id);Snd.play('pop');
 if(o.rename&&isDesktop(parent))setTimeout(()=>renameInline(n),60);
 if(o.open)openNode(n);return n}catch(e){toast('Nie udało się utworzyć: '+e.message,{type:'error'});return null}}
async function createGoogleFlow(type,parent=DESK){
 if(cloudOk()){const z=rootOf(parent)==='Z',n=await createNode(type,z?parent:'Z');if(!n)return;if(!z)makeShortcut({nodeId:n.id,driveId:n.driveId},n.name);openGoogleDoc(n);return}
 dlg({title:'Dokumenty Google',icon:type,body:'Dokumenty Google są tworzone i edytowane w narzędziach Google. Połącz konto, aby tworzyć je bezpośrednio na Dysku, lub otwórz nowy dokument w przeglądarce.',
 buttons:[{label:'Anuluj'},{label:'Nowy w Google',onClick:()=>window.open({gdoc:'https://docs.new',gsheet:'https://sheets.new',gslides:'https://slides.new'}[type],'_blank','noopener')},{label:'Połącz konto',primary:true,onClick:()=>openSettings('drive')}]})}
function makeShortcut(target,name,cell){const n={id:uid(),type:'shortcut',name:uniqueName(DESK,name||'Skrót'),parent:DESK,origin:'local',target,created:Date.now(),modified:Date.now(),pos:findFreeCell(cell)};
 state.nodes[n.id]=n;commit('create',n.id);Snd.play('pop');return n}
function trashNodes(ids){const set=new Set(ids),top=ids.map(N).filter(n=>n&&!n.system&&!n.trashed&&!ids.some(o=>o!==n.id&&set.has(o)&&desc(o).some(d=>d.id===n.id))),done=[];
 top.forEach(n=>{n.trashed=true;n.trashedAt=Date.now();n.restoreParent=n.parent;done.push(n.id);if(n.driveId&&cloudOk()&&n.origin==='google')Drive.trashReal(n).catch(()=>{})});
 if(done.length){commit('trash');Snd.play('trash')}return done}
function deleteFlow(ids){ids=ids.filter(id=>N(id)&&!N(id).system);
 const appNode=ids.map(N).find(n=>n.type==='app'&&state.apps[n.app]);
 if(appNode&&ids.length===1)return void deleteApp(appNode.app);
 const real=ids.map(N).filter(n=>n.driveId&&rootOf(n.id)==='Z'&&n.origin==='google'&&cloudOk()),local=ids.filter(id=>!real.some(r=>r.id===id));
 if(local.length){const done=trashNodes(local);done.length&&toast('Przeniesiono '+done.length+' elementów do kosza.',{action:{label:'Cofnij',fn:()=>restoreNodes(done)}})}
 if(real.length)confirmDlg('Usunąć '+real.length+' elementów z Dysku Google? Trafią do kosza Google.',{danger:true,okLabel:'Usuń'}).then(async ok=>{
 if(!ok)return;for(const n of real)try{await Drive.trashReal(n);delete state.nodes[n.id]}catch(e){toast(e.message,{type:'error'})}commit('trash')})}
function restoreNodes(ids,quiet){
 const rec=ids.map(N).find(n=>n&&n.type==='app'&&state.appTrash?.[n.app]);
 if(rec&&!quiet)return void restoreApp(rec.app);
 ids.forEach(id=>{let n=N(id),root=n,g=0;while(root&&!root.trashed&&g++<90)root=N(root.parent);
 if(!root?.trashed){if(n)delete n.trashed}
 else{root.trashed=false;if(!N(root.restoreParent)&&!['C','Z'].includes(root.restoreParent))root.restoreParent=DESK;
 root.parent=root.restoreParent||DESK;if(isDesktop(root.parent))root.pos=findFreeCell(null,new Set([root.id]))}
 if(n){delete n.trashed;if(n.driveId&&cloudOk())Drive.untrashReal(n).catch(()=>{})}});
 commit('restore');if(!quiet)toast('Przywrócono elementy.',{type:'success',timeout:2400})}
async function purgeNodes(ids){state.tombstones||={};
 for(const id of ids){const n=N(id);if(!n)continue;
 for(const x of[n,...desc(id)]){if(x.blobKey)await Blobs.del(x.blobKey);
 if(x.type==='app'&&state.appTrash?.[x.app]){const r=state.appTrash[x.app];if(r.app?.htmlKey)await Blobs.del(r.app.htmlKey);delete state.appTrash[x.app]}
 if(x.driveId&&cloudOk()&&x.origin==='google')Drive.trashReal(x).catch(()=>{});
 state.tombstones[x.id]=Date.now();delete state.nodes[x.id]}}
 commit('purge')}
async function emptyTrash(){const ids=Object.values(state.nodes).filter(n=>n.trashed).map(n=>n.id),arch=Object.keys(state.appTrash||{});
 if(!ids.length&&!arch)return toast('Kosz jest już pusty.');
 if(await confirmDlg('Trwale usunąć '+ids.length+' elementów'+(arch?' oraz '+arch+' zarchiwizowanych aplikacji':'')+'?',{title:'Opróżnij kosz',danger:true,okLabel:'Usuń trwale'})){
 await purgeNodes(ids);for(const id of arch){const r=state.appTrash[id];if(r?.app?.htmlKey)await Blobs.del(r.app.htmlKey);delete state.appTrash[id]}
 save();bus.emit('apps');toast('Kosz został opróżniony.',{type:'success'})}}
function moveNodes(ids,dest,pt){ids=ids.filter(id=>N(id)&&!N(id).system);if(!ids.length)return;
 if(!['C','Z'].includes(dest)){const d=N(dest);if(!d||d.type!=='folder')return toast('Cel musi być folderem.',{type:'warn'});
 if(ids.includes(dest)||ids.some(id=>desc(id).some(d=>d.id===dest)))return toast('Nie można przenieść folderu do jego wnętrza.',{type:'warn'})}
 const dr=['C','Z'].includes(dest)?dest:rootOf(dest),prev=[];let blocked=0;
 ids.forEach(id=>{const n=N(id);if(rootOf(id)!==dr){blocked++;return}if(n.parent===dest)return;
 prev.push({id,parent:n.parent,pos:n.pos});
 if(n.driveId&&cloudOk()&&n.origin==='google')Drive.moveReal(n,dest).catch(e=>toast(e.message,{type:'error'}));
 n.parent=dest;n.modified=Date.now();
 if(isDesktop(dest))n.pos=pt&&!state.settings.snap?{x:clamp(pt.x-40,0,innerWidth-90),y:clamp(pt.y-30,0,innerHeight-150)}:findFreeCell(null,new Set(ids));else delete n.pos});
 blocked&&toast('Nie można przenosić między C: i Z: — utwórz skrót na pulpicie.',{type:'warn'});
 if(prev.length)commit('move')}
async function copyTree(n,dest){const nn={...n,id:uid(),parent:dest,name:uniqueName(dest,n.name),created:Date.now(),modified:Date.now()};
 delete nn.trashed;delete nn.driveId;delete nn.webViewLink;delete nn.remoteParent;delete nn.syncSig;
 if(nn.type==='app')delete nn.app;if(n.origin==='google')nn.origin='demo';
 isDesktop(dest)?nn.pos=findFreeCell():delete nn.pos;
 if(n.blobKey){const b=await Blobs.get(n.blobKey);if(b){nn.blobKey=uid();await Blobs.put(nn.blobKey,b)}}
 state.nodes[nn.id]=nn;
 for(const c of Object.values(state.nodes).filter(x=>x.parent===n.id&&!x.trashed))await copyTree(c,nn.id);
 return nn}
async function pasteClipboard(dest){if(!clipboard.ids.length)return;const ids=clipboard.ids.filter(id=>N(id));
 if(clipboard.mode==='cut'){moveNodes(ids,dest);clipboard={mode:null,ids:[]};renderDesktop();return}
 let count=0;for(const id of ids){const n=N(id);try{if(rootOf(id)===rootOf(dest)){await copyTree(n,dest);count++}else makeShortcut({nodeId:id,driveId:n.driveId},n.name)}catch(e){toast(e.message,{type:'error'})}}
 count&&commit('paste')}
async function nodeBlob(n){if(n.type==='app'){const a=state.apps[n.app];return a?new Blob([a.html||''],{type:'text/html'}):null}
 if(n.content!=null)return new Blob([n.content],{type:n.mime||'text/plain'});
 if(n.inline)return(await fetch(n.inline)).blob();
 if(n.blobKey){const b=await Blobs.get(n.blobKey);if(b)return b}
 if(n.driveId&&cloudOk())return Drive.downloadReal(n);return null}
async function nodeText(n){if(n.content!=null)return n.content;const b=await nodeBlob(n);return b?await b.text():''}
async function downloadNode(n){try{const b=await nodeBlob(n);if(!b)return toast('Brak danych pliku.',{type:'warn'});
 download(b,n.type==='app'?appFileName(state.apps[n.app]?.name||n.name):n.name)}catch(e){toast('Pobieranie nieudane: '+e.message,{type:'error'})}}

(isBat(n)?'<div class="set-row"><button class="btn primary" id="ppRun">'+gl('play',13)+' Uruchom</button><button class="btn" id="ppEdit">'+gl('edit',13)+' Edytuj</button></div>':''));
const inp=$('input',body);inp.value=n.name;
$('#ppRun',body)?.addEventListener('click',()=>runBatNode(n));
$('#ppEdit',body)?.addEventListener('click',()=>openBatEditor(n));
$('#ppIcon',body)?.addEventListener('click',()=>changeNodeIcon(n));
dlg({title:'Właściwości — '+n.name,iconHTML:iconHTML(n,26),body,width:480,buttons:[{label:'Zamknij'},{label:'Zapisz',primary:true,keep:true,onClick:a=>{const v=inp.value.trim();if(v&&v!==n.name&&!n.system)renameNode(n,v);a.close()}}]})}
function openNode(x){const n=typeof x==='string'?N(x):x;if(!n)return;
 if(n.trashed)return toast('Element jest w koszu.',{type:'warn',action:{label:'Przywróć',fn:()=>restoreNodes([n.id])}});
 if(!['folder','system'].includes(n.type)){n.opened=Date.now();recordRecent('node',n.id)}
 if(isBat(n))return runBatNode(n);
 switch(n.type){
 case'system':return openExplorer(n.target==='trash'?'trash':'pc');
 case'folder':return openExplorer(n.id);
 case'text':return openNotepad(n.id);
 case'gdoc':case'gsheet':case'gslides':return openGoogleDoc(n);
 case'app':case'appshortcut':{const d=appDesc(n.type==='app'?'custom:'+n.app:n.app);return d?d.run():toast('Aplikacja została usunięta.',{type:'warn'})}
 case'shortcut':{const t=n.target||{};if(t.url)return void window.open(t.url,'_blank','noopener');
 if(t.app)return openNode({type:'appshortcut',app:t.app,id:n.id,name:n.name});
 const target=resolveTarget(n);return target?openNode(target):toast('Cel skrótu jest niedostępny.',{type:'warn'})}
 default:openFileNode(n)}}

async function importDropped(files,parent){let ok=0,cloud=0,err=0;

 else if(isBatName(f.name)||/^text\//.test(f.type)){await importSingle(f.name,mimeOf(f.name),f,{parent,shortcut:false});ok++}
 else{const key=uid();await Blobs.put(key,f);

 else if(fresh||state.fresh){state.fresh=false;save();setTimeout(()=>openNotepad('doc-welcome'),400)}

 if(state.settings.drive.mode==='google'&&state.settings.drive.autoLogin&&state.settings.drive.connected)
