<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#12160f;--p1:#1b2318;--p2:#242e1f;--ln:#3a4630;--tx:#d9d3b8;--dim:#9a9478;--gold:#c9a227;--red:#b04a3a;--blue:#4a7fb5;--olive:#7a8a5a;--paper:#e9dfc6;--ink:#2b2416;--acc:#c9a227}

.btn.red{border-color:var(--red);color:#d98a7a}
.btn.sm{padding:3px 7px;font-size:10px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.big{padding:10px 20px;font-size:13px}
input,select{background:#0e130c;border:1px solid var(--ln);color:var(--tx);padding:5px 8px;font:13px 'Courier New';border-radius:2px}
input[type=range]{padding:0;accent-color:var(--gold)}
.chip{display:inline-flex;gap:5px;align-items:center;background:var(--p2);border:1px solid var(--ln);padding:3px 9px;border-radius:3px;font:12px 'Courier New';white-space:nowrap}
.chip b{color:var(--gold)}
.dim{color:var(--dim)} .gold{color:var(--gold)} .red{color:#d98a7a} .grn{color:#9fbf6f} .blu{color:#8ab4dd}
.small{font-size:12px} .tiny{font-size:11px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}
.card{background:var(--p1);border:1px solid var(--ln);padding:12px;border-radius:2px}
.card h3{font:700 12px 'Courier New';letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-bottom:8px}
.bar{height:8px;background:#0d110b;border:1px solid var(--ln);position:relative;border-radius:2px;overflow:hidden}
.bar i{position:absolute;top:0;left:0;bottom:0;background:var(--olive)}
.bar i.r{background:var(--red)} .bar i.b{background:var(--blue)} .bar i.g{background:var(--gold)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl td,.tbl th{padding:5px 8px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:middle}

#mid{display:flex;flex:1;min-height:0}
#nav{width:170px;background:var(--p1);border-right:1px solid var(--ln);padding:8px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;flex-shrink:0}

.nb.on{background:var(--p2);border-left-color:var(--gold);color:var(--gold)}
#main{flex:1;overflow-y:auto;padding:14px;min-width:0}
#tick{height:28px;background:#0c100a;border-top:1px solid var(--ln);display:flex;align-items:center;overflow:hidden;font:12px 'Courier New';color:var(--dim);flex-shrink:0}

#ov{position:fixed;inset:0;background:rgba(4,7,3,.78);display:none;align-items:center;justify-content:center;z-index:50}
#ov.on{display:flex}
#modal{background:var(--p1);border:1px solid var(--gold);max-width:760px;width:94%;max-height:90vh;overflow-y:auto;box-shadow:0 24px 70px #000;border-radius:3px}

.mb{padding:16px}

.paper p{font-size:13px;margin-bottom:8px;text-align:justify}
.paper .q{border:1px solid var(--ink);padding:8px;font-style:italic;font-size:13px;margin-top:10px;background:rgba(255,255,255,.25)}
.paper .cols{column-count:2;column-gap:18px;column-rule:1px solid #b8a878}

.cty{stroke:#0a0f14;stroke-width:1.4;cursor:pointer;transition:filter .15s}
.cty:hover{filter:brightness(1.35)}
.cty.me{stroke:var(--gold);stroke-width:2.6}
.front{stroke-dasharray:7 5;animation:dash 1.1s linear infinite;pointer-events:none}

#mapwrap{background:#0f1720;border:1px solid var(--ln);border-radius:2px}
#menu{height:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:22px;background:radial-gradient(1100px 560px at 50% -8%,#2b3622,#12160f)}
.poster{text-align:center;margin-bottom:14px}
.poster .t1{font:700 13px 'Courier New';letter-spacing:6px;color:var(--dim)}
.poster .t2{font:900 44px 'Courier New';letter-spacing:4px;color:var(--gold);text-shadow:0 3px 0 #000;line-height:1.05}
.poster .t3{font:700 12px 'Courier New';letter-spacing:3px;color:var(--tx);margin-top:4px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:7px;width:100%;max-width:1150px}
.cb{background:var(--p1);border:1px solid var(--ln);padding:7px 8px;cursor:pointer;text-align:left;color:var(--tx);border-radius:2px;font-size:12px}
.cb:hover{border-color:var(--dim)}
.cb.on{border-color:var(--gold);background:var(--p2);box-shadow:0 0 0 1px var(--gold)}
.cb .fl{font-size:20px}
.cb .st{color:var(--gold);font-size:10px;letter-spacing:1px}
#toasts{position:fixed;right:12px;bottom:38px;z-index:99;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{background:var(--p2);border:1px solid var(--gold);border-left-width:4px;padding:8px 12px;font:12px 'Courier New';max-width:330px;animation:tin .18s;border-radius:2px;box-shadow:0 6px 20px #000}
@keyframes tin{from{transform:translateX(30px);opacity:0}}
#load{position:fixed;inset:0;background:#0b0f09;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:100;text-align:center;padding:24px}
#load .q{max-width:640px;font:italic 18px Georgia;color:var(--paper);margin:18px 0}
#load .a{font:700 12px 'Courier New';letter-spacing:2px;color:var(--gold)}
.fbar{height:16px;background:linear-gradient(90deg,var(--blue) 0 50%,var(--red) 50% 100%);border:1px solid var(--ln);position:relative;border-radius:2px}
.fbar .mk{position:absolute;top:-3px;bottom:-3px;width:4px;background:var(--gold);box-shadow:0 0 6px var(--gold)}
.fbar .zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#000}
.tag{display:inline-block;padding:1px 7px;border-radius:2px;font:700 10px 'Courier New';letter-spacing:1px;border:1px solid}
.tag.ali{color:#8ab4dd;border-color:#4a7fb5}.tag.osi{color:#c9c9c9;border-color:#777}.tag.kom{color:#e08a8a;border-color:#b03a3a}.tag.neu{color:#b5c48a;border-color:#7a8a5a}
.tag.war{color:#ffd27a;border-color:var(--red);background:rgba(176,74,58,.2)}
hr.d{border:none;border-top:1px dashed var(--ln);margin:10px 0}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--ln);border-radius:4px}::-webkit-scrollbar-track{background:#0d110b}
@media(max-width:820px){#nav{width:100%;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:5px}#mid{flex-direction:column}.nb{white-space:nowrap;border-left:1px solid transparent;border-bottom:3px solid transparent}.nb.on{border-left-color:transparent;border-bottom-color:var(--gold)}}

const OS=(function(){let i=0;const p={},ev={};addEventListener("message",function(e){const d=e.data;if(!d||d.channel!=="pulpitos")return;if(d.id!=null&&p[d.id]){const f=p[d.id];delete p[d.id];d.ok?f.res(d.result):f.rej(new Error(d.error))}else if(d.event&&ev[d.event])ev[d.event].forEach(f=>f(d.data))});return{call:function(m,params){return new Promise(function(res,rej){const id=++i;p[id]={res:res,rej:rej};parent.postMessage({channel:"pulpitos",id:id,method:m,params:params||{}},"*")})},on:function(n,f){(ev[n]=ev[n]||[]).push(f)}}})();
let inOS=false;
const api={
 call(m,p){if(!inOS)return Promise.resolve(null);try{return Promise.race([OS.call(m,p),new Promise((_,rj)=>setTimeout(()=>rj(new Error('timeout')),3000))]).catch(()=>null)}catch(e){return Promise.resolve(null)}},
 async state(k,v){if(inOS){const r=await api.call('app.state',v===undefined?{key:k}:{key:k,value:v});return (r&&typeof r==='object'&&'value' in r)?r.value:r}
  try{if(v===undefined){const s=localStorage.getItem('iiws_'+k);return s?JSON.parse(s):null}localStorage.setItem('iiws_'+k,JSON.stringify(v));return v}catch(e){return null}},
 toast(t){if(inOS)api.call('ui.toast',{text:t,message:t});miniToast(t)},
 title(t){document.title=t;if(inOS)api.call('windows.setTitle',{title:t})}
};
function applyTheme(d){try{const a=(d&&(d.accent||d.accentColor||(d.colors&&d.colors.accent)))||null;if(a)document.documentElement.style.setProperty('--acc',a)}catch(e){}}
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rnd(a,b+1));
const fmt=n=>{n=Math.round(n);return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const MIES=['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'];
const dkey=d=>d.y+'-'+String(d.m).padStart(2,'0');
const dstr=d=>MIES[d.m-1]+' '+d.y;
function miniToast(t){const w=$('toasts');if(!w)return;const e=document.createElement('div');e.className='toast';e.textContent=t;w.appendChild(e);setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .4s';setTimeout(()=>e.remove(),450)},4200)}
let AC=null;
function snd(kind){if(!CFG.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime;
 if(kind==='click'){const o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=880;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.07);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+.08)}
 if(kind==='boom'){const b=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.2);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type='lowpass';f.frequency.value=220;g.gain.value=.5;s.buffer=b;s.connect(f).connect(g).connect(AC.destination);s.start(t)}
 if(kind==='morse'){[0,.12,.24,.48].forEach((dt,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=660;const len=i<3?.07:.2;g.gain.setValueAtTime(.07,t+dt);g.gain.setValueAtTime(.07,t+dt+len);g.gain.linearRampToValueAtTime(0,t+dt+len+.02);o.connect(g).connect(AC.destination);o.start(t+dt);o.stop(t+dt+len+.03)})}
 if(kind==='fan'){[523,659,784,1046].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.08,t+i*.13);g.gain.exponentialRampToValueAtTime(.001,t+i*.13+.3);o.connect(g).connect(AC.destination);o.start(t+i*.13);o.stop(t+i*.13+.32)})}
}catch(e){}}

function cc(id){return S.countries[id]}
function pc(){return S.countries[S.player]}
function alive(id){const c=S.countries[id];return c&&c.owner===id&&!c.exiled}
function atWar(a,b){return S.wars.find(w=>(w.x===a&&w.y===b)||(w.x===b&&w.y===a))}
function warP(a,b){const w=atWar(a,b);if(!w)return 0;return w.x===a?w.p:-w.p}
function other(w){return w.x===S.player?w.y:w.x}
function occOf(id){return Object.keys(S.countries).filter(k=>S.countries[k].owner===id&&k!==id)}
function relKey(a,b){return [a,b].sort().join('|')}
function rel(a,b){return S.rel[relKey(a,b)]||0}
function addRel(a,b,v){S.rel[relKey(a,b)]=clamp(rel(a,b)+v,-100,100)}
function hasPact(a,b){return S.pacts.some(p=>(p[0]===a&&p[1]===b)||(p[0]===b&&p[1]===a))}
function spMod(c,key){let m=0;for(const s in c.sp){const d=SPI[s];if(d&&d.m&&d.m[key])m+=d.m[key]}return m}
function addSp(id,sp,months){const c=cc(id);if(!c)return;c.sp[sp]=months||0}
function rmSp(id,sp){const c=cc(id);if(c)delete c.sp[sp]}

 const fuUse=(sd,cc2)=>{let f=cc2.nv*0.4+cc2.pl*(sd.air/100)*0.02;for(const t in sd.div)f+=sd.div[t]*DT[t].fu*0.7;return f};
 xc.fu=Math.max(0,xc.fu-fuUse(sx,xc));yc.fu=Math.max(0,yc.fu-fuUse(sy,yc));

 if(sy.bomb&&yc.tech.bomb&&airPower(yc,sy.air)>airPower(xc,sx.air)){const dmg=xc.blackout?0.5:1;xc.st=clamp(xc.st-1.5*dmg,0,100);if(Math.random()<0.3)xc.civ=Math.max(1,xc.civ-1)}

 c.eq-=cost;c.mp-=d.mp;c.train.push({type:type,left:d.t});snd('click');render()}

function setScen(v){SCEN=v;SEL=null;showMenu()}

function newGame(pid,scen,mode){
 FAC.ali.lead='gbr';FAC.osi.lead='ger';FAC.kom.lead='sov';
 S={v:1,scen:scen,mode:mode,player:pid,date:scen===1?{y:1936,m:1}:{y:1939,m:9},turn:0,tension:scen===1?15:35,countries:{},wars:[],rel:{},guar:[],pacts:[],news:[],log:[],done:{},hist:{eq:[],pl:[],fu:[]},stats:{kills:0,losses:0,wins:0},exile:false,host:null,occ:null,rpLast:null,over:false};
 Object.keys(C).forEach(k=>S.countries[k]=cloneC(k));
 Object.keys(S.countries).forEach(a=>Object.keys(S.countries).forEach(b=>{if(a>=b)return;const A=C[a],B=C[b];let r=0;if(A.ideo===B.ideo)r=20;if(A.ideo==='dem'&&B.ideo==='dem')r=15;if((A.ideo==='fas'&&B.ideo==='dem')||(A.ideo==='dem'&&B.ideo==='fas'))r=-30;if((A.ideo==='kom'&&B.ideo==='dem')||(A.ideo==='dem'&&B.ideo==='kom'))r=-25;if(A.ideo==='fas'&&B.ideo==='kom')r=-20;S.rel[relKey(a,b)]=r}));
 S.guar=[['gbr','pol'],['fra','pol'],['gbr','gre'],['gbr','rom']];
 if(scen===2){S.pacts=[['ger','sov']];['aut','cze'].forEach(k=>{const c=cc(k);c.owner='ger';c.exiled=true;c.civ=1;c.mil=0;cc('ger').civ+=Math.round(c.base.civ*0.25);cc('ger').mil+=Math.round(c.base.mil*0.25)});
  startWar('jap','chn','Azja',true,true);const w=atWar('jap','chn');if(w)w.p=40;
  news('Wrzesień 1939','Europa na krawędzi. Pakt Ribbentrop–Mołotow podpisany. Gwarancje dla Polski udzielone.')}
 else{startWar('ita','eth','Afryka',true,true);const w=atWar('ita','eth');if(w)w.p=25;
  news('Styczeń 1936','Świat po Wielkim Kryzysie. Liga Narodów słabnie. Włoska armia w Etiopii.')}
 log('🎖️ Kampania rozpoczęta: '+C[pid].n+' ('+(scen===1?'1936':'1939')+', tryb '+(mode==='hist'?'historyczny':'swobodny')+')');
}

function onFileOpen(d){try{const path=d&&(d.path||d.file);if(!path||!path.toLowerCase().endsWith('.json'))return;api.call('fs.read',{path:path}).then(r=>{const txt=typeof r==='string'?r:(r&&(r.content||r.text));if(!txt)return;const o=JSON.parse(txt);if(o&&o.v&&o.countries){S=o;enterGame();api.toast('Wczytano kampanię z pliku')}})}catch(e){}}
document.addEventListener('keydown',e=>{if(!S||$('menu').style.display!=='none')return;
 if(e.key==='Escape')closeModal();
 else if(e.key===' '&&!EQ.length&&$('ov').className.indexOf('on')<0){e.preventDefault();endTurn()}
 else if(/^[1-9]$/.test(e.key)&&!EQ.length){const i=parseInt(e.key)-1;if(TABS[i])setTab(TABS[i][0])}});
(async function(){
 try{var l=document.createElement('link');l.rel='icon';l.href=APP_ICON_SVG;document.head.appendChild(l)}catch(e){}
 try{showMenu()}catch(e){}
 try{const info=await Promise.race([OS.call('system.info'),new Promise((_,rj)=>setTimeout(()=>rj(new Error('t')),1200))]);inOS=!!info}catch(e){inOS=false}
 if(inOS){OS.on('theme.change',applyTheme);OS.on('quickAction',d=>{const id=d&&(d.id||d.action);if(id==='tura')endTurn();if(id==='zapis')quickSave()});OS.on('file.open',onFileOpen);
  setupAppShell();
  const th=await api.call('system.theme');applyTheme(th);
  api.call('apps.quickActions',{actions:[{id:'tura',label:'⏭ Następna tura'},{id:'zapis',label:'💾 Zapisz grę'}]})}
 try{CFG=(await api.state('cfg'))||CFG}catch(e){}
 try{ACH=(await api.state('ach'))||{}}catch(e){}
 try{AUTO=await api.state('auto')}catch(e){}
 try{showMenu()}catch(e){}
})();
</script>
<script>
/* ===== 🎓 SAMOUCZEK + PRZEWODNIK SZTABOWCA ===== */
(function(){
if(window.__IIWS_TUT)return;window.__IIWS_TUT=1;
var TUT={on:false,i:0,done:false,base:0,offer:false};
try{api.state('tut').then(function(r){if(r&&r.done)TUT.done=true})}catch(e){}
var css=document.createElement('style');css.textContent=
'#tutPanel{position:fixed;left:10px;bottom:36px;z-index:45;width:350px;max-width:calc(100% - 20px);background:var(--p1);border:1px solid var(--gold);border-left:5px solid var(--gold);box-shadow:0 10px 40px #000;padding:12px;display:none;font-size:13px;border-radius:3px}'+
'#tutPanel h4{font:700 12px "Courier New";letter-spacing:1px;color:var(--gold);text-transform:uppercase;margin-bottom:6px}'+
'#tutPanel .tx{margin:6px 0 8px;line-height:1.55}'+
'#tutFab{position:fixed;left:10px;bottom:36px;z-index:44;display:none}'+
'.tut-hl{outline:2px solid var(--gold)!important;outline-offset:1px;animation:tutPulse 1s infinite}'+
'@keyframes tutPulse{50%{outline-color:#fff}}';
document.head.appendChild(css);
var panel=document.createElement('div');panel.id='tutPanel';document.body.appendChild(panel);
var fab=document.createElement('button');fab.id='tutFab';fab.className='btn sm gold';fab.textContent='🎓 Samouczek';fab.onclick=function(){tutMenu()};document.body.appendChild(fab);
function sumAlloc(){var a=pc().alloc;return a.eq+a.air+a.nav+a.fu}
function armyTot(){var t=0;for(var k in pc().army)t+=pc().army[k];return t}
var steps=[
{tab:null,h:'Witaj w Sztabie Głównym!',x:'Ten samouczek przeprowadzi Cię przez wszystkie mechaniki na spokojnej kampanii <b>Szwajcarii</b> (neutralnej).<br><br>★ przy państwach = <b>TRUDNOŚĆ</b> kampanii, nie siła! Niemcy ★ = najłatwiej (potęga), Polska ★★★★★ = najtrudniej.',ok:null},
{tab:null,hlTop:1,h:'Pasek zasobów',x:'U góry: ⭐PP (polityka), 🏭fabryki cywilne/wojskowe, 👥rezerwy, ⛽paliwo, 📦wyposażenie, ✈️samoloty, 🔥poparcie wojny, 🏛️stabilność, 🌡️napięcie światowe.',ok:null},
{tab:'prod',h:'Zakładka Produkcja',x:'Kliknij po lewej <b>🏭 Produkcja</b> (podświetlona).',ok:function(){return TAB==='prod'}},
{tab:'prod',h:'Suwaki fabryk',x:'Przesuń dowolny suwak — dzielisz fabryki wojskowe między 📦wyposażenie, ✈️samoloty, 🚢flotę i ⛽paliwo.',init:sumAlloc,ok:function(b){return sumAlloc()!==b}},
{tab:'prod',h:'Budowa',x:'Kliknij <b>🏭 Cywilna</b> (lub inną budowę). Kosztuje 📦, trwa kilka miesięcy.',init:function(){return pc().build.length+pc().civ+pc().mil},ok:function(b){return pc().build.length+pc().civ+pc().mil>b}},
{tab:'army',h:'Zakładka Armia',x:'Otwórz <b>🪖 Armia</b>.',ok:function(){return TAB==='army'}},
{tab:'army',h:'Wyszkol dywizję',x:'Kliknij <b>🪖 piechoty</b> w sekcji „Nowa dywizja". Koszt: 📦100 + 👥12. Po miesiącach trafi do armii.',init:function(){return pc().train.length+armyTot()},ok:function(b){return pc().train.length+armyTot()>b}},
{tab:'res',h:'Zakładka Badania',x:'Otwórz <b>🔬 Badania</b>.',ok:function(){return TAB==='res'}},
{tab:'res',h:'Rozpocznij badanie',x:'Kliknij „Otwórz drzewko badań", wybierz technologię i <b>Badaj</b>. Sloty działają równolegle.',init:function(){return pc().res.length+Object.keys(pc().tech).length},ok:function(b){return pc().res.length+Object.keys(pc().tech).length>b}},
{tab:'dip',h:'Zakładka Dyplomacja',x:'Otwórz <b>🤝 Dyplomacja</b> i kliknij <b>Panel</b> przy dowolnym państwie.',ok:function(){return TAB==='dip'}},
{tab:'dip',h:'Popraw relacje',x:'W panelu państwa kliknij <b>🤝 Popraw (+15, 10 PP)</b>. Relacje otwierają pakty i sojusze.',init:function(){return pc().pp},ok:function(b){return pc().pp<b-5}},
{tab:'dec',h:'Decyzje polityczne',x:'Otwórz <b>📜 Decyzje</b> i podpisz dowolną (np. Kampania propagandowa).',init:function(){return pc().pp},ok:function(b){return pc().pp<b-5}},
{tab:null,h:'Pierwsza tura!',x:'Kliknij <b>⏭ Następna tura</b> (lub Spacja). Rozliczą się dochody, produkcja, badania i wydarzenia. Przeczytaj raport i zamknij go.',init:function(){return S.turn},ok:function(b){return S.turn>b}},
{tab:'news',h:'Kurier Wojenny',x:'Otwórz <b>📰 Prasa</b> — gazetka z nagłówkami miesiąca i cytatem epoki.',ok:function(){return TAB==='news'}},
{tab:'stats',h:'Statystyki i osiągnięcia',x:'Otwórz <b>📊 Statystyki</b> — wynik, wykresy produkcji i 🏅 osiągnięcia.',ok:function(){return TAB==='stats'}},
{tab:null,h:'Gotowy do dowodzenia!',x:'Znasz już wszystkie mechaniki. Na froncie pamiętaj: przydzielaj dywizje (+/−), ustaw lotnictwo i dowódcę — rezerwa broni stolicy. Powodzenia, Generale!',ok:null,fin:1}
];
function clearHl(){Array.from(document.querySelectorAll('.tut-hl')).forEach(function(e){e.classList.remove('tut-hl')})}
function renderPanel(){var s=steps[TUT.i];
 panel.innerHTML='<h4>🎓 Samouczek — krok '+(TUT.i+1)+'/'+steps.length+'</h4><div class="bar"><i class="g" style="width:'+(TUT.i/steps.length*100)+'%"></i></div><b class="gold">'+s.h+'</b><div class="tx">'+s.x+'</div><div class="row">'+(s.ok?'<span class="tiny dim">⏳ Czekam na wykonanie zadania…</span>':'<button class="btn sm gold" onclick="window.__tutNext()">'+(s.fin?'Zakończ 🎓':'Dalej ➜')+'</button>')+'<button class="btn sm" onclick="window.__tutSkip()">Pomiń</button><button class="btn sm red" onclick="window.__tutEnd()">✕</button></div>';
 panel.style.display='block'}
function advance(){TUT.i++;if(TUT.i>=steps.length){finish();return}TUT.base=steps[TUT.i].init?steps[TUT.i].init():0;renderPanel();snd('click')}
function finish(){TUT.on=false;TUT.done=true;try{api.state('tut',{done:1})}catch(e){}panel.style.display='none';clearHl();snd('fan');
 modal('🎓 SAMOUCZEK UKOŃCZONY','<div class="paper"><h4>Gratulacje, Generale!</h4><p>Przeszedłeś wszystkie mechaniki: produkcję, armię, badania, dyplomację, decyzje, turę, prasę i statystyki.</p><p><b>Polecane pierwsze kampanie:</b> 🇩🇪 Niemcy (★ łatwa, Blitzkrieg), 🇷🇺 ZSRR (★★ łatwa, głębia), 🇬🇧 W. Brytania (★★ wyspa+flota). 🇵🇱 Polska (★★★★★) — dla ambitnych: Westerplatte, Anders, 303, Monte Cassino, Wojtek i Godzina W!</p><div class="q">„'+Q[12][0]+'" — '+Q[12][1]+'</div></div><button class="btn gold" style="width:100%;margin-top:10px" onclick="backToMenu()">🏳️ Wybierz prawdziwe państwo</button><button class="btn" style="width:100%;margin-top:8px" onclick="closeModal()">▶️ Graj dalej jako Szwajcaria</button>')}
function startTut(){closeModal();if(!S){TUT.on=true;newGame('che',2,'hist');enterGame()}else{TUT.on=true}TUT.i=0;TUT.base=steps[0].init?steps[0].init():0;renderPanel();api.toast('🎓 Samouczek rozpoczęty!')}
function tutMenu(){modal('🎓 SZKOLENIE SZTABOWE','<div class="grid g2"><button class="btn gold" onclick="window.__tutStart()">🎓 Samouczek interaktywny (16 kroków)</button><button class="btn" onclick="window.__tutGuide()">📖 Przewodnik sztabowca</button></div><div class="small dim" style="margin-top:10px">Samouczek prowadzi za rękę na kampanii Szwajcarii (neutralnej) — podświetla zakładki i czeka, aż wykonasz zadanie.</div>')}
function guide(){modal('📖 PRZEWODNIK SZTABOWCA','<div class="small" style="line-height:1.75">'+
'<b class="gold">★ GWIAZDKI = TRUDNOŚĆ, nie siła!</b><br>1★ = łatwo (Niemcy, USA — potęgi), 5★ = hardcore (Polska, Luksemburg). Im więcej gwiazdek, tym ciężiej przetrwać. Wskaźnik 💪 Potęga pokazuje siłę przemysłu.<br><hr class="d">'+
'<b class="gold">CEL:</b> przetrwaj i zwycięż jako dowolne państwo. Tura = 1 miesiąc.<br>'+
'<b class="gold">FRONT:</b> pasek −100…+100. +100 = kapitulacja wroga, −100 = twoja. Przydzielaj dywizje (+/−), lotnictwo (%) i dowódcę. Rezerwa broni stolicy. Głębokie kraje (ZSRR/USA/Chiny) padają wolniej.<br>'+
'<b class="gold">PRODUKCJA:</b> suwaki dzielą fabryki wojskowe. Prawa mobilizacji (×0.8→×1.4) i poboru zwiększają output. Buduj fabryki/fortyfikacje/radar za 📦.<br>'+
'<b class="gold">BADANIA:</b> sloty równoległe. Czołgi, doktryny, radar, kryptologia (deszyfraż), Manhattan (USA), V-2 (Niemcy).<br>'+
'<b class="gold">DYPLOMACJA:</b> relacje→pakty→gwarancje→frakcje. Demokracje nie atakują pierwsze bez poparcia ≥50 lub napięcia ≥60. Lend-Lease dla sojuszników.<br>'+
'<b class="gold">WYWIAD:</b> odsłania dokładne dane wroga (inaczej szacunki ~±30%), sabotaż, deszyfraż, partyzantka.<br>'+
'<b class="gold">PALIWO:</b> czołgi i lotnictwo piją ⛽. Bez paliwa −40% siły. Producenci ropy (ZSRR/USA/Rumunia/Iran) mają wydobycie; inni importują flotą (blokada!).<br>'+
'<b class="gold">UCHODŹSTWO:</b> po kapitulacji walcz dalej u boku sojusznika. Polska: Anders, Dywizjon 303, Monte Cassino, Wojtek 🐻, Godzina W — i wyzwolenie!<br>'+
'<b class="gold">SKRÓTY:</b> Spacja = tura, Esc = zamknij, 1–9 = zakładki.<br><hr class="d">'+
'<b class="gold">TAKTYKI:</b> Niemcy — Blitzkrieg pan+lotnictwo, pilnuj ropy i dwóch frontów. ZSRR — przetrwaj 1941, kontratakuj po Stalingradzie. USA — obudź się po Pearl Harbor, buduj flotę na Pacyfik. W. Brytania — radar+flota, przetrwaj Blitz. Polska — fortyfikacje+góry+rezerwa, potem uchodźstwo.</div>')}
window.__tutStart=startTut;window.__tutGuide=guide;window.__tutNext=advance;window.__tutSkip=advance;
window.__tutEnd=function(){TUT.on=false;panel.style.display='none';clearHl();api.toast('Samouczek przerwany — wrócisz przez 🎓')};
setInterval(function(){
 var inGame=(typeof S!=='undefined')&&S&&document.getElementById('menu').style.display==='none';
 fab.style.display=(inGame&&!TUT.on)?'block':'none';
 if(!TUT.on||!inGame){panel.style.display='none';clearHl();return}
 var s=steps[TUT.i];clearHl();
 if(s.tab){var idx=TABS.findIndex(function(t){return t[0]===s.tab});var nb=document.querySelectorAll('.nb')[idx];if(nb)nb.classList.add('tut-hl')}
 if(s.hlTop){var t=document.getElementById('top');if(t)t.classList.add('tut-hl')}
 if(s.ok&&s.ok(TUT.base))advance();
},400);
/* dopisz przyciski i legendę do menu głównego */
var origShow=showMenu;
showMenu=function(){origShow();try{injectMenu()}catch(e){}};
function injectMenu(){var m=document.getElementById('menu');if(!m)return;
 if(!document.getElementById('tutMenuRow')){var row=document.createElement('div');row.id='tutMenuRow';row.className='row';row.style.margin='0 0 10px';
  row.innerHTML='<button class="btn gold" onclick="window.__tutStart()">🎓 Samouczek interaktywny</button><button class="btn" onclick="window.__tutGuide()">📖 Przewodnik sztabowca</button><span class="chip">★ = <b>trudność</b> kampanii, nie siła!</span>';
  m.insertBefore(row,m.children[1]||null)}
 Array.from(m.querySelectorAll('.cb .st')).forEach(function(el){el.title='Trudność kampanii: 1★ łatwa … 5★ bardzo trudna (nie siła państwa!)'});
 if(SEL&&C[SEL]){var sb=Array.from(m.querySelectorAll('button')).find(function(b){return b.textContent.indexOf('Rozpocznij kampanię')>=0});
  if(sb){var card=sb.closest('.card');if(card&&!card.querySelector('.tutPow')){var c=C[SEL];var pow=clamp(Math.round((c.civ+c.mil)/7),1,10);
   var r=document.createElement('div');r.className='row tutPow';r.style.marginTop='6px';
   r.innerHTML='<span class="chip">🎯 Trudność: <b>'+c.dif+'/5</b> (1=łatwo, 5=hardcore)</span><span class="chip">💪 Potęga: <b>'+pow+'/10</b></span>';
   card.insertBefore(r,sb)}}}}
try{injectMenu()}catch(e){}
/* oferta samouczka przy pierwszej kampanii + przycisk w menu ☰ */
var origEnter=enterGame;
enterGame=function(){origEnter();setTimeout(function(){if(!TUT.done&&!TUT.on&&!TUT.offer){TUT.offer=true;
 modal('🎓 Pierwsza kampania?','<div class="paper"><h4>Witaj, Generale!</h4><p>Chcesz, żebym przeprowadził Cię przez mechaniki krok po kroku? Samouczek uruchomi się na tej kampanii i będzie podświetlał, co kliknąć.</p></div><button class="btn gold" style="width:100%;margin-top:10px" onclick="window.__tutStart()">🎓 Tak, poprowadź mnie</button><button class="btn" style="width:100%;margin-top:8px" onclick="closeModal()">Nie, gram sam</button>')}},600)};
var origMM=openMenuModal;
openMenuModal=function(){origMM();var g=document.querySelector('#modal .grid');if(g&&!document.getElementById('tutMMbtn')){var b=document.createElement('button');b.id='tutMMbtn';b.className='btn';b.textContent='🎓 Samouczek / Przewodnik';b.onclick=function(){closeModal();tutMenu()};g.appendChild(b)}};
})();
</script>
