<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PulpitOS 1.14 — Web Desktop</title>
<style>
/* ============================================================
   PulpitOS — design tokens
   ============================================================ */
:root{
  --accent:#4cc2ff; --accent-rgb:76,194,255; --accent2:#7c5cff;
  --bg:#070d1a;
  --surface:rgba(20,28,45,.88);
  --solid:#151d2d;
  --solid2:#0f1626;
  --stroke:rgba(255,255,255,.10);
  --stroke2:rgba(255,255,255,.19);
  --text:#eef5ff; --dim:#9caac1; --dim2:#66758e;
  --ok:#57d977; --warn:#ffc83d; --danger:#ff5d6c; --info:#4cc2ff;
  --tb:50px;
  --shadow:0 24px 70px rgba(0,0,0,.6), 0 2px 10px rgba(0,0,0,.45);
  --font:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Inter,Roboto,Arial,sans-serif;
  --mono:"Cascadia Code",Consolas,"SF Mono",Menlo,monospace;
}
html[data-theme=light]{
  --bg:#e6ecf6;
  --surface:rgba(250,252,255,.90);
  --solid:#f7f9fd; --solid2:#eef3fa;
  --stroke:rgba(16,28,48,.11); --stroke2:rgba(16,28,48,.18);
  --text:#111a2a; --dim:#4e5d75; --dim2:#77869e;
  --shadow:0 22px 62px rgba(38,54,86,.22), 0 2px 10px rgba(38,54,86,.12);
}

/* ============================================================
   Base
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{
  font-family:var(--font); font-size:13.5px; color:var(--text);
  background:var(--bg); user-select:none; -webkit-font-smoothing:antialiased;
}
input,textarea,[contenteditable]{user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.ico{display:block;flex:none}
.gl{display:inline-flex;flex:none}
.hidden-input{display:none}

::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:rgba(var(--accent-rgb),.06)}
::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,rgba(var(--accent-rgb),.55),rgba(124,92,255,.5));
  border-radius:10px;border:3px solid transparent;background-clip:padding-box;
}
::-webkit-scrollbar-thumb:hover{
  background:linear-gradient(180deg,var(--accent),var(--accent2));background-clip:padding-box;
}
*{scrollbar-width:thin;scrollbar-color:rgba(var(--accent-rgb),.6) rgba(var(--accent-rgb),.07)}

/* ============================================================
   Wallpaper + desktop
   ============================================================ */
#wallA,#wallB{position:fixed;inset:0;background-size:cover;background-position:center;transition:opacity .8s;z-index:0}
#wallB{opacity:0}
#desktop{position:fixed;inset:0 0 var(--tb);z-index:1;overflow:hidden}
#icons{position:absolute;inset:0}

.dicon{
  position:absolute;width:88px;display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:8px 4px 6px;border-radius:10px;border:1px solid transparent;touch-action:none;
}
.dicon:hover{background:rgba(255,255,255,.13)}
.dicon.selected{background:rgba(var(--accent-rgb),.30);border-color:rgba(var(--accent-rgb),.70)}
.dicon.dragging{opacity:.55;z-index:80}
.dicon.cut{opacity:.45}
.dicon.enter{animation:iconEnter .45s cubic-bezier(.2,1.2,.4,1) backwards}
@keyframes iconEnter{from{transform:translateY(14px) scale(.86);opacity:0}}
.dicon-img{position:relative;filter:drop-shadow(0 3px 7px rgba(0,0,0,.55))}
.dicon-label{
  max-width:100%;font-size:12px;line-height:1.25;text-align:center;color:#fff;
  text-shadow:0 1px 3px #000,0 0 8px #000;display:-webkit-box;-webkit-line-clamp:2;
  -webkit-box-orient:vertical;overflow:hidden;word-break:break-word;
}
.sc-badge{
  position:absolute;left:-4px;bottom:-3px;width:16px;height:16px;border-radius:4px;
  background:#f4f8ff;color:#1b5eb8;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px #0009;
}
.sc-badge.url{background:#e9f7ff;color:#0b6fa8}
.rename-input{
  width:100%;font-size:12px;text-align:center;background:#0d1526;color:#fff;
  border:1px solid var(--accent);border-radius:5px;padding:2px 3px;
}
.drop-target{background:rgba(var(--accent-rgb),.34)!important;border-color:var(--accent)!important;outline:1px solid var(--accent)}
.drop-trash{background:rgba(255,93,108,.30)!important;border-color:var(--danger)!important;outline:1px solid var(--danger)}

#marquee,.select-box{
  position:absolute;border:1px solid var(--accent);background:rgba(var(--accent-rgb),.18);
  z-index:90;pointer-events:none;border-radius:3px;
}
#snapPreview{
  position:fixed;z-index:95;display:none;background:rgba(var(--accent-rgb),.18);
  border:2px solid rgba(var(--accent-rgb),.8);border-radius:12px;backdrop-filter:blur(4px);
  pointer-events:none;transition:.12s;
}
#dropHint{
  position:fixed;z-index:96;display:none;left:50%;bottom:calc(var(--tb) + 14px);
  transform:translateX(-50%);padding:6px 14px;border-radius:20px;font-size:11.5px;font-weight:700;
  background:rgba(var(--accent-rgb),.16);border:1px solid rgba(var(--accent-rgb),.45);
  color:var(--accent);backdrop-filter:blur(10px);pointer-events:none;
}
#dropHint.on{display:block}

/* drag ghost */
.drag-ghost{
  position:fixed;z-index:9400;pointer-events:none;display:flex;flex-direction:column;
  align-items:flex-start;gap:4px;filter:drop-shadow(0 8px 18px #000a);
}
.dg-icons{display:flex}
.dg-ico{margin-left:-10px}
.dg-ico:first-child{margin-left:0}
.dg-count{
  background:var(--accent);color:#06111e;border-radius:10px;padding:1px 6px;
  font-size:10px;font-weight:800;margin-left:-8px;margin-top:-4px;
}
.dg-tag{
  display:flex;align-items:center;gap:6px;background:var(--solid);border:1px solid var(--stroke2);
  border-radius:8px;padding:4px 9px;font-size:11.5px;font-weight:700;white-space:nowrap;
}
.dg-tag.move{color:var(--accent);border-color:rgba(var(--accent-rgb),.6)}
.dg-tag.trash{color:var(--danger);border-color:rgba(255,93,108,.6)}
.dg-tag.link{color:var(--ok);border-color:rgba(87,217,119,.55)}
.dg-tag.block{color:var(--warn);border-color:rgba(255,200,61,.6)}
.dg-tag.place{color:var(--text);border-color:var(--stroke2)}

/* ============================================================
   Windows
   ============================================================ */
.win{
  position:absolute;display:flex;flex-direction:column;min-width:320px;min-height:200px;
  background:var(--surface);backdrop-filter:blur(28px) saturate(1.45);
  border:1px solid var(--stroke2);border-radius:12px;box-shadow:var(--shadow);
  overflow:hidden;animation:winIn .2s cubic-bezier(.2,1.2,.4,1);
}
@keyframes winIn{from{opacity:0;transform:scale(.94)}}
.win.closing{animation:winOut .15s forwards}
@keyframes winOut{to{opacity:0;transform:scale(.95)}}
.win.active{border-color:rgba(var(--accent-rgb),.5);box-shadow:0 28px 84px rgba(0,0,0,.62),0 0 0 1px rgba(var(--accent-rgb),.18)}
.win.max{left:0!important;top:0!important;width:100vw!important;height:calc(100vh - var(--tb))!important;border-radius:0}
.win.hidden{display:none}
.win.dragging .win-body,.win.resizing .win-body{pointer-events:none}
.win.fixed .rz,.win.fixed .maxb{display:none}

.titlebar{
  height:40px;flex:none;display:flex;align-items:center;gap:9px;padding:0 6px 0 12px;
  background:rgba(255,255,255,.04);border-bottom:1px solid var(--stroke);touch-action:none;
}
.win.active .titlebar{background:rgba(var(--accent-rgb),.10)}
.win-title{flex:1;min-width:0;font-size:12.5px;font-weight:650;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.win.active .win-title{color:var(--text)}
.win-btns{display:flex;gap:2px}
.wb{width:42px;height:30px;border-radius:7px;color:var(--dim);display:flex;align-items:center;justify-content:center}
.wb:hover{background:rgba(255,255,255,.13);color:var(--text)}
.wb.close:hover{background:#c42b1c;color:#fff}
.win-body{position:absolute;inset:40px 0 0;display:flex;flex-direction:column;overflow:hidden}

.rz{position:absolute;z-index:5;touch-action:none}
.win.max .rz{display:none}
.rz-n{top:-3px;left:10px;right:10px;height:7px;cursor:n-resize}
.rz-s{bottom:-3px;left:10px;right:10px;height:7px;cursor:s-resize}
.rz-e{right:-3px;top:10px;bottom:10px;width:7px;cursor:e-resize}
.rz-w{left:-3px;top:10px;bottom:10px;width:7px;cursor:w-resize}
.rz-ne{top:-3px;right:-3px;width:13px;height:13px;cursor:ne-resize}
.rz-nw{top:-3px;left:-3px;width:13px;height:13px;cursor:nw-resize}
.rz-se{bottom:-3px;right:-3px;width:13px;height:13px;cursor:se-resize}
.rz-sw{bottom:-3px;left:-3px;width:13px;height:13px;cursor:sw-resize}

/* ============================================================
   Taskbar
   ============================================================ */
#taskbar{
  position:fixed;left:0;right:0;bottom:0;height:var(--tb);z-index:5000;display:flex;align-items:center;
  padding:0 7px;background:rgba(11,17,30,.86);backdrop-filter:blur(30px) saturate(1.6);
  border-top:1px solid var(--stroke2);
}
html[data-theme=light] #taskbar{background:rgba(243,247,252,.90)}
.tb-center{
  position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:3px;
  max-width:calc(100vw - 300px);overflow-x:auto;padding:3px 2px;scrollbar-width:none;
}
.tb-center::-webkit-scrollbar{height:0}
.tb-btn{
  position:relative;width:42px;height:42px;flex:none;border-radius:10px;
  display:flex;align-items:center;justify-content:center;transition:background .12s,transform .12s;
}
.tb-btn:hover{background:rgba(255,255,255,.13)}
.tb-btn:active{transform:scale(.92)}
.tb-btn.running::after{
  content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:6px;height:3px;border-radius:2px;background:var(--dim);
}
.tb-btn.active{background:rgba(var(--accent-rgb),.20)}
.tb-btn.active::after{width:17px;background:var(--accent)}
.tb-search{
  height:34px;display:flex;align-items:center;gap:7px;padding:0 13px;border-radius:18px;
  background:rgba(255,255,255,.08);border:1px solid var(--stroke);color:var(--dim);font-size:12px;margin-right:4px;
}
.tb-tray{margin-left:auto;display:flex;align-items:center;height:100%;gap:2px}
.tray-btn{height:40px;border-radius:9px;display:flex;align-items:center;gap:7px;padding:0 9px;color:var(--dim)}
.tray-btn:hover{background:rgba(255,255,255,.11);color:var(--text)}
.sync-chip{font-size:11.5px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--dim2)}
.sync-dot.ok{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.sync-dot.err{background:var(--danger)}
.sync-dot.busy{background:var(--warn);animation:pulse 1s infinite}
.sync-dot.cloud{background:var(--accent2);box-shadow:0 0 8px var(--accent2)}
@keyframes pulse{50%{opacity:.35}}
.clock{flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.3;font-size:11.5px;color:var(--text)}
.clock span:last-child{font-size:10.5px;color:var(--dim)}
.show-desktop{width:9px;height:100%;border-left:1px solid var(--stroke2);margin-left:3px}
.show-desktop:hover{background:rgba(var(--accent-rgb),.28)}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.tray-btn .nm{font-size:11.5px;font-weight:650;color:var(--text);max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:860px){.tray-btn .nm{display:none}}

/* ============================================================
   Start menu
   ============================================================ */
#start{
  position:fixed;left:50%;bottom:calc(var(--tb) + 10px);transform:translateX(-50%) translateY(14px);
  width:640px;max-width:94vw;max-height:min(700px,calc(100vh - 84px));z-index:5200;display:none;
  flex-direction:column;background:var(--surface);backdrop-filter:blur(34px) saturate(1.6);
  border:1px solid var(--stroke2);border-radius:16px;box-shadow:var(--shadow);opacity:0;transition:.16s;
}
#start.open{display:flex;opacity:1;transform:translateX(-50%)}
.start-search{
  margin:18px 20px 6px;display:flex;align-items:center;gap:9px;background:rgba(8,13,25,.6);
  border:1px solid var(--stroke2);border-bottom:2px solid var(--accent);border-radius:10px;padding:9px 13px;
}
.start-search input{flex:1;background:none;border:0;outline:0;color:var(--text);font-size:13px}
.start-scroll{flex:1;overflow-y:auto;padding:8px 20px 14px}
.start-h{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;font-weight:750;margin:12px 2px 9px}
.start-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:2px}
.st-tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:11px 4px 9px;border-radius:10px;font-size:11.3px;text-align:center;line-height:1.25}
.st-tile:hover,.st-row:hover{background:rgba(255,255,255,.11)}
.st-tile span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.st-row{display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border-radius:9px;text-align:left}
.st-row .t{flex:1;min-width:0}
.st-row b{display:block;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-row i{display:block;font-style:normal;font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.start-recent{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.start-empty{padding:26px;text-align:center;color:var(--dim)}
.start-foot{
  flex:none;display:flex;align-items:center;padding:12px 22px;border-top:1px solid var(--stroke);
  background:rgba(8,13,25,.32);border-radius:0 0 16px 16px;
}
.avatar{
  width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--accent),var(--accent2));color:#06111e;font-weight:800;margin-right:10px;
}
.who{flex:1;font-weight:650}
.who small{display:block;font-weight:500;font-size:10.5px;color:var(--dim)}
.foot-btn{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.foot-btn:hover{background:rgba(255,255,255,.12);color:var(--text)}

/* ============================================================
   Menus / popovers / dialogs / toasts
   ============================================================ */
.menu{
  position:fixed;z-index:7600;min-width:245px;background:var(--surface);
  backdrop-filter:blur(30px) saturate(1.6);border:1px solid var(--stroke2);border-radius:11px;
  box-shadow:var(--shadow);padding:5px;animation:menuIn .12s;
}
@keyframes menuIn{from{opacity:0;transform:scale(.97) translateY(-3px)}}
.mi{display:flex;align-items:center;gap:10px;width:100%;padding:7px 11px;border-radius:8px;font-size:12.5px;text-align:left}
.mi:hover:not(.disabled){background:rgba(var(--accent-rgb),.20)}
.mi.disabled{opacity:.36;cursor:default}
.mi.danger,.mi.danger .mi-ico{color:var(--danger)}
.mi-ico{width:17px;display:flex;justify-content:center;color:var(--dim)}
.mi-label{flex:1;white-space:nowrap}
.mi-accel{font-size:11px;color:var(--dim2);margin-left:18px}
.sep{height:1px;background:var(--stroke);margin:5px 8px}
.sub-arr{color:var(--dim2)}

.popover{
  position:fixed;z-index:7600;width:312px;background:var(--surface);backdrop-filter:blur(30px);
  border:1px solid var(--stroke2);border-radius:13px;box-shadow:var(--shadow);padding:16px;
}
.pop-h{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.pop-row{display:flex;justify-content:space-between;gap:10px;margin:6px 0;color:var(--dim);font-size:12px}
.pop-row b{color:var(--text);text-align:right}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-weight:650;font-size:13px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:11.5px}
.cal-grid .dow{color:var(--dim2);font-size:10px;padding:4px 0;font-weight:700}
.cal-grid .d{padding:5px 0;border-radius:6px;color:var(--dim)}
.cal-grid .d.cur{color:var(--text)}
.cal-grid .d.today{background:var(--accent);color:#06111e;font-weight:800}

#dlgLayer{position:fixed;inset:0;z-index:7000;pointer-events:none}
.scrim{position:absolute;inset:0;background:rgba(4,8,18,.6);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;pointer-events:auto}
.dialog{
  width:470px;max-width:92vw;max-height:86vh;display:flex;flex-direction:column;background:var(--solid);
  border:1px solid var(--stroke2);border-radius:14px;box-shadow:var(--shadow);animation:winIn .18s;
}
.dlg-head{display:flex;align-items:center;gap:10px;padding:16px 18px 0;font-size:14.5px;font-weight:800}
.dlg-body{padding:14px 18px;overflow-y:auto;color:var(--dim);font-size:13px;line-height:1.55;white-space:pre-wrap}
.dlg-body b{color:var(--text)}
.dlg-foot{display:flex;justify-content:flex-end;gap:8px;padding:0 18px 16px;flex-wrap:wrap}

.btn{
  padding:8px 18px;border-radius:9px;font-size:12.5px;font-weight:700;background:rgba(255,255,255,.09);
  border:1px solid var(--stroke2);color:var(--text);display:inline-flex;align-items:center;gap:6px;
}
.btn:hover{background:rgba(255,255,255,.17)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#06111e}
.btn.primary:hover{filter:brightness(1.12)}
.btn.danger{background:var(--danger);border-color:transparent;color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.mini-btn{
  font-size:11.5px;padding:4px 11px;border-radius:7px;background:rgba(255,255,255,.08);
  border:1px solid var(--stroke);color:var(--dim);display:inline-flex;align-items:center;gap:5px;
}
.mini-btn:hover{background:rgba(255,255,255,.16);color:var(--text)}

.field{margin:10px 0}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--dim);margin-bottom:5px}
.inp,select.inp,textarea.inp{
  width:100%;background:rgba(8,13,25,.66);border:1px solid var(--stroke2);border-radius:9px;
  color:var(--text);padding:8px 11px;font-size:12.5px;font-family:inherit;outline:0;
}
html[data-theme=light] .inp,html[data-theme=light] select.inp,html[data-theme=light] textarea.inp{background:rgba(255,255,255,.9)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(var(--accent-rgb),.22)}
.inp.bad{border-color:var(--danger);box-shadow:0 0 0 2px rgba(255,93,108,.2)}
textarea.inp{font-family:var(--mono);font-size:12px;resize:vertical;min-height:120px}
select.inp option{background:var(--solid)}
.radio-row{display:flex;align-items:center;gap:9px;padding:7px 4px;color:var(--text);font-size:12.5px;cursor:pointer}
.radio-row input{accent-color:var(--accent)}
.radio-row.off{opacity:.45;pointer-events:none}
.tabs{display:flex;gap:4px;margin-bottom:12px;border-bottom:1px solid var(--stroke);flex-wrap:wrap}
.tab{padding:8px 14px;font-size:12.5px;font-weight:700;color:var(--dim);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--accent);border-color:var(--accent)}
.prop-table{width:100%;font-size:12.5px;border-collapse:collapse}
.prop-table td{padding:5px 4px;border-bottom:1px solid var(--stroke)}
.prop-table td:first-child{color:var(--dim2);width:112px}
.prop-table td:last-child{color:var(--text);word-break:break-all}

#toasts{position:fixed;right:14px;bottom:calc(var(--tb) + 12px);z-index:7800;display:flex;flex-direction:column;gap:9px;width:352px;max-width:90vw;pointer-events:none}
.toast{
  pointer-events:auto;display:flex;gap:11px;background:var(--surface);backdrop-filter:blur(28px);
  border:1px solid var(--stroke2);border-left:3px solid var(--info);border-radius:12px;padding:12px 14px;
  box-shadow:var(--shadow);animation:toastIn .24s cubic-bezier(.2,1.2,.4,1);
}
@keyframes toastIn{from{opacity:0;transform:translateX(40px)}}
.toast.out{transition:.24s;opacity:0;transform:translateX(40px)}
.toast.success{border-left-color:var(--ok)}
.toast.warn{border-left-color:var(--warn)}
.toast.error{border-left-color:var(--danger)}
.toast.success .t-ico{color:var(--ok)}
.toast.warn .t-ico{color:var(--warn)}
.toast.error .t-ico{color:var(--danger)}
.toast.info .t-ico{color:var(--info)}
.t-body{flex:1;font-size:12.5px;line-height:1.45}
.toast-action{margin-top:6px;color:var(--accent);font-weight:800;font-size:12px}
.t-x{color:var(--dim2);padding:2px}

/* ============================================================
   Explorer
   ============================================================ */
.explorer{display:flex;flex-direction:column;height:100%}
.exp-toolbar,.exp-cmd{flex:none;display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--stroke)}
.exp-cmd{padding:6px 10px;overflow-x:auto;scrollbar-width:none}
.exp-cmd::-webkit-scrollbar{height:0}
.nav-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);flex:none}
.nav-btn:hover:not(:disabled){background:rgba(255,255,255,.12);color:var(--text)}
.nav-btn:disabled{opacity:.3}
.crumbs{
  flex:1;display:flex;align-items:center;gap:1px;background:rgba(8,13,25,.5);border:1px solid var(--stroke);
  border-radius:9px;padding:5px 9px;overflow-x:auto;white-space:nowrap;min-width:80px;scrollbar-width:none;
}
.crumb{padding:2px 7px;border-radius:6px;font-size:12px;color:var(--dim)}
.crumb:hover{background:rgba(255,255,255,.12);color:var(--text)}
.crumb:last-child{color:var(--text);font-weight:700}
.crumb-sep{color:var(--dim2);font-size:10px}
.exp-search{width:172px;background:rgba(8,13,25,.5);border:1px solid var(--stroke);border-radius:9px;padding:6px 10px;color:var(--text);font-size:12px;outline:0}
.exp-search:focus{border-color:var(--accent)}
.cmd-btn{display:flex;align-items:center;gap:7px;padding:6px 10px;border-radius:8px;font-size:12px;white-space:nowrap;flex:none}
.cmd-btn:hover:not(:disabled){background:rgba(255,255,255,.12)}
.cmd-btn:disabled{opacity:.32}
.cmd-btn .gl{color:var(--accent)}
.cmd-btn.warn-c .gl{color:var(--danger)}
.cmd-sep{width:1px;height:20px;background:var(--stroke2);margin:0 6px;flex:none}
.exp-mid{flex:1;display:flex;min-height:0}
.exp-side{flex:none;width:196px;border-right:1px solid var(--stroke);padding:10px 8px;overflow-y:auto;background:rgba(8,13,25,.22)}
.side-item{display:flex;align-items:center;gap:9px;width:100%;padding:7px 9px;border-radius:9px;font-size:12.3px;text-align:left}
.side-item:hover{background:rgba(255,255,255,.10)}
.side-item.active{background:rgba(var(--accent-rgb),.20)}
.side-item .badge{margin-left:auto;font-size:10px;background:rgba(var(--accent-rgb),.25);color:var(--accent);padding:1px 7px;border-radius:8px}
.side-h{font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--dim2);margin:12px 9px 5px}
.exp-main{flex:1;overflow:auto;padding:12px;outline:0;position:relative}
.exp-main.drop-import{outline:2px dashed var(--accent);outline-offset:-6px;background:rgba(var(--accent-rgb),.08)}

.grid-view{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;min-height:100%}
.gitem{width:98px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px 8px;border-radius:10px;border:1px solid transparent;text-align:center;touch-action:none}
.gitem:hover{background:rgba(255,255,255,.09)}
.gitem.selected{background:rgba(var(--accent-rgb),.25);border-color:rgba(var(--accent-rgb),.6)}
.gitem.cut,.lrow.cut{opacity:.45}
.gi-img{position:relative}
.gi-label{font-size:11.5px;line-height:1.3;word-break:break-word;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.list-view{width:100%;min-height:100%}
.lhead,.lrow{display:grid;grid-template-columns:minmax(150px,1fr) 142px 132px 88px;gap:8px;align-items:center;padding:6px 10px;border-radius:8px;font-size:12.3px}
.lhead{color:var(--dim2);font-size:11px;font-weight:800;border-bottom:1px solid var(--stroke);border-radius:0;position:sticky;top:-12px;background:var(--solid);z-index:2;padding-top:8px}
.lhead button{text-align:left;color:inherit;font-size:inherit;font-weight:inherit;display:flex;gap:4px;align-items:center}
.lhead button:hover{color:var(--text)}
.lhead button.on{color:var(--accent)}
.lrow{border:1px solid transparent;touch-action:none}
.lrow:hover{background:rgba(255,255,255,.08)}
.lrow.selected{background:rgba(var(--accent-rgb),.22);border-color:rgba(var(--accent-rgb),.55)}
.lname{display:flex;align-items:center;gap:9px;min-width:0}
.lname .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .c{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp-status{flex:none;display:flex;gap:16px;padding:6px 14px;border-top:1px solid var(--stroke);font-size:11.3px;color:var(--dim);background:rgba(8,13,25,.26)}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:50px 20px;color:var(--dim2);text-align:center;width:100%;min-height:250px}
.empty-state .ico{opacity:.45}
.info-banner,.trash-banner{
  display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:10px 14px;border-radius:10px;font-size:12px;
  background:rgba(var(--accent-rgb),.10);border:1px solid rgba(var(--accent-rgb),.32);color:var(--text);flex-wrap:wrap;
}
.trash-banner{background:rgba(255,200,61,.09);border-color:rgba(255,200,61,.34)}

.drive-cards{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.drive-card{width:306px;background:rgba(255,255,255,.05);border:1px solid var(--stroke2);border-radius:13px;padding:16px;display:flex;gap:14px;align-items:center;outline:0}
.drive-card:hover,.drive-card.selected{background:rgba(var(--accent-rgb),.12);border-color:rgba(var(--accent-rgb),.45)}
.dc-info{flex:1;min-width:0}
.dc-info b{font-size:13px;display:block;margin-bottom:2px}
.dc-info i{font-style:normal;font-size:11px;color:var(--dim);display:block;margin-bottom:8px}
.dc-bar{height:7px;border-radius:4px;background:rgba(8,13,25,.7);overflow:hidden}
.dc-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.dc-fill.hot{background:linear-gradient(90deg,var(--warn),var(--danger))}
.dc-cap{font-size:10.5px;color:var(--dim2);margin-top:5px}
.pc-h{font-size:13px;font-weight:800;color:var(--dim);margin:16px 2px 10px}
.pc-info{margin-top:18px;background:rgba(255,255,255,.04);border:1px solid var(--stroke);border-radius:13px;padding:14px 16px;font-size:12px;color:var(--dim);display:grid;grid-template-columns:auto 1fr;gap:5px 18px;max-width:660px}
.pc-info b{color:var(--text)}

/* ============================================================
   Notepad / CMD / BAT editor / viewers
   ============================================================ */
.notepad{display:flex;flex-direction:column;height:100%;background:#f7f9fd}
.np-toolbar{flex:none;display:flex;align-items:center;gap:2px;padding:6px 8px;background:var(--solid);border-bottom:1px solid var(--stroke);overflow-x:auto}
.np-main{flex:1;display:flex;min-height:0}
.np-main textarea{flex:1;border:0;outline:0;resize:none;padding:18px 22px;font-family:var(--mono);font-size:13.5px;line-height:1.65;color:#172238;background:#f7f9fd}
.np-preview{flex:1;overflow-y:auto;padding:18px 24px;color:#172238;font-size:13.5px;line-height:1.7;border-left:1px solid #d8dfec;background:#fff}
.np-preview h1{font-size:22px;margin:12px 0 8px}
.np-preview h2{font-size:18px;margin:12px 0 6px}
.np-preview h3{font-size:15px;margin:10px 0 5px}
.np-preview p{margin:7px 0}
.np-preview ul,.np-preview ol{margin:7px 0 7px 22px}
.np-preview code{background:#e8edf6;padding:1px 5px;border-radius:4px;font-family:var(--mono);font-size:12px}
.np-status{flex:none;display:flex;gap:16px;padding:5px 14px;background:var(--solid);border-top:1px solid var(--stroke);font-size:11px;color:var(--dim)}
.np-status .saved{color:var(--ok)}
.np-status .dirty{color:var(--warn)}
.np-status .sp{flex:1}

.cmd{display:flex;flex-direction:column;height:100%;background:#060b14;font-family:var(--mono)}
.cmd-tool{flex:none;display:flex;gap:6px;align-items:center;padding:7px 10px;background:#101a2c;border-bottom:1px solid rgba(255,255,255,.1);flex-wrap:wrap}
.cmd-tool .mini-btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.15);color:#9caac1}
.cmd-out{flex:1;overflow-y:auto;padding:12px 14px;font-size:12.5px;line-height:1.6;color:#c8d6ea;white-space:pre-wrap;word-break:break-word;user-select:text}
.cmd-out .ok{color:#57d977}
.cmd-out .err{color:#ff5d6c}
.cmd-out .warn{color:#ffc83d}
.cmd-out .dim{color:#6c7a93}
.cmd-out .acc{color:#4cc2ff}
.cmd-out .head{color:#fff;font-weight:800}
.cmd-out .echo{color:#8fa0bd}
.cmd-out .bat{color:#c8a6ff}
.cmd-in{flex:none;display:flex;align-items:center;gap:8px;padding:9px 12px;border-top:1px solid rgba(255,255,255,.1);background:#0c1322}
.cmd-in .ps{color:#57d977;font-weight:800;font-size:12.5px;white-space:nowrap}
.cmd-in input{flex:1;background:none;border:0;outline:0;color:#eef3fb;font-family:var(--mono);font-size:12.5px}
.cmd-in.paused .ps{color:#ffc83d;animation:pulse 1.1s infinite}
.cmd-hint{flex:none;padding:5px 12px;font-size:10.5px;color:#6c7a93;background:#0c1322}
.cmd[data-scheme=amber] .cmd-out{color:#ffdca8}
.cmd[data-scheme=blue] .cmd-out{color:#bfe3ff}
.cmd[data-scheme=matrix] .cmd-out{color:#7dffa0;background:#030a05}

.batedit{display:flex;flex-direction:column;height:100%}
.be-tool{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--stroke);background:var(--solid);flex-wrap:wrap}
.be-main{flex:1;display:flex;min-height:0}
.be-code{flex:1;display:flex;min-width:0;padding:10px}
.be-code textarea{flex:1;border:1px solid var(--stroke2);border-radius:10px;outline:0;resize:none;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.7;color:#d7f5e2;background:#08111c;tab-size:2}
.be-side{flex:none;width:268px;border-left:1px solid var(--stroke);padding:12px;overflow-y:auto;background:rgba(8,13,25,.22)}
.be-side h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim2);margin:12px 0 6px}
.be-cmd{display:flex;gap:8px;width:100%;padding:4px 6px;border-radius:6px;font-family:var(--mono);font-size:11px;text-align:left;color:var(--dim)}
.be-cmd:hover{background:rgba(var(--accent-rgb),.16);color:var(--text)}
.be-cmd b{color:var(--ok);min-width:78px;flex:none}
.be-status{flex:none;display:flex;gap:14px;padding:6px 14px;border-top:1px solid var(--stroke);font-size:11px;color:var(--dim)}

.viewer{display:flex;flex-direction:column;height:100%}
.viewer-tool{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--stroke);font-size:12px;color:var(--dim);flex-wrap:wrap}
.viewer-stage{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;background:repeating-conic-gradient(#1a2130 0 25%,#141a28 0 50%) 0 0/26px 26px;position:relative}
.viewer-stage img{max-width:none;transition:transform .15s;box-shadow:0 8px 40px rgba(0,0,0,.5)}
.viewer-stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
.viewer-stage video{max-width:94%;max-height:94%}
.av-wrap{display:flex;flex-direction:column;align-items:center;gap:22px;padding:30px}
.av-wrap audio{width:380px;max-width:80vw}

/* ============================================================
   Settings + pickers + app editor
   ============================================================ */
.settings{display:flex;height:100%}
.set-nav{flex:none;width:206px;border-right:1px solid var(--stroke);padding:14px 9px;overflow-y:auto;background:rgba(8,13,25,.22)}
.set-pane{flex:1;overflow-y:auto;padding:22px 26px}
.set-pane h2{font-size:17px;margin-bottom:4px}
.set-pane .sub{font-size:12px;color:var(--dim);margin-bottom:18px}
.set-card{background:rgba(255,255,255,.045);border:1px solid var(--stroke);border-radius:13px;padding:16px;margin-bottom:14px}
.set-card h3{font-size:13px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.wall-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:10px}
.wall-thumb{aspect-ratio:16/10;border-radius:11px;border:2px solid transparent;background-size:cover;background-position:center;position:relative;overflow:hidden}
.wall-thumb.active{border-color:var(--accent);box-shadow:0 0 0 3px rgba(var(--accent-rgb),.25)}
.wall-thumb span{position:absolute;left:0;right:0;bottom:0;padding:4px 8px;font-size:10.5px;background:linear-gradient(transparent,rgba(0,0,0,.8));color:#fff;text-align:left}
.swatches{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid transparent}
.swatch.active{border-color:#fff;box-shadow:0 0 0 3px rgba(var(--accent-rgb),.35)}
input[type=color].inp{width:52px;height:34px;padding:3px;cursor:pointer}
input[type=range]{accent-color:var(--accent);width:200px}
.set-row{display:flex;align-items:center;gap:12px;margin:10px 0;font-size:12.5px;flex-wrap:wrap}
.set-row .lbl{min-width:150px;color:var(--dim)}
.toggle{position:relative;width:42px;height:23px;flex:none}
.toggle input{opacity:0;width:100%;height:100%;position:absolute;cursor:pointer;z-index:2;margin:0}
.toggle .tr{position:absolute;inset:0;border-radius:12px;background:rgba(255,255,255,.17);border:1px solid var(--stroke2);transition:.15s}
.toggle .tr::after{content:"";position:absolute;left:3px;top:3px;width:15px;height:15px;border-radius:50%;background:#cfd8e6;transition:.15s}
.toggle input:checked+.tr{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}
.toggle input:checked+.tr::after{left:22px;background:#06111e}
.toggle.off{opacity:.4;pointer-events:none}
.app-row{display:flex;align-items:center;gap:10px;padding:10px;border-radius:11px;border:1px solid var(--stroke);margin-bottom:8px;background:rgba(255,255,255,.035);flex-wrap:wrap}
.app-row .t{flex:1;min-width:150px}
.app-row .t b{font-size:13px;display:block}
.app-row .t i{font-style:normal;font-size:11px;color:var(--dim)}
.app-badge{font-size:9.5px;padding:1px 6px;border-radius:6px;background:rgba(var(--accent-rgb),.2);color:var(--accent);margin-left:6px;font-weight:800}
.app-badge.native{background:rgba(87,217,119,.18);color:var(--ok)}
.app-badge.trash{background:rgba(255,93,108,.18);color:var(--danger)}
.def-row{display:flex;align-items:center;gap:12px;padding:7px 4px;border-bottom:1px solid var(--stroke)}
.def-row .ext{font-family:var(--mono);font-size:12px;color:var(--accent);min-width:62px}
.def-row .desc{flex:1;font-size:12.3px;color:var(--dim)}
.def-row select.inp{width:232px;padding:6px 9px}
.def-del{width:28px;height:28px;border-radius:7px;color:var(--danger);display:flex;align-items:center;justify-content:center}
.def-add{display:flex;gap:8px;align-items:center;margin-top:10px}
.def-add .inp{max-width:180px}
.def-sec{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--dim2);margin:14px 2px 6px}
.hint{font-size:11.5px;color:var(--dim2);line-height:1.5}
.hint.warn{color:var(--warn)}
.status-line{display:flex;align-items:center;gap:9px;font-size:12.5px;margin:4px 0}
.quota-mini{height:6px;border-radius:3px;background:rgba(8,13,25,.7);overflow:hidden;margin-top:8px;max-width:340px}
details.help{margin-top:12px;font-size:12px;color:var(--dim)}
details.help summary{cursor:pointer;color:var(--accent);font-weight:700}
details.help ol{margin:10px 0 6px 20px;line-height:1.8}
details.help code{background:rgba(8,13,25,.8);padding:2px 7px;border-radius:5px;font-family:var(--mono);font-size:11px;color:var(--warn)}

.ip-prev{display:flex;align-items:center;gap:14px;padding:12px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);margin-bottom:10px}
.ip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px;max-height:182px;overflow-y:auto;padding:4px}
.ip-cell{aspect-ratio:1;border-radius:10px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center}
.ip-cell.active{border-color:var(--accent);box-shadow:0 0 0 2px rgba(var(--accent-rgb),.3)}
.app-icon-img{display:block;border-radius:22%;object-fit:cover;flex:none}
.appedit{display:flex;flex-direction:column;height:100%}
.ae-tool{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--stroke);background:var(--solid);flex-wrap:wrap}
.ae-main{flex:1;display:flex;min-height:0}
.ae-side{flex:none;width:276px;border-right:1px solid var(--stroke);padding:14px;overflow-y:auto;background:rgba(8,13,25,.22)}
.ae-code{flex:1;display:flex;min-width:0;padding:10px}
.ae-code textarea{flex:1;border:1px solid var(--stroke2);border-radius:10px;outline:0;resize:none;padding:14px 16px;font-family:var(--mono);font-size:12.5px;line-height:1.6;color:#dce8fb;background:#0a1020;tab-size:2}
.ae-native{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px;text-align:center;color:var(--dim)}
.ae-icon-preview{display:flex;align-items:center;gap:12px;padding:12px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid var(--stroke);margin-bottom:12px}
.ae-presets{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 12px}
.ae-preset{aspect-ratio:1;border-radius:9px;border:1px solid var(--stroke);background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center}
.ae-preset.active{border-color:var(--accent)}
.ae-win{display:flex;gap:6px;margin-bottom:6px}
.ae-win input{flex:1;min-width:0}
.ae-status{flex:none;display:flex;gap:14px;padding:6px 14px;border-top:1px solid var(--stroke);font-size:11px;color:var(--dim)}
.pick-list{max-height:300px;overflow-y:auto;border:1px solid var(--stroke);border-radius:9px;margin-top:10px}
.pick-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;text-align:left;font-size:12.5px;border-bottom:1px solid var(--stroke)}
.pick-row:hover{background:rgba(255,255,255,.08)}
.pick-row.selected{background:rgba(var(--accent-rgb),.22)}
.pick-row .t{flex:1;min-width:0}
.pick-row .t b{display:block;font-weight:700}
.pick-row .t i{font-style:normal;font-size:10.5px;color:var(--dim2)}
.url-prev{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;background:rgba(8,13,25,.4);border:1px solid var(--stroke);margin-top:10px}
.url-prev .u{flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--accent);word-break:break-all}

/* ============================================================
   Cloud-only mode — delikatna obwódka
   ============================================================ */
#cloudFrame{
  position:fixed;inset:0;z-index:9000;pointer-events:none;display:none;
  box-shadow:inset 0 0 0 1px rgba(var(--accent-rgb),.45);
}
#cloudFrame.on{display:block}
#cloudBadge{
  position:fixed;top:6px;right:8px;z-index:9001;display:none;align-items:center;gap:5px;
  padding:2px 9px;border-radius:14px;font-size:10px;font-weight:700;letter-spacing:.3px;
  background:rgba(var(--accent-rgb),.14);border:1px solid rgba(var(--accent-rgb),.4);
  color:var(--accent);cursor:pointer;backdrop-filter:blur(8px);
}
#cloudBadge.on{display:flex}

/* ============================================================
   Boot / shutdown / wipe
   ============================================================ */
#boot,#shutdown,#wipe{
  position:fixed;inset:0;z-index:9600;background:radial-gradient(1000px 600px at 50% 38%,#131c33,#060a14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .5s;color:#eef3fb;
}
#boot.gone{opacity:0;pointer-events:none}
#shutdown,#wipe{display:none}
#shutdown.on,#wipe.on{display:flex}
.boot-logo{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.boot-logo i{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));animation:bootPulse 1.6s infinite}
.boot-logo i:nth-child(2){animation-delay:.15s}
.boot-logo i:nth-child(3){animation-delay:.45s}
.boot-logo i:nth-child(4){animation-delay:.3s}
@keyframes bootPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.82);opacity:.55}}
.boot-name{font-size:23px;font-weight:300;letter-spacing:2px}
.boot-name b{font-weight:800}
.spinner{width:26px;height:26px;border-radius:50%;border:3px solid rgba(255,255,255,.14);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

  document.getElementById('bootSpin').style.display = 'none';
  document.getElementById('bootMsg').textContent =
    'System nie wystartował. Uruchom tryb awaryjny lub wyczyść pamięć lokalną.';

  function openDB() {
    return new Promise(res => {
      try {
        if (!window.indexedDB) return res(null);
        const r = indexedDB.open(IDB_NAME, 1);
        r.onupgradeneeded = () => { try { r.result.createObjectStore('files'); } catch (e) {} };
        r.onsuccess = () => res(r.result);
        r.onerror = r.onblocked = () => res(null);
      } catch (e) { res(null); }
    });
  }
  const db = () => dbp || (dbp = race(openDB(), 1500, null));

  function warn() {
    if (warned) return;
    warned = true;
    setTimeout(() => toast('Pamięć trwała plików jest niedostępna — dane binarne pozostaną tylko w tej sesji.', { type: 'warn', timeout: 6500 }), 100);
  }

  return {
    async put(k, b) {
      mem.set(k, b);
      const d = await db();
      if (!d) { warn(); return false; }
      return race(new Promise(res => {
        try {
          const t = d.transaction('files', 'readwrite');
          t.objectStore('files').put(b, k);
          t.oncomplete = () => res(true);
          t.onerror = t.onabort = () => res(false);
        } catch (e) { res(false); }
      }), 1500, false);
    },
    async get(k) {
      if (mem.has(k)) return mem.get(k);
      const d = await db();
      if (!d) return null;
      return race(new Promise(res => {
        try {
          const q = d.transaction('files', 'readonly').objectStore('files').get(k);
          q.onsuccess = () => res(q.result || null);
          q.onerror = () => res(null);
        } catch (e) { res(null); }
      }), 1500, null);
    },
    async del(k) {
      mem.delete(k);
      const d = await db();
      if (d) { try { d.transaction('files', 'readwrite').objectStore('files').delete(k); } catch (e) {} }
    },
    async wipe() {
      mem.clear();
      dbp = null;
      await new Promise(res => {
        try {
          const r = indexedDB.deleteDatabase(IDB_NAME);
          r.onsuccess = r.onerror = r.onblocked = () => res();
          setTimeout(res, 1800);
        } catch (e) { res(); }
      });
    }
  };
})();

const Snd = (function () {
  let ctx, master, unlocked = false;
  function tone(f, d, t, g, at) {
    if (!ctx || !state.settings.sound) return;
    const n = ctx.currentTime + (at || 0);
    const o = ctx.createOscillator(), gn = ctx.createGain();
    o.type = t || 'sine';
    o.frequency.value = f;
    gn.gain.setValueAtTime(0, n);
    gn.gain.linearRampToValueAtTime(g || .1, n + .012);
    gn.gain.exponentialRampToValueAtTime(.0001, n + d);
    o.connect(gn).connect(master);
    o.start(n); o.stop(n + d + .05);
  }
  return {
    unlock() {
      if (unlocked) return;
      unlocked = true;
      try {
        ctx = new (window.AudioContext || window.webkitAudioContext)();
        master = ctx.createGain();
        master.gain.value = (state.settings.volume != null ? state.settings.volume : 70) / 100 * .5;
        master.connect(ctx.destination);
        this.play('start');
      } catch (e) {}
    },
    play(n) {
      if (!ctx || !state.settings.sound) return;
      if (ctx.state === 'suspended') ctx.resume();
      const map = {
        click: () => tone(900, .05),
        open:  () => { tone(520, .1); tone(780, .14, 'sine', .1, .05); },
        close: () => { tone(700, .09); tone(430, .13, 'sine', .09, .05); },
        error: () => tone(220, .22, 'square', .06),
        trash: () => tone(260, .16, 'triangle', .12),
        beep:  () => tone(1000, .12, 'square', .07),
        pop:   () => tone(760, .09, 'sine', .11),
        drop:  () => { tone(620, .07, 'sine', .1); tone(880, .1, 'sine', .08, .05); },
        start: () => { tone(523, .35, 'sine', .13); tone(659, .35, 'sine', .11, .12); tone(784, .4, 'sine', .11, .24); }
      };
      (map[n] || function () {})();
    },
    setVol(v) { if (master) master.gain.value = v / 100 * .5; }
  };
})();

/* ===== ZAKRESY GOOGLE — pełny / ograniczony ===== */
const GDRIVE = 'https://www.googleapis.com/auth/drive';
const GFILE  = 'https://www.googleapis.com/auth/drive.file';
const GSCOPE = { full: [GDRIVE, 'openid', 'email', 'profile'], limited: [GFILE] };
function scopeMode() {

}

function saveNow() {
  try {
    const apps = {};
    for (const id in state.apps) {
      const a = state.apps[id];
      apps[id] = a.htmlKey ? Object.assign({}, a, { html: '' }) : a;
    }
    const snap = Object.assign({}, state, { apps: apps });
    LS.set(LSK, JSON.stringify(snap));
    if (!LS.isOk() && LS.isQuota() && !saveWarn) {
      saveWarn = true;
      toast('Pamięć localStorage jest pełna. Nowe pliki mogą wymagać wysłania na Dysk Google.',

    }

const save = debounce(saveNow, 160);

function commit(op, id) {
  if (cloudOnly()) state.cloudPending = true;
  save();
  if (state.settings.localLayout) saveLocalLayout();

  systemLog(op, id);
  if (cloudOk() && !Drive._applying) queueSync(id);
}

function systemLog(op, id) {
  if (!state || op === 'log') return;
  const n = N('sys-log');
  if (!n) return;
  const line = new Date().toLocaleString('pl-PL') + '  ' + op + (id ? '  ' + id : '');
  n.content = (n.content || '').split('\n').filter(Boolean).slice(-199).concat(line).join('\n');
  n.modified = Date.now();
  save();
}

/* --- ścieżki i drzewo --- */
function rootOf(p) {
  let g = 0;
  while (p !== 'C' && p !== 'Z' && g++ < 90) {
    const n = N(p);
    if (!n) return 'C';
    p = n.parent;
  }
  return p === 'Z' ? 'Z' : 'C';
}
function children(p) {
  const r = rootOf(p);
  return Object.keys(state.nodes).map(k => state.nodes[k]).filter(n => {
    if (n.parent !== p || n.trashed) return false;
    if (r !== 'Z') return true;
    if (Drive.mode === 'google') return n.origin === 'google' || (n.origin === 'demo' && !n.driveId);
    return n.origin !== 'google';
  });
}
function pathOf(n) {
  const a = [];
  let p = n.parent, g = 0;
  while (p !== 'C' && p !== 'Z' && g++ < 90) {
    const x = N(p);
    if (!x) break;
    a.unshift(x);
    p = x.parent;
  }
  return a;
}
function pathStr(n) {
  const par = pathOf(n);
  return (rootOf(n.id) === 'Z' ? 'Z:\\' : 'C:\\') +
    par.map(x => x.name).join('\\') + (par.length ? '\\' : '') + n.name;
}
function fullPath(id) {
  if (id === 'C') return 'C:\\';
  if (id === 'Z') return 'Z:\\';
  return N(id) ? pathStr(N(id)) : id;
}
function isTrashedRoot(n) {
  let c = n, g = 0;
  while (c && g++ < 90) { if (c.trashed) return true; c = N(c.parent); }
  return false;
}
function desc(id) {
  const out = [];
  (function walk(p) {
    for (const k in state.nodes) {
      const n = state.nodes[k];
      if (n.parent === p) { out.push(n); walk(n.id); }
    }
  })(id);
  return out;
}
function sizeOf(n) {
  if (n.type === 'folder') return null;
  if (n.type === 'app') {
    const a = state.apps[n.app];
    return a && a.html ? a.html.length : 0;
  }
  if (n.type === 'shortcut' && n.target && n.target.url) return n.target.url.length;
  if (n.size != null) return n.size;
  if (n.content != null) return new Blob([n.content]).size;
  if (n.inline) return n.inline.length;
  return null;
}
function uniqueName(p, name, self) {
  const taken = children(p).filter(n => n.id !== self).map(n => n.name.toLowerCase());
  if (taken.indexOf(name.toLowerCase()) < 0) return name;
  const d = name.lastIndexOf('.');
  const b = d > 0 ? name.slice(0, d) : name;
  const e = d > 0 ? name.slice(d) : '';
  let i = 2;
  while (taken.indexOf((b + ' (' + i + ')' + e).toLowerCase()) >= 0) i++;
  return b + ' (' + i + ')' + e;
}
function typeLabel(n) {
  if (isUrlShortcut(n)) return 'Skrót do strony WWW';
  const map = {
    folder: 'Folder',
    text: isBat(n) ? 'Skrypt wsadowy (.bat)' : 'Dokument tekstowy',
    gdoc: 'Dokument Google', gsheet: 'Arkusz Google', gslides: 'Prezentacja Google',
    shortcut: 'Skrót', appshortcut: 'Skrót aplikacji', app: 'Aplikacja HTML',
    system: 'Element systemowy'
  };
  if (map[n.type]) return map[n.type];
  return extOf(n.name) ? extOf(n.name).toUpperCase() + ' — plik' : 'Plik';
}
function resolveTarget(n) {
  const t = n.target;
  if (!t) return null;
  if (t.nodeId) { const x = N(t.nodeId); return x && !isTrashedRoot(x) ? x : null; }
  if (t.driveId) {
    for (const k in state.nodes) {
      const v = state.nodes[k];
      if (v.driveId === t.driveId && !v.trashed) return v;
    }
  }
  return null;
}
function cmdPath(arg, cwd) {
  if (!arg) return cwd;
  let s = String(arg).trim().replace(/^"|"$/g, '');
  if (state.nodes[s]) return s;
  if (/^[cz]:?$/i.test(s)) return s[0].toUpperCase();
  if (s === '~') return DESK;
  let cur;
  if (/^[cz]:/i.test(s)) { cur = s[0].toUpperCase(); s = s.slice(2); }
  else cur = cwd;
  const parts = s.replace(/\\/g, '/').split('/').filter(Boolean);
  for (let i = 0; i < parts.length; i++) {
    const p = parts[i];
    if (p === '.') continue;
    if (p === '..') { cur = (cur === 'C' || cur === 'Z') ? cur : ((N(cur) || {}).parent || 'C'); continue; }
    const f = children(cur).filter(n => n.name.toLowerCase() === p.toLowerCase())[0];
    if (!f) return null;
    cur = f.id;
  }
  return cur;
}
function resolveDir(p) {
  if (p == null || p === '') return DESK;
  const s = String(p);
  const alias = {
    C: DESK, desktop: DESK, pulpit: DESK,
    apps: DIRS.apps, aplikacje: DIRS.apps, appdata: DIRS.appdata,
    user: DIRS.user, 'użytkownik': DIRS.user,

const windows = new Map(), winKeys = new Map();
let winSeq = 0, zTop = 100, activeWin = null, showSet = null;

const PINS = [
  { app: 'exp:files', icon: 'folder', tip: 'Eksplorator plików', run: () => openExplorer(startDir()) },
  { app: 'notepad', icon: 'notepad', tip: 'Notatnik', run: () => openNotepad() },
  { app: 'cmd', icon: 'cmd', tip: 'Konsola (CMD)', run: () => openCmd() },
  { app: 'exp:Z', icon: 'drive', tip: 'Dysk Google (Z:)', run: () => openExplorer('Z') },
  { app: 'settings', icon: 'settings', tip: 'Ustawienia', run: () => openSettings() }
];
const PIN_ALIAS = { explorer: 'exp:files', drive: 'exp:Z', notepad: 'notepad', settings: 'settings', cmd: 'cmd' };

function pinWins(appId) {
  return Array.from(windows.values()).filter(w =>
    w.appId === appId ||
    (appId === 'notepad' && String(w.appId).indexOf('np:') === 0) ||
    (appId === 'exp:files' && String(w.appId).indexOf('exp:') === 0 &&
      ['exp:Z', 'exp:trash', 'exp:pc'].indexOf(w.appId) < 0));
}
function focusTop() {
  const a = Array.from(windows.values()).filter(w => w.state !== 'min')
    .sort((x, y) => (+y.el.style.zIndex) - (+x.el.style.zIndex));
  if (a[0]) a[0].focus();
}
function winOpts(id, def) {
  def = def || {};
  const d = appDesc(id);
  const w = (d && d.win) || {};
  return {
    width: w.w || def.width, height: w.h || def.height,
    minW: w.minW || def.minW, minH: w.minH || def.minH,
    resizable: w.resizable !== false, startMax: !!w.max
  };
}

function createWindow(o) {
  if (o.key && winKeys.has(o.key)) {
    const w = winKeys.get(o.key);
    if (w.state === 'min') w.restore();
    w.focus();
    if (o.onReuse) o.onReuse(w);
    return w;
  }
  const id = 'w' + (++winSeq);
  const vw = innerWidth, vh = innerHeight - 50;
  const minW = Math.max(240, o.minW || 320), minH = Math.max(160, o.minH || 200);
  const resizable = o.resizable !== false;
  const W = clamp(o.width || 720, Math.min(minW, vw - 20), vw - 20);
  const H = clamp(o.height || 540, Math.min(minH, vh - 20), vh - 20);
  const off = (windows.size * 26) % 150;
  const el = h('div', 'win' + (resizable ? '' : ' fixed'));
  const icoFn = typeof o.iconHTML === 'function' ? o.iconHTML : null;

  el.style.cssText = 'width:' + W + 'px;height:' + H + 'px;left:' +
    clamp((vw - W) / 2 + off - 60, 8, Math.max(8, vw - W - 8)) + 'px;top:' +
    clamp((vh - H) / 2 + off - 50, 8, Math.max(8, vh - H - 8)) + 'px';
  el.innerHTML =
    '<div class="titlebar"><span class="win-ico">' + (icoFn ? icoFn(18) : svgIco(o.icon || 'file', 18)) + '</span>' +
    '<span class="win-title"></span><div class="win-btns">' +
    '<button class="wb min" data-tip="Minimalizuj">' + gl('minus', 14) + '</button>' +
    '<button class="wb maxb" data-tip="Maksymalizuj">' + gl('square', 12) + '</button>' +
    '<button class="wb close" data-tip="Zamknij">' + gl('x', 14) + '</button></div></div>' +
    '<div class="win-body"></div>' +
    (resizable ? ['n', 's', 'e', 'w', 'ne', 'nw', 'se', 'sw']
      .map(d => '<div class="rz rz-' + d + '" data-dir="' + d + '"></div>').join('') : '');
  $('#winLayer').append(el);

  const win = {
    id: id, el: el, key: o.key, appId: o.appId || o.key || id, kind: o.kind || o.appId || o.key,
    body: $('.win-body', el), titleEl: $('.win-title', el), state: 'normal', isMax: false,
    cleanup: [], icon: o.icon || 'file', iconHTML: icoFn, minW: minW, minH: minH
  };
  win.setTitle = t => { win.title = t; win.titleEl.textContent = t; tbSync(); };
  win.setTitle(o.title || 'Okno');
  win.getSize = () => ({
    width: el.offsetWidth, height: el.offsetHeight, minWidth: minW, minHeight: minH,
    resizable: resizable, maximized: win.isMax
  });
  win.setSize = (w, hh) => {
    if (win.isMax) win.toggleMax();
    const W2 = clamp(w || el.offsetWidth, minW, vw - 16);
    const H2 = clamp(hh || el.offsetHeight, minH, vh - 16);
    el.style.width = W2 + 'px'; el.style.height = H2 + 'px';
    el.style.left = clamp(el.offsetLeft, 0, Math.max(0, vw - W2)) + 'px';
    el.style.top = clamp(el.offsetTop, 0, Math.max(0, vh - H2)) + 'px';
    return win.getSize();
  };
  win.focus = () => {
    if (win.state === 'min') win.restore();
    activeWin = win;
    el.style.zIndex = ++zTop;
    windows.forEach(w => w.el.classList.toggle('active', w === win));
    tbSync();
  };
  win.minimize = () => {
    if (win.state === 'min') return;
    win.state = 'min';
    el.classList.add('hidden');
    if (activeWin === win) activeWin = null;
    el.classList.remove('active');
    tbSync(); focusTop();
  };
  win.restore = () => {
    if (win.state !== 'min') return;
    win.state = win.isMax ? 'max' : 'normal';
    el.classList.remove('hidden');
    win.focus();
  };
  win.toggleMax = () => {
    if (!resizable && !win.isMax) return;
    win.isMax = !win.isMax;
    win.state = win.isMax ? 'max' : 'normal';
    el.classList.toggle('max', win.isMax);
    $('.maxb', el).innerHTML = gl(win.isMax ? 'restore' : 'square', 12);
    win.focus();
  };
  const doClose = async skip => {
    if (!skip && o.onClose && await o.onClose(win) === false) return;
    win.cleanup.forEach(f => { try { f(); } catch (e) {} });
    el.classList.add('closing');
    Snd.play('close');
    setTimeout(() => el.remove(), RM ? 0 : 150);
    windows.delete(id);
    if (o.key) winKeys.delete(o.key);
    if (activeWin === win) activeWin = null;
    tbSync(); focusTop();
  };
  win.close = () => doClose(false);
  win.forceClose = () => doClose(true);

  windows.set(id, win);
  if (o.key) winKeys.set(o.key, win);
  el.addEventListener('pointerdown', () => win.focus(), true);
  $('.min', el).onclick = e => { e.stopPropagation(); win.minimize(); };
  $('.maxb', el).onclick = e => { e.stopPropagation(); win.toggleMax(); };
  $('.close', el).onclick = e => { e.stopPropagation(); win.close(); };

  const tb = $('.titlebar', el);
  tb.ondblclick = e => { if (!e.target.closest('.wb') && resizable) win.toggleMax(); };
  tb.onpointerdown = e => {
    if (e.target.closest('.wb') || e.button !== 0) return;
    e.preventDefault();
    tb.setPointerCapture(e.pointerId);
    let sx = e.clientX, sy = e.clientY, moved = false, zone = null;
    const snap = $('#snapPreview');
    const move = ev => {
      let dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) < 4) return;
      if (!moved) { moved = true; el.classList.add('dragging'); Idle.busy++; }
      if (win.isMax) {
        if (!resizable) return;
        win.toggleMax();
        el.style.left = (ev.clientX - el.offsetWidth / 2) + 'px';
        el.style.top = '6px';
        sx = ev.clientX; sy = ev.clientY;
        return;
      }
      el.style.left = clamp(parseFloat(el.style.left) + dx, -el.offsetWidth + 130, innerWidth - 130) + 'px';
      el.style.top = clamp(parseFloat(el.style.top) + dy, 0, innerHeight - 90) + 'px';
      sx = ev.clientX; sy = ev.clientY;
      zone = !resizable ? null : ev.clientX < 10 ? 'L' : ev.clientX > innerWidth - 10 ? 'R' : ev.clientY < 8 ? 'T' : null;
      if (zone) {
        const v = innerHeight - 50;
        snap.style.display = 'block';
        snap.style.cssText += zone === 'L'
          ? ';left:6px;top:6px;width:' + (innerWidth / 2 - 12) + 'px;height:' + (v - 12) + 'px'
          : zone === 'R'
            ? ';left:' + (innerWidth / 2 + 6) + 'px;top:6px;width:' + (innerWidth / 2 - 12) + 'px;height:' + (v - 12) + 'px'
            : ';left:6px;top:6px;width:' + (innerWidth - 12) + 'px;height:' + (v - 12) + 'px';
      } else snap.style.display = 'none';
    };
    const up = () => {
      tb.onpointermove = tb.onpointerup = tb.onpointercancel = null;
      if (moved) Idle.busy = Math.max(0, Idle.busy - 1);
      el.classList.remove('dragging');
      snap.style.display = 'none';
      if (zone === 'L') Object.assign(el.style, { left: '0px', top: '0px', width: innerWidth / 2 + 'px', height: innerHeight - 50 + 'px' });
      else if (zone === 'R') Object.assign(el.style, { left: innerWidth / 2 + 'px', top: '0px', width: innerWidth / 2 + 'px', height: innerHeight - 50 + 'px' });
      else if (zone === 'T') win.toggleMax();
      zone = null;
    };
    tb.onpointermove = move;
    tb.onpointerup = tb.onpointercancel = up;
  };

  $$('.rz', el).forEach(rz => {
    rz.onpointerdown = e => {
      if (e.button !== 0) return;
      e.preventDefault(); e.stopPropagation();
      rz.setPointerCapture(e.pointerId);
      el.classList.add('resizing');
      Idle.busy++;
      const dir = rz.dataset.dir;
      let sx = e.clientX, sy = e.clientY;
      const r = { l: el.offsetLeft, t: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
      const move = ev => {
        const dx = ev.clientX - sx, dy = ev.clientY - sy;
        let l = r.l, t = r.t, w = r.w, hh = r.h;
        if (dir.indexOf('e') >= 0) w = Math.max(minW, r.w + dx);
        if (dir.indexOf('s') >= 0) hh = Math.max(minH, r.h + dy);
        if (dir.indexOf('w') >= 0) { w = Math.max(minW, r.w - dx); l = r.l + r.w - w; }
        if (dir.indexOf('n') >= 0) { hh = Math.max(minH, r.h - dy); t = r.t + r.h - hh; }
        el.style.left = l + 'px';
        el.style.top = Math.max(0, t) + 'px';
        el.style.width = w + 'px';
        el.style.height = hh + 'px';
      };
      const up = () => {
        rz.onpointermove = rz.onpointerup = rz.onpointercancel = null;
        Idle.busy = Math.max(0, Idle.busy - 1);
        el.classList.remove('resizing');
      };
      rz.onpointermove = move;
      rz.onpointerup = rz.onpointercancel = up;
    };
  });

  if (o.startMax && resizable) win.toggleMax();
  else if (innerWidth < 720 && o.maxSmall !== false && resizable) win.toggleMax();
  win.focus();
  tbSync();
  Snd.play('open');
  if (o.build) o.build(win);
  return win;
}

const userPins = () => state.settings.pins || [];
const hiddenPins = () => state.settings.hiddenPins || [];
const isPinned = id => userPins().indexOf(id) >= 0;
const pinIdFor = id => id.indexOf('custom:') === 0 ? id : (PIN_ALIAS[id] || id);

function isPinnedAny(id) {
  const p = pinIdFor(id);
  if (PINS.some(x => x.app === p)) return hiddenPins().indexOf(p) < 0;
  return isPinned(p);
}
function togglePin(id) {
  const p = pinIdFor(id);
  if (PINS.some(x => x.app === p)) {
    if (hiddenPins().indexOf(p) >= 0) restoreDefaultPin(p); else hideDefaultPin(p);
    return;
  }
  if (isPinned(p)) unpinApp(p); else pinApp(p);
}
function pinApp(id) {
  if (!id) return;
  const p = pinIdFor(id);
  if (PINS.some(x => x.app === p)) { restoreDefaultPin(p); return; }
  if (isPinned(p)) return;
  state.settings.pins = userPins().concat(p);
  save(); tbSync(); bus.emit('pins');
}
function unpinApp(id) {
  const p = pinIdFor(id);
  if (PINS.some(x => x.app === p)) { hideDefaultPin(p); return; }
  state.settings.pins = userPins().filter(x => x !== p);
  save(); tbSync(); bus.emit('pins');
}
function hideDefaultPin(id) {
  if (hiddenPins().indexOf(id) < 0) state.settings.hiddenPins = hiddenPins().concat(id);
  save(); tbSync(); bus.emit('pins');
}
function restoreDefaultPin(id) {
  state.settings.hiddenPins = hiddenPins().filter(x => x !== id);
  save(); tbSync(); bus.emit('pins');
}
function pinDef(id) {
  let d = appDesc(id);
  if (!d) {
    const k = Object.keys(PIN_ALIAS).filter(x => PIN_ALIAS[x] === id)[0];
    d = k ? appDesc(k) : null;
  }
  if (!d) return null;
  return {
    app: id, appId: d.custom ? 'app:' + d.appId : (PIN_ALIAS[d.id] || d.id),
    tip: d.name, iconHTML: s => descIcon(d, s), run: () => d.run()
  };
}

const appActions = new Map();
function setAppActions(cid, list) {
  appActions.set(cid, (list || []).slice(0, 8).map(a => ({
    id: String(a.id || a.label), label: String(a.label || a.id), icon: a.icon || 'bolt'
  })));
  tbSync();
}
function actionsFor(kind, w) {
  if (!kind) return [];
  if (kind.indexOf('custom:') === 0) {
    const cid = kind.slice(7);
    return (appActions.get(cid) || []).map(a => ({
      label: a.label, icon: a.icon,
      run: () => broadcastApps('quickAction', { appId: cid, action: a.id })
    }));
  }
  const b = BUILTIN.filter(x => x.id === kind)[0];
  return ((b && b.actions) || []).map(a => ({ label: a.label, icon: a.icon, run: () => a.run(w) }));
}

function tbSync() {
  const c = $('#tbCenter');
  let html = '<button class="tb-btn" id="startBtn" data-tip="Start">' + svgIco('logo', 24) + '</button>' +
    '<button class="tb-search" id="tbSearch">' + gl('search', 14) + '<span>Szukaj</span></button>';
  const covered = new Set();

  const pins = PINS.filter(p => hiddenPins().indexOf(p.app) < 0).map(p => {
    const k = Object.keys(PIN_ALIAS).filter(x => PIN_ALIAS[x] === p.app)[0];
    const d = k ? appDesc(k) : null;
    return {
      app: p.app, appId: p.app, tip: p.tip,
      iconHTML: s => d ? descIcon(d, s) : svgIco(p.icon, s)
    };
  }).concat(userPins().map(pinDef).filter(Boolean));

  pins.forEach(p => {
    const ws = pinWins(p.appId);
    ws.forEach(w => covered.add(w.id));
    html += '<button class="tb-btn' + (ws.length ? ' running' : '') +
      (ws.some(w => w === activeWin && w.state !== 'min') ? ' active' : '') +
      '" data-pin="' + p.app + '" data-tip="' + esc(p.tip) + '">' + p.iconHTML(24) + '</button>';
  });
  Array.from(windows.values()).forEach(w => {
    if (covered.has(w.id)) return;
    html += '<button class="tb-btn running' + (w === activeWin && w.state !== 'min' ? ' active' : '') +
      '" data-win="' + w.id + '" data-tip="' + esc(w.title) + '">' +
      (w.iconHTML ? w.iconHTML(22) : svgIco(w.icon, 22)) + '</button>';
  });
  c.innerHTML = html;
  $('#startBtn').onclick = e => { e.stopPropagation(); toggleStart(); };
  $('#tbSearch').onclick = e => { e.stopPropagation(); toggleStart(true); };
}

$('#tbCenter').onclick = e => {
  const b = e.target.closest('[data-pin],[data-win]');
  if (!b) return;
  Snd.play('click');
  if (b.dataset.win) {
    const w = windows.get(b.dataset.win);
    if (!w) return;
    if (w === activeWin && w.state !== 'min') w.minimize();
    else { if (w.state === 'min') w.restore(); w.focus(); }
    return;
  }
  const id = b.dataset.pin;
  const raw = PINS.filter(x => x.app === id)[0];
  const p = raw ? { appId: raw.app, run: raw.run } : pinDef(id);
  if (!p) return;
  const ws = pinWins(p.appId);
  if (!ws.length) p.run();
  else {
    const w = ws[ws.length - 1];
    if (w === activeWin && w.state !== 'min') w.minimize();
    else { if (w.state === 'min') w.restore(); w.focus(); }
  }
};
function tbMenuFor(kind, pinId, w, x, y) {
  const acts = actionsFor(kind, w);
  const items = [];
  if (acts.length) {
    acts.forEach(a => items.push({
      label: a.label, icon: a.icon,
      action: () => {
        if (w) { w.focus(); a.run(w); }
        else {
          const d = appDesc(kind);
          if (d) d.run();
          setTimeout(() => a.run(Array.from(windows.values()).filter(v => v.kind === kind)[0]), 420);
        }
      }
    }));
    items.push('-');
  }
  if (pinId) items.push({
    label: isPinnedAny(kind) ? 'Odepnij od paska zadań' : 'Przypnij do paska zadań',
    icon: 'pin', action: () => togglePin(kind)
  });
  const d = appDesc(kind);

    items.push({ label: 'Utwórz skrót na pulpicie', icon: 'plus', action: () => addAppDesktopShortcut(d.id) });
    items.push({ label: 'Właściwości aplikacji…', icon: 'edit', action: () => openAppEditor(d.id) });
  }
  if (w) items.push('-', { label: 'Zamknij', icon: 'x', danger: true, action: () => w.close() });

$('#tbCenter').oncontextmenu = e => {
  const b = e.target.closest('[data-pin],[data-win]');

    const pd = pinDef(id);
    const w = pinWins(raw ? raw.app : (pd ? pd.appId : id)).slice(-1)[0];

const Drag = {

  tag: null,
  tagInner: null,
