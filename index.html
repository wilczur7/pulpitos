    size: 150, created: now, modified: now });
  add({ id: 't-todo', type: 'text', name: 'Lista zadań.txt', parent: DIRS.documents, origin: 'local',
    content: 'Lista zadań\n===========\n1. Zaimportować pliki z komputera\n2. Uporządkować foldery na Dysku Google\n3. Przestawić ikony pulpitu (Shift = swobodnie)\n4. Opróżnić kosz\n',
    size: 160, created: now - 86400000, modified: now - 86400000 });

  URLS('url-mdn', 'MDN Web Docs', 'https://developer.mozilla.org', DIRS.web, 'globe');
  URLS('url-caniuse', 'Can I use', 'https://caniuse.com', DIRS.web, 'globe');
  URLS('url-github', 'GitHub', 'https://github.com', DIRS.web, 'globe');
  URLS('url-drive', 'Dysk Google (www)', 'https://drive.google.com', DIRS.web, 'drive');

  add({ id: 'z-proj', type: 'folder', name: 'Projekty', parent: 'Z', origin: 'demo', iconPreset: 'folderProjects', created: now, modified: now });
  add({ id: 'z-spec', type: 'folder', name: 'Specyfikacje', parent: 'z-proj', origin: 'demo', iconPreset: 'folderDocuments', created: now, modified: now });
  add({ id: 'z-notes', type: 'text', name: 'Notatki ze spotkania.txt', parent: 'z-spec', origin: 'demo',
    content: 'Notatki ze spotkania\n- Tryb chmurowy wyłącza auto-logowanie\n- Ikony pulpitu przestawiają się swobodnie\n- Skróty WWW dostępne z menu i konsoli\n',
    size: 150, created: now, modified: now });

  add({ id: 'sc-scripts', type: 'shortcut', name: 'Skrypty .bat', parent: DESK, origin: 'local', target: { nodeId: DIRS.scripts }, pos: { c: 1, r: 0 }, created: now, modified: now });
  add({ id: 'sc-web', type: 'shortcut', name: 'Strony WWW', parent: DESK, origin: 'local', target: { nodeId: DIRS.web }, pos: { c: 1, r: 1 }, created: now, modified: now });
  add({ id: 'sc-mdn', type: 'shortcut', name: 'MDN Web Docs', parent: DESK, origin: 'local', target: { url: 'https://developer.mozilla.org' }, mime: 'text/uri-list', pos: { c: 3, r: 0 }, created: now, modified: now });

  s.apps.calc = {
    id: 'calc', name: 'Kalkulator', html: CALC_HTML, created: now, modified: now,
    iconPreset: 'apphtml', win: { w: 420, h: 600, minW: 320, minH: 420 }, seed: true, noSync: false
  };
  add({ id: 'sc-calc', type: 'appshortcut', app: 'calc', name: 'Kalkulator', parent: DESK, origin: 'local', pos: { c: 1, r: 2 }, created: now, modified: now });
  add({ id: 'appnode-calc', type: 'app', app: 'calc', name: 'Kalkulator.html', parent: DIRS.apps, origin: 'local', created: now, modified: now });
  add({ id: 'sc-notepad', type: 'appshortcut', app: 'notepad', name: 'Notatnik', parent: DESK, origin: 'local', pos: { c: 2, r: 0 }, created: now, modified: now });
  add({ id: 'sc-cmd', type: 'appshortcut', app: 'cmd', name: 'Konsola (CMD)', parent: DESK, origin: 'local', pos: { c: 2, r: 1 }, created: now, modified: now });
  add({ id: 'sc-shortcut', type: 'appshortcut', app: 'shortcut', name: 'Nowy skrót', parent: DESK, origin: 'local', pos: { c: 2, r: 2 }, created: now, modified: now });
  return s;
}

/* ============================================================
   29. Zdarzenia globalne
   ============================================================ */
document.addEventListener('contextmenu', e => {
  if (!e.target.closest('input,textarea,[contenteditable="true"],iframe,.cmd-out')) e.preventDefault();
});
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => e.preventDefault());
document.addEventListener('keydown', e => {
  if ($('#dlgLayer').childElementCount) return;
  if (e.key === 'Escape') {
    if (Drag.active) { Drag.cancel(); renderDesktop(); return; }
    if (menuStack.length || popoverEl) { closePopups(); return; }
    if (startOpen) { closeStart(); return; }
  }
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (!(!activeWin || t === document.body || t === deskEl || (t.closest && t.closest('#desktop')))) return;
  const sel = Array.from(deskSel);
  if (e.key === 'Delete' && sel.length) { e.preventDefault(); deleteFlow(sel); }
  else if (e.key === 'F2' && sel.length === 1) { e.preventDefault(); if (N(sel[0])) renameInline(N(sel[0]), 'desktop'); }
  else if (e.key === 'F5') { e.preventDefault(); renderDesktop(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
    e.preventDefault();
    children(DESK).forEach(n => deskSel.add(n.id));
    paintSel();
  }
  else if ((e.ctrlKey || e.metaKey) && e.key === 'c' && sel.length) { clipboard = { mode: 'copy', ids: sel }; renderDesktop(); }
  else if ((e.ctrlKey || e.metaKey) && e.key === 'x' && sel.length) {
    clipboard = { mode: 'cut', ids: sel.filter(id => !N(id).system) };
    renderDesktop();
  }
  else if ((e.ctrlKey || e.metaKey) && e.key === 'v') pasteClipboard(DESK);
  else if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'N' || e.key === 'n')) {
    e.preventDefault(); openShortcutPicker({ tab: 'url' });
  }
  else if (e.key === 'Enter' && sel.length === 1) openNode(sel[0]);
});
window.addEventListener('resize', debounce(() => renderDesktop(), 150));
window.addEventListener('beforeunload', saveNow);
document.addEventListener('pointerdown', () => Snd.unlock(), { once: true });
document.addEventListener('keydown', () => Snd.unlock(), { once: true });
bus.on('fs', debounce(renderDesktop, 40));
bus.on('apps', () => { if (startOpen) renderStart(); tbSync(); });
bus.on('pins', () => { if (startOpen) renderStart(); });

/* ============================================================
   30. Rozruch
   ============================================================ */
(function boot() {
  function fail(msg) {
    window.__osErr = msg;
    const b = $('#boot');
    if (!b) return;
    const sp = $('#bootSpin');
    if (sp) sp.style.display = 'none';
    const m = $('#bootMsg');
    if (m) m.textContent = 'Błąd uruchamiania: ' + msg;
    b.append(h('div', 'boot-err', esc(msg)));
    const act = h('div', 'boot-actions');
    const safe = h('button', 'btn primary', 'Tryb awaryjny');
    safe.onclick = () => { location.search = '?safe=1'; };
    const reset = h('button', 'btn danger', 'Reset fabryczny');
    reset.onclick = async () => { LS.clearAll(); await Blobs.wipe(); location.replace(location.pathname); };
    act.append(safe, reset);
    b.append(act);
  }

  (async function () {
    try {
      if (RESET) { LS.clearAll(); await Blobs.wipe(); }

      const raw = (SAFE || RESET) ? null : LS.get(LSK);
      if (raw) {
        try {
          state = JSON.parse(raw);
          if (!state || state.v !== 1 || !state.nodes) state = null;
        } catch (e) { state = null; }
      }
      if (!state) { state = seedState(); fresh = true; }

      const defSettings = {
        wallpaper: { type: 'preset', id: 'forest' }, accent: '#4cc2ff', theme: 'dark',
        snap: true, sound: true, volume: 70, gridSize: 'm', localLayout: false,
        defaultApps: {}, customExts: [], pins: [], hiddenPins: [], hiddenSysIcons: [],
        appLimits: { code: 8, read: 16, blob: 32 },
        expView: 'grid', expSort: 'name', expDir: 1,
expTile: 98, expSidebar: true, expStatus: true, expConfirmDel: false,
expSingleClick: false, expThumbs: true, expStart: 'desktop',
grid: { cols: 12, rows: 7 },
account: { name: '', override: false, avatar: null, google: { name: '', email: '', picture: '' } },
drive: {
mode: 'demo', clientId: DEFAULT_CID, scope: 'drive', autoUpload: true,
configSync: true, appsSync: true, wallpaperSync: true, autoLogin: true,
autoLoginLock: false, connected: false, lastEmail: '',
dynamicSync: true, fullInterval: 5, cloudOnly: false, syncOnShutdown: true
}
      };
      state.settings = Object.assign({}, defSettings, state.settings || {});
      state.settings.drive = Object.assign({}, defSettings.drive, state.settings.drive || {});
      state.settings.appLimits = Object.assign({ code: 8, read: 16, blob: 32 }, state.settings.appLimits || {});
      ['pins', 'hiddenPins', 'hiddenSysIcons', 'customExts'].forEach(k => {
        if (!Array.isArray(state.settings[k])) state.settings[k] = [];
      });
      state.apps = state.apps || {};
      state.appMeta = state.appMeta || {};
      state.appTrash = state.appTrash || {};
      state.recent = state.recent || [];
      state.cmdHistory = state.cmdHistory || [];
      state.tombstones = state.tombstones || {};
state.appTombstones = state.appTombstones || {};
state.driveTombstones = state.driveTombstones || {};
/* normalizacja nowych pol (1.14) dla stanow zapisanych przez 1.13 */
state.settings.account = Object.assign(
{ name: '', override: false, avatar: null, google: { name: '', email: '', picture: '' } },
state.settings.account || {});
state.settings.account.google = Object.assign({ name: '', email: '', picture: '' }, state.settings.account.google || {});
state.settings.grid = Object.assign({ cols: 12, rows: 7 }, state.settings.grid || {});
state.browser = Object.assign({ home: '', bookmarks: [], history: [] }, state.browser || {});
if (state.settings.drive.syncOnShutdown == null) state.settings.drive.syncOnShutdown = true;
[['expTile', 98], ['expSidebar', true], ['expStatus', true], ['expConfirmDel', false],
['expSingleClick', false], ['expThumbs', true], ['expStart', 'desktop']].forEach(p => {
if (state.settings[p[0]] == null) state.settings[p[0]] = p[1];
});
/* migracja pozycji 1.13 (piksele / komorki lokalne) -> siatka kanoniczna */
(function migrateGrid() {
const old = { s: { w: 78, h: 92 }, m: { w: 94, h: 108 }, l: { w: 114, h: 128 } }[state.settings.gridSize || 'm'];
const G = state.settings.grid;
Object.keys(state.nodes).map(k => state.nodes[k]).forEach(n => {
if (n.parent !== DESK || !n.pos) return;
const p = n.pos;
if (p.x != null) {
n.pos = {
fx: clamp(p.x / Math.max(1, innerWidth - old.w), 0, 1),
fy: clamp(p.y / Math.max(1, innerHeight - 50 - old.h), 0, 1)
};
} else if (p.c != null) {
n.pos = { c: clamp(p.c, 0, G.cols - 1), r: clamp(p.r, 0, G.rows - 1) };
}
});
})();

      /* Tryb chmurowy pochodzi wyłącznie z klucza lokalnego i zawsze
         wymusza wyłączenie automatycznego ponownego logowania. */
      const co = LS.get(CLOUD_KEY) === '1';
      state.settings.drive.cloudOnly = co;
      if (co) {
        state.settings.drive.autoLogin = false;
        state.settings.drive.autoLoginLock = true;
      } else {
        state.settings.drive.autoLoginLock = false;
      }

      for (const id in state.apps) {
        const a = state.apps[id];
        if (!a.modified) a.modified = a.created || Date.now();
        if (!a.win) a.win = {};
        if (a.noSync == null) a.noSync = false;
      }

      if (cloudOnly() && state.cloudPending) await purgeLocal();

      try { repairSystem(); } catch (e) { console.warn('repair', e); }

      if (!state.nodes['doc-api']) {
        state.nodes['doc-api'] = {
          id: 'doc-api', type: 'text', name: 'API i skrypty — dokumentacja.txt',
          parent: DIRS.system, origin: 'local', content: DOCS_TXT, size: DOCS_TXT.length,
          created: Date.now(), modified: Date.now()
        };
      } else {
        Object.assign(state.nodes['doc-api'], {
          content: DOCS_TXT, size: DOCS_TXT.length, parent: DIRS.system,
          name: 'API i skrypty — dokumentacja.txt'
        });
      }
      if (!state.nodes['doc-welcome']) {
        state.nodes['doc-welcome'] = {
          id: 'doc-welcome', type: 'text', name: 'Witaj w PulpitOS.txt', parent: DESK,
          origin: 'local', content: WELCOME_TXT, size: WELCOME_TXT.length,
          pos: { c: 0, r: 2 }, created: Date.now(), modified: Date.now()
        };
      } else {
        state.nodes['doc-welcome'].content = WELCOME_TXT;
        state.nodes['doc-welcome'].size = WELCOME_TXT.length;
      }
      [['bat-hello', 'Witaj.bat', BAT_HELLO],
       ['bat-backup', 'Kopia zapasowa.bat', BAT_BACKUP],
       ['bat-links', 'Moje strony.bat', BAT_LINKS],
       ['bat-clean', 'Porządki.bat', BAT_CLEAN]].forEach(t => {
        if (!state.nodes[t[0]]) {
          state.nodes[t[0]] = {
            id: t[0], type: 'text', name: t[1], parent: DIRS.scripts, iconPreset: 'bat',
            mime: 'application/x-batch', origin: 'local', content: t[2], size: t[2].length,
            created: Date.now(), modified: Date.now()
          };
        }
      });
      [['url-mdn', 'MDN Web Docs', 'https://developer.mozilla.org'],
       ['url-caniuse', 'Can I use', 'https://caniuse.com'],
       ['url-github', 'GitHub', 'https://github.com'],
       ['url-drive', 'Dysk Google (www)', 'https://drive.google.com']].forEach(t => {
        if (!state.nodes[t[0]]) {
          state.nodes[t[0]] = {
            id: t[0], type: 'shortcut', name: t[1], parent: DIRS.web, origin: 'local',
            target: { url: t[2] }, mime: 'text/uri-list', iconPreset: t[0] === 'url-drive' ? 'drive' : 'globe',
            created: Date.now(), modified: Date.now()
          };
        }
      });

      if (state.settings.localLayout) loadLocalLayout();
      saveNow();
      applyAccent();
applyTheme();
updSndBtn();
updAcctChip();
      updateCloudFrame();
      applyWallpaper().catch(() => {});
      deskEnter = true;
      renderDesktop();
      tbSync();
      updSyncChip();

      const d = new Date();
      $('#clockT').textContent = d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' });
      $('#clockD').textContent = d.toLocaleDateString('pl-PL');
      Drive.setSt(state.settings.drive.mode === 'google' ? 'idle' : 'demo');

      window.__osBooted = true;

      setTimeout(() => {
        const b = $('#boot');
        if (b) { b.classList.add('gone'); setTimeout(() => b.remove(), 600); }
        if (SAFE) {
          toast('Tryb awaryjny — uruchomiono na świeżym stanie. Twoje dane nie zostały skasowane.',
            { type: 'warn', timeout: 9000, action: { label: 'Reset fabryczny', fn: () => { location.search = '?reset=1'; } } });
        } else if (fresh || state.fresh) {
          state.fresh = false;
          save();
          setTimeout(() => openNotepad('doc-welcome'), 400);
        }
        if (cloudOnly()) {
          toast('Tryb chmurowy aktywny — dane tylko na Dysku Google, auto-logowanie wyłączone.',
            { type: 'info', timeout: 8000, action: { label: 'Połącz konto', fn: () => connectDialog() } });
        }
        if (state.settings.drive.mode === 'google' && state.settings.drive.autoLogin &&
            state.settings.drive.connected && !cloudOnly()) {
          setTimeout(() => {
            Drive.silentLogin().then(ok => {
              if (!ok) toast('Nie wznowiono automatycznie sesji Google.',
                { type: 'warn', timeout: 7000, action: { label: 'Połącz', fn: () => connectDialog() } });
            });
          }, 900);
        } else if (state.settings.drive.mode === 'google' && state.settings.drive.connected && cloudOnly()) {
          setTimeout(() => toast('Tryb chmurowy: połącz konto, aby odtworzyć dane z Dysku Google.',
            { type: 'info', timeout: 8000, action: { label: 'Połącz', fn: () => connectDialog() } }), 700);
        }
      }, RM ? 100 : 700);
    } catch (e) {
      console.error(e);
      fail((e && e.message) || String(e));
    }
  })();
})();

})();
