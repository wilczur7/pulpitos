  movable() {
    if (!this.active) return [];
    return this.active.ids.filter(id => N(id) && !N(id).system);
  },

  begin(ids, from, x, y, withGhost) {
    this.cancel();
    this.active = { ids: ids.slice(), from: from };
    if (withGhost) {
      const el = h('div', 'drag-ghost');
      const ic = h('div', 'dg-icons');
      ids.slice(0, 3).forEach(id => {
        const n = N(id);
        if (n) ic.append(h('span', 'dg-ico', iconHTML(n, 34)));
      });
      if (ids.length > 1) ic.append(h('span', 'dg-count', String(ids.length)));
      this.tag = h('div', 'dg-tag move', gl('moveArrow', 13) + '<span>Przenieś</span>');
      el.append(ic, this.tag);
      document.body.append(el);
      this.ghost = el;
    } else {
      this.tag = h('div', 'drag-ghost');
      this.tagInner = h('div', 'dg-tag place', gl('move', 13) + '<span>Przenieś ikonę</span>');
      this.tag.append(this.tagInner);
      document.body.append(this.tag);
    }
    this.update(x, y);
  },

  resolve(el) {
    if (!el || !this.active) return null;
    const ids = this.active.ids;
    const movable = this.movable();

    const di = el.closest('.dicon');
    if (di) {
      const n = N(di.dataset.id);
      if (!n) return null;
      if (n.type === 'system' && n.target === 'trash') {
        if (!movable.length) return null;
        return { kind: 'trash', el: di, label: 'Przenieś do kosza' };
      }
      if (n.type === 'folder' && ids.indexOf(n.id) < 0) {
        if (!movable.length) return null;
        return { kind: 'move', dest: n.id, el: di, label: 'Przenieś do „' + n.name + '”' };
      }
      return null;
    }
    const gi = el.closest('.gitem[data-id],.lrow[data-id]');
    if (gi) {
      const n = N(gi.dataset.id);
      if (n && n.type === 'folder' && ids.indexOf(n.id) < 0 && movable.length) {
        return { kind: 'move', dest: n.id, el: gi, label: 'Przenieś do „' + n.name + '”' };
      }
      return null;
    }
    const side = el.closest('.side-item');
    if (side) {
      const nav = side.dataset.nav;
      if (!movable.length) return null;
      if (nav === 'trash') return { kind: 'trash', el: side, label: 'Przenieś do kosza' };
      if (nav && nav !== 'pc') {
        const dest = nav === 'C' ? DESK : nav;
        return {
          kind: 'move', dest: dest, el: side,
          label: 'Przenieś do „' + ((N(dest) || {}).name || (nav === 'Z' ? 'Dysk Google' : 'Pulpit')) + '”'
        };
      }
      return null;
    }
    const cr = el.closest('.crumb');
    if (cr && cr.dataset.nav && cr.dataset.nav !== 'pc' && movable.length) {
      const nav = cr.dataset.nav;
      const dest = nav === 'C' ? DESK : nav;
      return { kind: 'move', dest: dest, el: cr, label: 'Przenieś do „' + ((N(dest) || {}).name || cr.textContent) + '”' };
    }
    const main = el.closest('.exp-main');
    if (main && main.dataset.folder && ['pc', 'trash'].indexOf(main.dataset.folder) < 0 && movable.length) {
      const dest = main.dataset.folder;
      return {
        kind: 'move', dest: dest, el: main,
        label: 'Przenieś do „' + ((N(dest) || {}).name || (dest === 'Z' ? 'Dysk Google' : 'folderu')) + '”'
      };
    }
    if (el.closest('#desktop')) {
      /* Wszystkie przeciągane elementy już leżą na pulpicie → swobodne przestawienie. */
      const allHere = ids.every(id => N(id) && N(id).parent === DESK);
      if (allHere) return { kind: 'reposition', el: null, label: 'Upuść, aby ustawić ikonę' };
      if (!movable.length) return null;
      const fromZ = movable.every(id => rootOf(id) === 'Z');
      return fromZ
        ? { kind: 'shortcut', el: null, label: 'Utwórz skrót na pulpicie' }
        : { kind: 'desktop', el: null, label: 'Przenieś na pulpit' };
    }
    return null;
  },

  update(x, y) {
    if (!this.active) return;
    const holder = this.ghost || this.tag;
    if (holder) {
      holder.style.left = clamp(x + 16, 4, innerWidth - 250) + 'px';
      holder.style.top = clamp(y + 18, 4, innerHeight - 90) + 'px';
    }
    const el = document.elementFromPoint(x, y);
    const t = this.resolve(el);
    if (this.lastTargetEl && this.lastTargetEl !== (t && t.el)) {
      this.lastTargetEl.classList.remove('drop-target', 'drop-trash', 'drop-import');
      this.lastTargetEl = null;
    }
    let mode = 'move', label = 'Upuść tutaj';
    if (t) {
      label = t.label;
      if (t.kind === 'trash') mode = 'trash';
      else if (t.kind === 'shortcut') mode = 'link';
      else if (t.kind === 'reposition') mode = 'place';
      if (t.el) {
        t.el.classList.add(t.kind === 'trash' ? 'drop-trash' : (t.el.classList.contains('exp-main') ? 'drop-import' : 'drop-target'));
        this.lastTargetEl = t.el;
      }
    } else {
      mode = 'block';
      label = 'Brak celu — upuść na pulpicie lub folderze';
    }
    const tagEl = this.ghost ? this.tag : this.tagInner;
    if (tagEl) {
      tagEl.className = 'dg-tag ' + mode;
      tagEl.innerHTML =
        (mode === 'trash' ? gl('trash', 13) : mode === 'link' ? gl('link', 13) :
          mode === 'block' ? gl('alert', 13) : mode === 'place' ? gl('move', 13) : gl('moveArrow', 13)) +
        '<span>' + esc(label) + '</span>';
    }
    const hint = $('#dropHint');
    if (t && t.kind === 'reposition') {
      hint.textContent = 'Shift — placement swobodny • bez Shift — wyrównanie do siatki';
      hint.classList.add('on');
    } else hint.classList.remove('on');
    this.currentTarget = t;
  },

  finish(x, y) {
    if (!this.active) return null;
    const ids = this.active.ids.slice();
    const movable = this.movable();
    const el = document.elementFromPoint(x, y);
    const t = this.resolve(el);
    this.cancel();
    if (!t) return null;
    if (t.kind === 'reposition') return 'reposition';
    if (t.kind === 'trash') { deleteFlow(movable); return 'trash'; }
    if (t.kind === 'shortcut') {
      movable.forEach(id => { const n = N(id); if (n) makeShortcut({ nodeId: id, driveId: n.driveId }, n.name); });
      return 'shortcut';
    }
    if (t.kind === 'desktop') { moveNodes(movable, DESK, { x: x, y: y }); return 'desktop'; }
    if (t.kind === 'move') {
      if (t.dest === 'Z' && movable.every(id => N(id) && rootOf(id) === 'C')) {
        movable.forEach(id => { const n = N(id); if (n) makeShortcut({ nodeId: id, driveId: n.driveId }, n.name); });
        toast('Utworzono skróty do plików z C: na Dysku Google.', { type: 'success' });
        return 'shortcut';
      }
      moveNodes(movable, t.dest);
      return 'move';
    }
    return null;
  },

  cancel() {
    if (this.lastTargetEl) {
      this.lastTargetEl.classList.remove('drop-target', 'drop-trash', 'drop-import');
      this.lastTargetEl = null;
    }
    if (this.ghost) this.ghost.remove();
    if (this.tag) this.tag.remove();
    this.ghost = this.tag = this.tagInner = null;
    this.active = null;
    this.currentTarget = null;
    const hint = $('#dropHint');
    if (hint) hint.classList.remove('on');
  }
};

/* ============================================================
   11. Pulpit
   ============================================================ */
const deskEl = $('#desktop'), iconsEl = $('#icons'), marquee = $('#marquee');
const deskSel = new Set();
let deskEnter = false;
let clipboard = { mode: null, ids: [] };

/* Kanoniczna siatka: stala liczba kolumn/wierszy synchronizowana w konfiguracji.
Rozmiar komorki i ikony wyliczany z ekranu — uklad identyczny na kazdym urzadzeniu. */
function deskGrid() {
const g = state.settings.grid || { cols: 12, rows: 7 };
const aw = Math.max(120, innerWidth - 16), ah = Math.max(120, innerHeight - 68);
const cw = aw / g.cols, ch = ah / g.rows;
return {
cols: g.cols, rows: g.rows, cw: cw, ch: ch, aw: aw, ah: ah,
icon: clamp(Math.round(Math.min(cw, ch) * .46), 16, 64),
label: cw >= 52 && ch >= 50
};
}
function occCells(ex) {
const s = new Set();
children(DESK).forEach(n => {
if (ex && ex.has(n.id)) return;
if (n.pos && n.pos.c != null) s.add(n.pos.c + ',' + n.pos.r);
});
return s;
}
function findFreeCell(pref, ex) {
const G = deskGrid(), occ = occCells(ex);
let best = null, bd = 1e12;
for (let c = 0; c < G.cols; c++) for (let r = 0; r < G.rows; r++) {
if (occ.has(c + ',' + r)) continue;
if (!pref) return { c: c, r: r };
const d = Math.pow(c - pref.c, 2) + Math.pow(r - pref.r, 2);
if (d < bd) { bd = d; best = { c: c, r: r }; }
}
return best || { c: 0, r: 0 };
}
function cellFromPoint(x, y) {
const G = deskGrid();
return {
c: clamp(Math.round((x - 8 - G.cw / 2) / G.cw), 0, G.cols - 1),
r: clamp(Math.round((y - 8 - G.ch / 2) / G.ch), 0, G.rows - 1)
};
}
function iconPx(n) {
const G = deskGrid(), p = n.pos || { c: 0, r: 0 };
if (p.fx != null) return { x: 8 + p.fx * Math.max(0, G.aw - G.cw), y: 8 + p.fy * Math.max(0, G.ah - G.ch) };
return { x: 8 + (p.c || 0) * G.cw, y: 8 + (p.r || 0) * G.ch };
}
function autoGrid() {
const cols = clamp(Math.round((innerWidth - 16) / 104), 4, 26);
const rows = clamp(Math.round((innerHeight - 68) / 112), 3, 18);
state.settings.grid = { cols: cols, rows: rows };
Object.keys(state.nodes).map(k => state.nodes[k]).forEach(n => {
if (n.parent !== DESK || !n.pos) return;
if (n.pos.fx != null) {
const p = iconPx(n);
n.pos = cellFromPoint(p.x + deskGrid().cw / 2, p.y + deskGrid().ch / 2);
} else {
n.pos.c = clamp(n.pos.c, 0, cols - 1);
n.pos.r = clamp(n.pos.r, 0, rows - 1);
}
});
commit('grid');
renderDesktop();
}
function renderDesktop() {
const G = deskGrid();
const frag = document.createDocumentFragment();
let changed = false, idx = 0;
children(DESK).forEach(n => {
if (!n.pos) { n.pos = findFreeCell(null, new Set([n.id])); changed = true; }
if (n.pos.c != null) {
const c = clamp(n.pos.c, 0, G.cols - 1), r = clamp(n.pos.r, 0, G.rows - 1);
if (c !== n.pos.c || r !== n.pos.r) { n.pos = { c: c, r: r }; changed = true; }
}
const p = iconPx(n);
const d = h('div', 'dicon' +
(deskSel.has(n.id) ? ' selected' : '') +
(clipboard.mode === 'cut' && clipboard.ids.indexOf(n.id) >= 0 ? ' cut' : '') +
(deskEnter ? ' enter' : ''));
d.dataset.id = n.id;
d.style.cssText = 'left:' + p.x + 'px;top:' + p.y + 'px;width:' + Math.max(34, G.cw - 6) + 'px';
if (deskEnter) d.style.animationDelay = (idx++ * 30) + 'ms';
d.dataset.tip = typeLabel(n) + (isUrlShortcut(n) ? ' • ' + n.target.url : '');
const badge = isUrlShortcut(n)
? '<span class="sc-badge url">' + gl('globe', 9) + '</span>'
: (n.type === 'shortcut' || n.type === 'appshortcut')
? '<span class="sc-badge">' + gl('external', 9) + '</span>' : '';
d.innerHTML = '<span class="dicon-img">' + iconHTML(n, G.icon) + badge + '</span>' +
(G.label ? '<span class="dicon-label" style="font-size:' + clamp(Math.round(G.icon * .27), 9, 12) + 'px"></span>' : '');
if (G.label) $('.dicon-label', d).textContent = n.name;
bindIcon(d, n);
frag.append(d);
});
iconsEl.innerHTML = '';
iconsEl.append(frag);
deskEnter = false;
if (changed) save();
}
function bindIcon(d, n) {
  d.ondblclick = e => { e.stopPropagation(); openNode(n); };
  d.oncontextmenu = e => {
    e.preventDefault(); e.stopPropagation();
    if (!deskSel.has(n.id)) { deskSel.clear(); deskSel.add(n.id); paintSel(); }
    nodeMenu(Array.from(deskSel), e.clientX, e.clientY, 'desktop');
  };

  d.onpointerdown = e => {
    if (e.button === 2 || e.target.tagName === 'INPUT') return;
    e.stopPropagation();

    if (e.ctrlKey || e.metaKey) {
      if (deskSel.has(n.id)) deskSel.delete(n.id); else deskSel.add(n.id);
      paintSel();
      return;
    }
    const already = deskSel.has(n.id);
    if (!already) { deskSel.clear(); deskSel.add(n.id); paintSel(); }

    const allIds = Array.from(deskSel).filter(id => N(id));
    const els = allIds.map(id => $('[data-id="' + id + '"]', iconsEl)).filter(Boolean);
    const starts = els.map(el => ({ el: el, x: parseFloat(el.style.left), y: parseFloat(el.style.top) }));
    const sx = e.clientX, sy = e.clientY;
    let moved = false;

    try { d.setPointerCapture(e.pointerId); } catch (err) {}

    const move = ev => {
      const dx = ev.clientX - sx, dy = ev.clientY - sy;
      if (!moved && Math.hypot(dx, dy) < 5) return;
      if (!moved) {
        moved = true;
        Idle.busy++;
        els.forEach(el => el.classList.add('dragging'));
        Drag.begin(allIds, DESK, ev.clientX, ev.clientY, false);
      }
      starts.forEach(s => {
        s.el.style.left = (s.x + dx) + 'px';
        s.el.style.top = (s.y + dy) + 'px';
      });
      if (Drag.active) {
        els.forEach(el => el.style.visibility = 'hidden');
        Drag.update(ev.clientX, ev.clientY);
        els.forEach(el => el.style.visibility = '');
      }
    };

    const up = ev => {
      d.onpointermove = d.onpointerup = d.onpointercancel = null;
      try { d.releasePointerCapture(e.pointerId); } catch (err) {}
      els.forEach(el => el.classList.remove('dragging'));
      if (moved) Idle.busy = Math.max(0, Idle.busy - 1);

      if (!moved) {
        if (e.pointerType === 'touch' && already) openNode(n);
        return;
      }
      if (!Drag.active) { renderDesktop(); return; }

      els.forEach(el => el.style.visibility = 'hidden');
      const result = Drag.finish(ev.clientX, ev.clientY);
      els.forEach(el => el.style.visibility = '');

      /* Operacja na plikach albo brak celu → przerysuj i wyjdź. */
      if (result !== 'reposition') { renderDesktop(); return; }

      /* Swobodne przestawienie ikon na pulpicie (siatka kanoniczna). */
const G = deskGrid();
const free = ev.shiftKey || !state.settings.snap;
if (free) {
starts.forEach(s => {
const nn = N(s.el.dataset.id);
if (!nn) return;
nn.pos = {
fx: clamp((parseFloat(s.el.style.left) - 8) / Math.max(1, G.aw - G.cw), 0, 1),
fy: clamp((parseFloat(s.el.style.top) - 8) / Math.max(1, G.ah - G.ch), 0, 1)
};
});
} else {
const occ = occCells(new Set(allIds));
starts.forEach(s => {
const nn = N(s.el.dataset.id);
if (!nn) return;
let c = clamp(Math.round((parseFloat(s.el.style.left) - 8) / G.cw), 0, G.cols - 1);
let r = clamp(Math.round((parseFloat(s.el.style.top) - 8) / G.ch), 0, G.rows - 1);
let tries = 0;
while (occ.has(c + ',' + r) && tries++ < 600) {
r++;
if (r >= G.rows) { r = 0; c++; }
if (c >= G.cols) c = 0;
}
nn.pos = { c: c, r: r };
occ.add(c + ',' + r);
});
}
Snd.play('drop');
      commit('move');
      renderDesktop();
    };

    d.onpointermove = move;
    d.onpointerup = d.onpointercancel = up;
  };
}

function paintSel() {
  $$('.dicon', iconsEl).forEach(d => d.classList.toggle('selected', deskSel.has(d.dataset.id)));
}

deskEl.onpointerdown = e => {
  if ((e.target !== deskEl && e.target !== iconsEl) || e.button !== 0) return;
  closeStart();
  const base = (e.ctrlKey || e.metaKey) ? new Set(deskSel) : new Set();
  if (!(e.ctrlKey || e.metaKey)) { deskSel.clear(); paintSel(); }
  const sx = e.clientX, sy = e.clientY;
  let moved = false;
  deskEl.setPointerCapture(e.pointerId);
  const move = ev => {
    const x = Math.min(sx, ev.clientX), y = Math.min(sy, ev.clientY);
    const w = Math.abs(ev.clientX - sx), hh = Math.abs(ev.clientY - sy);
    if (!moved && w + hh < 6) return;
    moved = true;
    marquee.style.cssText = 'display:block;left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + hh + 'px';
    deskSel.clear();
    base.forEach(id => deskSel.add(id));
    $$('.dicon', iconsEl).forEach(d => {
      const r = d.getBoundingClientRect();
      if (r.left < x + w && r.right > x && r.top < y + hh && r.bottom > y) deskSel.add(d.dataset.id);
    });
    paintSel();
  };
  const up = () => {
    deskEl.onpointermove = deskEl.onpointerup = null;
    marquee.style.display = 'none';
  };
  deskEl.onpointermove = move;
  deskEl.onpointerup = up;
};
deskEl.oncontextmenu = e => {
  if (e.target.closest('.dicon')) return;
  e.preventDefault();
  deskSel.clear(); paintSel();
  desktopMenu(e.clientX, e.clientY);
};
deskEl.ondragover = e => {
  if (!e.dataTransfer.types.includes('Files')) return;
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
};
deskEl.ondrop = e => {
  if (e.target.closest('.dicon')) return;
  if (!e.dataTransfer.files || !e.dataTransfer.files.length) return;
  e.preventDefault();
  importDropped(Array.prototype.slice.call(e.dataTransfer.files), DESK);
};

/* --- jednolite menu kontekstowe (pulpit + eksplorator) --- */
function nodeMenu(ids, x, y, source, extra) {
  extra = extra || {};
  ids = ids.filter(id => N(id));
  const nodes = ids.map(N);
  const one = nodes.length === 1 ? nodes[0] : null;
  const multi = nodes.length > 1;
  const trash = extra.trash || nodes.some(n => n.trashed);
  const items = [];

  if (trash) {
    items.push({ label: 'Przywróć', icon: 'undo', action: () => restoreNodes(ids) });

        .then(ok => { if (ok) purgeNodes(ids); }) });
    items.push({ label: 'Opróżnij kosz', icon: 'trash', danger: true, action: emptyTrash });
    if (one) items.push('-', { label: 'Właściwości', icon: 'info', action: () => propertiesDlg(one) });
    openMenu(items, x, y);

  }

  if (one) {
    items.push({
      label: one.type === 'app' ? 'Uruchom aplikację'

function renameInline(n, source) {
  if (source === 'desktop') {
    const d = $('[data-id="' + n.id + '"]', iconsEl);
    if (!d || n.system) return;
    const lbl = $('.dicon-label', d), inp = h('input', 'rename-input');
    inp.value = n.name;
    lbl.replaceWith(inp);
    inp.focus();
    const dot = n.name.lastIndexOf('.');
    inp.setSelectionRange(0, dot > 0 ? dot : n.name.length);
    let done = false;
    const fin = () => {
      if (done) return;
      done = true;
      const v = inp.value.trim();
      if (v && v !== n.name) renameNode(n, v); else renderDesktop();
    };
    inp.onpointerdown = e => e.stopPropagation();
    inp.onblur = fin;
    inp.onkeydown = e => {
      e.stopPropagation();
      if (e.key === 'Enter') fin();
      if (e.key === 'Escape') { done = true; renderDesktop(); }
    };
  } else {
    promptDlg('Zmień nazwę', n.name, { label: 'Nowa nazwa' }).then(v => { if (v) renameNode(n, v); });
  }
}
function renameNode(n, name) {
  name = uniqueName(n.parent, name, n.id);
  if (n.driveId && cloudOk()) Drive.renameReal(n, name).catch(e => toast(e.message, { type: 'error' }));
  n.name = name;
  n.modified = Date.now();
  commit('rename', n.id);
}
function arrangeDesktop(by) {
  const nodes = children(DESK).sort((a, b) => {
    if (a.system !== b.system) return a.system ? -1 : 1;
    if (by === 'type') return typeLabel(a).localeCompare(typeLabel(b), 'pl');
    if (by === 'date') return (b.modified || 0) - (a.modified || 0);
    return a.name.localeCompare(b.name, 'pl');
  });
  const G = deskGrid();
nodes.forEach((n, i) => { n.pos = { c: Math.floor(i / G.rows) % G.cols, r: i % G.rows }; });
  commit('arrange');
}

async function createNode(type, parent, o) {

    gdoc: 'Dokument Google', gsheet: 'Arkusz Google', gslides: 'Prezentacja Google'
  };

    if (['gdoc', 'gsheet', 'gslides'].indexOf(type) >= 0) {
      if (!cloudOk()) throw new Error('Dokumenty Google wymagają połączenia z kontem.');
      n = await Drive.createGoogle(type, name, z ? parent : 'Z');
    } else if (z && cloudOk()) {
      n = type === 'folder'
        ? await Drive.createFolderReal(name, parent)

function trashNodes(ids) {
  const set = new Set(ids);
  const top = ids.map(N).filter(n =>
    n && !n.system && !n.trashed &&
    !ids.some(o => o !== n.id && set.has(o) && desc(o).some(d => d.id === n.id)));
  const done = [];
  top.forEach(n => {
    n.trashed = true;
    n.trashedAt = Date.now();
    n.restoreParent = n.parent;
    done.push(n.id);
    if (n.driveId && cloudOk() && n.origin === 'google') Drive.trashReal(n).catch(() => {});
  });
  if (done.length) { commit('trash'); Snd.play('trash'); }
  return done;
}
async function deleteFlow(ids) {
ids = ids.filter(id => N(id) && !N(id).system);
  const appNode = ids.map(N).filter(n => n.type === 'app' && state.apps[n.app])[0];
  if (appNode && ids.length === 1) { deleteApp(appNode.app); return; }
  const real = ids.map(N).filter(n => n.driveId && rootOf(n.id) === 'Z' && n.origin === 'google' && cloudOk());
  const local = ids.filter(id => !real.some(r => r.id === id));
  if (local.length) {
if (state.settings.expConfirmDel &&
!await confirmDlg('Przenieść ' + local.length + ' elementów do kosza?', { title: 'Usuwanie', danger: true, okLabel: 'Do kosza', icon: 'trash' })) return;
const done = trashNodes(local);
    if (done.length) {
      toast('Przeniesiono ' + done.length + ' elementów do kosza.',
        { action: { label: 'Cofnij', fn: () => restoreNodes(done) } });
    }
  }
  if (real.length) {
    confirmDlg('Usunąć ' + real.length + ' elementów z Dysku Google? Trafią do kosza Google.',
      { danger: true, okLabel: 'Usuń' }).then(async ok => {
      if (!ok) return;
      for (const n of real) {
        try { await Drive.trashReal(n); delete state.nodes[n.id]; }
        catch (e) { toast(e.message, { type: 'error' }); }
      }
      commit('trash');
    });
  }
}
function restoreNodes(ids, quiet) {
  const rec = ids.map(N).filter(n => n && n.type === 'app' && state.appTrash && state.appTrash[n.app])[0];
  if (rec && !quiet) { restoreApp(rec.app); return; }
  ids.forEach(id => {
    let n = N(id), root = n, g = 0;
    while (root && !root.trashed && g++ < 90) root = N(root.parent);
    if (!root || !root.trashed) { if (n) delete n.trashed; }
    else {
      root.trashed = false;
      if (!N(root.restoreParent) && ['C', 'Z'].indexOf(root.restoreParent) < 0) root.restoreParent = DESK;
      root.parent = root.restoreParent || DESK;
      if (isDesktop(root.parent)) root.pos = findFreeCell(null, new Set([root.id]));
    }
    if (n) {
      delete n.trashed;
      if (n.driveId && cloudOk()) Drive.untrashReal(n).catch(() => {});
    }
  });
  commit('restore');
  if (!quiet) toast('Przywrócono elementy.', { type: 'success', timeout: 2400 });
}
async function purgeNodes(ids) {
  state.tombstones = state.tombstones || {};
  for (const id of ids) {
    const n = N(id);
    if (!n) continue;
    const all = [n].concat(desc(id));
    for (const x of all) {
      if (x.blobKey) await Blobs.del(x.blobKey);
      if (x.type === 'app' && state.appTrash && state.appTrash[x.app]) {
        const r = state.appTrash[x.app];
        if (r.app && r.app.htmlKey) await Blobs.del(r.app.htmlKey);
        delete state.appTrash[x.app];
      }
      if (x.driveId && cloudOk() && x.origin === 'google') Drive.trashReal(x).catch(() => {});
      state.tombstones[x.id] = Date.now();
      delete state.nodes[x.id];
    }
  }
  commit('purge');
}
async function emptyTrash() {

  if (!ids.length && !arch.length) { toast('Kosz jest już pusty.'); return; }

    { title: 'Opróżnij kosz', danger: true, okLabel: 'Usuń trwale' });

  await purgeNodes(ids);
  for (const id of arch) {

const G = deskGrid();
n.pos = {

async function copyTree(n, dest) {
  const nn = Object.assign({}, n, {
    id: uid(), parent: dest, name: uniqueName(dest, n.name),
    created: Date.now(), modified: Date.now()
  });
  delete nn.trashed; delete nn.driveId; delete nn.webViewLink;
  delete nn.remoteParent; delete nn.syncSig;
  if (nn.type === 'app') delete nn.app;
  if (n.origin === 'google') nn.origin = 'demo';
  if (isDesktop(dest)) nn.pos = findFreeCell(); else delete nn.pos;
  if (n.blobKey) {
    const b = await Blobs.get(n.blobKey);
    if (b) { nn.blobKey = uid(); await Blobs.put(nn.blobKey, b); }
  }
  state.nodes[nn.id] = nn;
  const kids = Object.keys(state.nodes).map(k => state.nodes[k]).filter(x => x.parent === n.id && !x.trashed);
  for (const c of kids) await copyTree(c, nn.id);
  return nn;

async function pasteClipboard(dest) {
  if (!clipboard.ids.length) return;
  const ids = clipboard.ids.filter(id => N(id));
  if (clipboard.mode === 'cut') {
    moveNodes(ids, dest);
    clipboard = { mode: null, ids: [] };
    renderDesktop();
    return;
  }
  let count = 0;
  for (const id of ids) {
    const n = N(id);
    try {
      if (isDesktop(dest) && rootOf(id) !== 'C') { makeShortcut({ nodeId: id, driveId: n.driveId }, n.name); count++; }
      else if (rootOf(id) === rootOf(dest)) { await copyTree(n, dest); count++; }
      else { makeShortcut({ nodeId: id, driveId: n.driveId }, n.name); count++; }
    } catch (e) { toast(e.message, { type: 'error' }); }
  }
  if (count) commit('paste');

      if (v && v !== n.name && !n.system) renameNode(n, v);
      a.close();
    } }]
  });
}
function openNode(x) {
  const n = typeof x === 'string' ? N(x) : x;
  if (!n) return;
  if (n.trashed) {
    toast('Element jest w koszu.', { type: 'warn', action: { label: 'Przywróć', fn: () => restoreNodes([n.id]) } });
    return;
  }
  if (['folder', 'system'].indexOf(n.type) < 0) { n.opened = Date.now(); recordRecent('node', n.id); }
if (isBat(n)) { runBatNode(n); return; }
if (n.type !== 'shortcut' && (n.mime || mimeOf(n.name)) === 'text/html') { openBrowser({ nodeId: n.id }); return; }
switch (n.type) {
    case 'system': openExplorer(n.target === 'trash' ? 'trash' : 'pc'); break;
    case 'folder': openExplorer(n.id); break;
    case 'text': openNotepad(n.id); break;
    case 'gdoc': case 'gsheet': case 'gslides': openGoogleDoc(n); break;
    case 'app': case 'appshortcut': {
      const d = appDesc(n.type === 'app' ? 'custom:' + n.app : n.app);
      if (d) d.run(); else toast('Aplikacja została usunięta.', { type: 'warn' });
      break;
    }
    case 'shortcut': {
      const t = n.target || {};
      if (t.url) { openBrowser({ url: t.url }); return; }
      if (t.app) { openNode({ type: 'appshortcut', app: t.app, id: n.id, name: n.name }); return; }
      const target = resolveTarget(n);
      if (target) openNode(target);
      else toast('Cel skrótu jest niedostępny.', { type: 'warn' });
      break;
    }
    default: openFileNode(n);
  }
}

  const isTrash = () => S.cwd === 'trash' || (N(S.cwd) && isTrashedRoot(N(S.cwd)));
  const titleFor = () =>
    S.cwd === 'pc' ? 'Ten komputer' : S.cwd === 'trash' ? 'Kosz' :
    S.cwd === 'C' ? 'Dysk lokalny (C:)' : S.cwd === 'Z' ? 'Dysk Google (Z:)' :
    (N(S.cwd) || {}).name || 'Eksplorator';

  function setSort(k, toggle) {
    if (toggle && S.sort === k) S.dir = S.dir === 1 ? -1 : 1;

    state.settings.expSort = S.sort;
    state.settings.expDir = S.dir;
    save();
    renderMain();
  }
  function navigate(cwd, noHist) {
    if (['pc', 'trash', 'C', 'Z'].indexOf(cwd) < 0 && !N(cwd)) cwd = DESK;
    S.cwd = cwd;
    S.sel.clear();
    S.q = '';
    search.value = '';
    if (!noHist) {
      S.hist = S.hist.slice(0, S.hi + 1);
      S.hist.push(cwd);

  win.api = { navigate: navigate, refresh: renderAll, cwd: () => S.cwd };

  function rawItems() {
    let a = S.cwd === 'trash'
      ? Object.keys(state.nodes).map(k => state.nodes[k]).filter(n => n.trashed)

      let r = 0;

      else if (k === 'size') r = (sizeOf(a) || 0) - (sizeOf(b) || 0);
      else if (k === 'type') r = typeLabel(a).localeCompare(typeLabel(b), 'pl');

mk(DIRS.music, 'folderMusic', 'Muzyka') +
mk(DIRS.videos, 'folderVideos', 'Wideo') +

side.style.display = state.settings.expSidebar === false ? 'none' : '';
$$('.side-item', side).forEach(b => { b.onclick = () => navigate(b.dataset.nav); });

thumbFor(n).then(src => {

});
}
} else {
        el.innerHTML = '<span class="lname">' + iconHTML(n, 20) + '<span class="n">' + esc(n.name) + '</span></span>' +
          '<span class="c">' + fmtDate(n.modified) + '</span>' +

return;
}
if (n.type === 'folder') navigate(n.id); else openNode(n);
};

if (trash) {

      el.onpointerdown = e => {
        if (e.button !== 0) return;
        e.stopPropagation();

        if (e.ctrlKey || e.metaKey) {
          if (S.sel.has(n.id)) S.sel.delete(n.id); else S.sel.add(n.id);
          S.anchor = n.id;
        } else if (e.shiftKey && S.anchor) {
          const ids = items().map(x => x.id);
          const a = ids.indexOf(S.anchor), b = ids.indexOf(n.id);
          S.sel.clear();
          ids.slice(Math.min(a, b), Math.max(a, b) + 1).forEach(id => S.sel.add(id));
        } else if (!S.sel.has(n.id)) {

        renderCmd(); updateStatus(arr.length);

        try { el.setPointerCapture(e.pointerId); } catch (err) {}

        const move = ev => {
          if (!started && Math.hypot(ev.clientX - sx, ev.clientY - sy) < 5) return;
          if (!started) {
            started = true;
            Idle.busy++;
            Drag.begin(Array.from(S.sel), S.cwd, ev.clientX, ev.clientY, true);
          }
          Drag.update(ev.clientX, ev.clientY);
        };

el.onpointermove = el.onpointerup = el.onpointercancel = null;
try { el.releasePointerCapture(e.pointerId); } catch (err) {}
if (!started) {
if (state.settings.expSingleClick || e.pointerType === 'touch') doOpen();
return;
}
Idle.busy = Math.max(0, Idle.busy - 1);
Drag.finish(ev.clientX, ev.clientY);
};
        el.onpointermove = move;

  /* zaznaczanie prostokątem */
  main.onpointerdown = e => {
    if (e.button !== 0 || e.target.closest('[data-id],[data-open],button,input,.lhead')) return;
    const mr = main.getBoundingClientRect();
    const sx = e.clientX - mr.left + main.scrollLeft;

    const box = h('div', 'select-box');

    if (!(e.ctrlKey || e.metaKey)) {
      S.sel.clear();
      $$('[data-id]', main).forEach(x => x.classList.remove('selected'));

    const move = ev => {
      const cx = ev.clientX - mr.left + main.scrollLeft;
      const cy = ev.clientY - mr.top + main.scrollTop;
      const x = Math.min(sx, cx), y = Math.min(sy, cy);
      const w = Math.abs(cx - sx), hh = Math.abs(cy - sy);

      moved = true;
      box.style.cssText = 'left:' + x + 'px;top:' + y + 'px;width:' + w + 'px;height:' + hh + 'px';
      S.sel.clear();

        const L = r.left - mr.left + main.scrollLeft, T = r.top - mr.top + main.scrollTop;

    };
    const up = () => {
      main.onpointermove = main.onpointerup = main.onpointercancel = null;
      box.remove();
    };
    main.onpointermove = move;
    main.onpointerup = main.onpointercancel = up;
  };

    main.classList.add('drop-import');
  };
  main.ondragleave = e => { if (!main.contains(e.relatedTarget)) main.classList.remove('drop-import'); };
  main.ondrop = e => {
    main.classList.remove('drop-import');
    if (isTrash() || S.cwd === 'pc') return;
    if (!e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault(); e.stopPropagation();
    importDropped(Array.prototype.slice.call(e.dataTransfer.files), S.cwd);
  };

  main.onkeydown = e => {
    if (e.target.tagName === 'INPUT') return;
    const sel = Array.from(S.sel);
    if (e.key === 'Delete' && sel.length) {
      e.preventDefault();
      if (isTrash()) confirmDlg('Trwale usunąć?', { danger: true }).then(ok => { if (ok) purgeNodes(sel); });
      else deleteFlow(sel);
    } else if (e.key === 'F2' && sel.length === 1) {
      e.preventDefault(); renameInline(N(sel[0]), 'explorer');
    } else if (e.key === 'Enter' && sel.length === 1) {
      e.preventDefault();
      const n = N(sel[0]);
      if (n) { if (n.type === 'folder') navigate(n.id); else openNode(n); }
    } else if (e.key === 'Backspace') {
      e.preventDefault(); $('.b-up', root).click();
    } else if ((e.ctrlKey || e.metaKey) && e.key === 'a') {
      e.preventDefault(); items().forEach(n => S.sel.add(n.id)); renderMain();
    } else if ((e.ctrlKey || e.metaKey) && e.key === 'c' && sel.length) {
      clipboard = { mode: 'copy', ids: sel }; renderCmd();
    } else if ((e.ctrlKey || e.metaKey) && e.key === 'x' && sel.length) {
      clipboard = { mode: 'cut', ids: sel }; renderMain(); renderDesktop();
    } else if ((e.ctrlKey || e.metaKey) && e.key === 'v') pasteClipboard(S.cwd);
  };

  win.cleanup.push(
bus.on('fs', () => { Array.from(S.sel).forEach(id => { if (!N(id)) S.sel.delete(id); }); renderAll(); }),
bus.on('drive', renderAll),
bus.on('settings', d => { if (d && d.exp) { S.view = state.settings.expView; renderAll(); } })
);
  navigate(initial, true);
}

function mdHtml(src) {
  const lines = esc(src).split('\n');
  let out = '', ul = false, ol = false;
  const close = () => {
    if (ul) { out += '</ul>'; ul = false; }
    if (ol) { out += '</ol>'; ol = false; }
  };
  const inl = s => s
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/\*([^*]+)\*/g, '<i>$1</i>')
    .replace(/`([^`]+)`/g, '<code>$1</code>');
  lines.forEach(l => {
    if (/^###\s/.test(l)) { close(); out += '<h3>' + inl(l.slice(4)) + '</h3>'; }
    else if (/^##\s/.test(l)) { close(); out += '<h2>' + inl(l.slice(3)) + '</h2>'; }
    else if (/^#\s/.test(l)) { close(); out += '<h1>' + inl(l.slice(2)) + '</h1>'; }
    else if (/^---+\s*$/.test(l)) { close(); out += '<hr>'; }
    else if (/^[-•]\s/.test(l)) { if (!ul) { close(); out += '<ul>'; ul = true; } out += '<li>' + inl(l.slice(2)) + '</li>'; }
    else if (/^\d+\.\s/.test(l)) { if (!ol) { close(); out += '<ol>'; ol = true; } out += '<li>' + inl(l.replace(/^\d+\.\s/, '')) + '</li>'; }
    else if (l.trim()) { close(); out += '<p>' + inl(l) + '</p>'; }
    else close();
  });
  close();
  return out;
}

  const autosave = debounce(() => {
    if (bound && dirty) {

async function runBatNode(n, o) {
  o = o || {};

  recordRecent('node', n.id);

  if (o.silent) {
    const lines = [];
    const sh = createShell({ cwd: n.parent, print: (t, c) => lines.push((c === 'err' ? '[BŁĄD] ' : '') + t) });
    sh.print('=== ' + n.name + ' (tryb cichy) ===', 'head');
    const t0 = Date.now();
    let code = 0;
    try { code = await sh.batch(text, { name: n.name, args: o.args || [] }); }
    catch (e) { lines.push('[BŁĄD] ' + e.message); code = 1; }
    const log = lines.join('\n') + '\n\n=== zakończono w ' + (Date.now() - t0) + ' ms, kod ' + code + ' ===';
    const logName = n.name.replace(/\.(bat|cmd)$/i, '') + '.log';
    const ex = children(DIRS.logs).filter(x => x.name === logName)[0];
    if (ex) { ex.content = log; ex.modified = Date.now(); ex.size = new Blob([log]).size; }
    else await createNode('text', DIRS.logs, { name: logName, content: log });
    commit('bat', n.id);
    toast('Skrypt „' + n.name + '” zakończony (kod ' + code + ').', {
      type: code ? 'warn' : 'success', timeout: 6000,
      action: { label: 'Pokaż log', fn: () => {
        const t = children(DIRS.logs).filter(x => x.name === logName)[0];
        if (t) openNotepad(t.id);
      } }
    });
    return code;
  }
  const w = openCmd(n.parent);
  await delay(80);
  w.api.print('▶ Uruchamiam skrypt: ' + n.name, 'bat');
  const code = await w.api.shell.batch(text, { name: n.name, args: o.args || [] });
  w.api.print('■ Skrypt zakończony — kod wyjścia: ' + code, code ? 'warn' : 'ok');
  return code;
}

   17. Powłoka / konsola CMD
   ============================================================ */
function expandVars(s, sh) {
  const now = new Date();
  const built = {
    CD: fullPath(sh.cwd),
    DATE: now.toLocaleDateString('pl-PL'),
    TIME: now.toLocaleTimeString('pl-PL'),
    RANDOM: String(Math.floor(Math.random() * 32768)),
    ERRORLEVEL: String(sh.errorlevel),
    USERNAME: userName(), VER: VER,
    SCRIPTDIR: fullPath(sh.scriptDir || sh.cwd)
  };
  return String(s)
    .replace(/%~dp0/g, built.SCRIPTDIR + '\\')
    .replace(/%([A-Za-z_][A-Za-z0-9_]*|\d)%/g, (m, k) => {
      const up = k.toUpperCase();
      if (built[up] != null) return built[up];
      if (sh.env[k] != null) return sh.env[k];
      if (sh.env[up] != null) return sh.env[up];
      return '';
    })
    .replace(/%%/g, '%');
}
function splitElse(s) {
  let q = false;
  for (let i = 0; i < s.length - 5; i++) {
    if (s[i] === '"') q = !q;
    if (!q && s.slice(i, i + 6).toLowerCase() === ' else ') return [s.slice(0, i).trim(), s.slice(i + 6).trim()];
  }
  return [s.trim(), ''];
}
function safeMath(expr, sh) {
  const ex = expandVars(expr, sh).replace(/[^-+*/(). \d]/g, '');
  if (!ex.trim()) return 0;
  try {
    const v = Function('"use strict";return(' + ex + ')')();
    return isFinite(v) ? Math.round(v) : 0;
  } catch (e) { return 0; }
}

function createShell(opts) {
  opts = opts || {};
  const print = opts.print || function () {};
  let cwd = (opts.cwd && cmdPath(opts.cwd, 'C')) || DESK;
  let errorlevel = 0, echo = true, aborted = false;
  const env = Object.assign({}, opts.env || {});

  const sh = {
    env: env, print: print,
    get cwd() { return cwd; },
    set cwd(v) { cwd = v; if (opts.onCd) opts.onCd(v); },
    get errorlevel() { return errorlevel; },
    setErrorlevel: v => { errorlevel = v | 0; },
    get echo() { return echo; },
    set echo(v) { echo = !!v; },
    get aborted() { return aborted; },
    abort: () => { aborted = true; },
    scriptDir: opts.scriptDir || null,
    promptText: () => fullPath(cwd),
    setTitle: t => opts.setTitle && opts.setTitle(t),
    close: () => opts.close && opts.close(),
    pause: () => opts.onPause ? new Promise(r => opts.onPause(r)) : Promise.resolve(),
    setColor: c => opts.setColor && opts.setColor(c)
  };
  const need = a => {
    const t = cmdPath(a, cwd), n = t && N(t);
    if (!n) throw new Error('Nie znaleziono: ' + a);
    return n;
  };

  const CMDS = {
    help: { d: 'Lista poleceń', u: 'help [cmd]', f: a => {
      if (a[0]) {
        const c = CMDS[a[0].toLowerCase()];
        if (!c) { print('Nieznane: ' + a[0], 'err'); return 1; }
        print(a[0] + ' — ' + c.d, 'head'); print(c.u, 'acc'); return 0;
      }
      print('POLECENIA (' + Object.keys(CMDS).length + ')', 'head');
      Object.keys(CMDS).sort().forEach(k => print('  ' + k.padEnd(12) + CMDS[k].d, 'dim'));
      print('', '');
      print('.bat: @echo off • rem • :etykieta • goto • if exist • call • %ZMIENNA% • set /a • exit /b', 'dim');
      return 0;
    } },
    ver: { d: 'Wersja systemu', u: 'ver', f: () => {
      print('PulpitOS ' + VER + ' • motyw: ' + currentTheme() + ' • aplikacji: ' + allApps().length +
        (cloudOnly() ? ' • TRYB CHMUROWY' : ''));
      return 0;
    } },
    echo: { d: 'Wypisuje tekst', u: 'echo <tekst>', f: a => {
      const s = a.join(' ');
      if (/^off$/i.test(s)) { echo = false; return 0; }
      if (/^on$/i.test(s)) { echo = true; return 0; }
      print(s || 'ECHO ' + (echo ? 'on' : 'off'));
      return 0;
    } },
    cls: { d: 'Czyści ekran', u: 'cls', f: () => { if (opts.clear) opts.clear(); return 0; } },
    clear: { d: 'Czyści ekran', u: 'clear', f: () => { if (opts.clear) opts.clear(); return 0; } },
    pwd: { d: 'Bieżąca ścieżka', u: 'pwd', f: () => { print(fullPath(cwd), 'acc'); return 0; } },
    cd: { d: 'Zmienia folder', u: 'cd <ścieżka>', f: a => {
      if (!a[0]) { print(fullPath(cwd)); return 0; }
      const t = cmdPath(a.join(' '), cwd);
      if (!t) { print('Nie znaleziono: ' + a.join(' '), 'err'); return 1; }
      if (['C', 'Z'].indexOf(t) < 0 && (N(t) || {}).type !== 'folder') { print('To nie jest folder.', 'err'); return 1; }
      sh.cwd = t;
      return 0;
    } },
    ls: { d: 'Lista folderu', u: 'ls [ścieżka]', f: a => {
      const t = a[0] ? cmdPath(a.join(' '), cwd) : cwd;
      if (!t) { print('Nie znaleziono.', 'err'); return 1; }
      print(fullPath(t), 'acc');
      const k = children(t);

        autoLogin: !!state.settings.drive.autoLogin
      }, null, 1));
      return 0;
    } },
    reset: { d: 'Stan fabryczny', u: 'reset', f: async () => { await factoryReset(); return 0; } },
    exit: { d: 'Kończy', u: 'exit [/b] [kod]', f: a => {
      const c = a.filter(x => !/^\/b$/i.test(x))[0];
      if (c != null) errorlevel = +c || 0;
      if (a.some(x => /^\/b$/i.test(x))) { aborted = true; return errorlevel; }
      sh.close();
      return errorlevel;
    } }
  };
  sh.commands = CMDS;

  sh.exec = async line => {
    const parts = String(line).match(/(?:[^\s"]+|"[^"]*")+/g) || [];
    const cmd = (parts[0] || '').toLowerCase();
    const args = parts.slice(1).map(s => s.replace(/^"|"$/g, ''));
    const c = CMDS[cmd];
    if (!c) { print('Nieznane polecenie: ' + cmd, 'err'); errorlevel = 9009; return 9009; }
    try { errorlevel = (await c.f(args)) | 0; return errorlevel; }
    catch (e) { print('Błąd: ' + (e && e.message || e), 'err'); errorlevel = 1; return 1; }
  };

  sh.batch = async (text, o) => {
    o = o || {};
    const depth = o.depth || 0;
    if (depth > 4) { print('Limit zagnieżdżenia CALL.', 'err'); return 1; }
    const lines = String(text).replace(/\r/g, '').split('\n');
    const labels = {};
    lines.forEach((l, i) => {
      const m = /^\s*:([\w-]+)/.exec(l);
      if (m) labels[m[1].toLowerCase()] = i;
    });
    const saved = Object.assign({}, env);
    (o.args || []).forEach((v, i) => { env[String(i + 1)] = v; });
    env['0'] = o.name || 'script.bat';
    let i = 0, steps = 0, queue = [], ret = 0;
    const prevAbort = aborted;
    aborted = false;
    print('┌─ ' + (o.name || 'skrypt'), 'bat');

    while ((i < lines.length || queue.length) && !aborted) {
      if (++steps > 3000) { print('Limit kroków — przerwano.', 'err'); ret = 1; break; }
      let line = (queue.length ? queue.shift() : lines[i++]).trim();
      if (!line || /^::/.test(line) || /^rem\b/i.test(line) || /^:/.test(line)) continue;
      let quiet = false;
      if (line[0] === '@') { quiet = true; line = line.slice(1).trim(); }
      line = expandVars(line, sh).trim();
      if (!line) continue;
      if (echo && !quiet && !/^echo\s+off$/i.test(line)) print(sh.promptText() + '>' + line, 'echo');

      let m;
      if ((m = /^goto\s+:?([\w-]+)$/i.exec(line))) {
        const t = labels[m[1].toLowerCase()];
        if (t == null) { print('Brak etykiety: ' + m[1], 'err'); ret = 1; break; }
        i = t + 1; queue = [];
        continue;
      }
      if (/^exit\b/i.test(line)) {
        const cm = /^exit\s+\/b\s*(\d+)?/i.exec(line);
        if (cm) { ret = cm[1] != null ? +cm[1] : errorlevel; break; }
        sh.close(); ret = errorlevel; break;
      }
      if ((m = /^if\s+(.+)$/i.exec(line))) {
        const br = evalIf(m[1]);
        if (br) queue.unshift(br);
        continue;
      }
      if ((m = /^set\s+\/a\s+([\w]+)\s*=\s*(.+)$/i.exec(line))) { env[m[1]] = String(safeMath(m[2], sh)); continue; }
      if ((m = /^set\s+\/p\s+([\w]+)\s*=\s*(.*)$/i.exec(line))) {
        const v = await promptDlg('Skrypt pyta', '', { label: m[2] || m[1] });
        env[m[1]] = v == null ? '' : v;
        continue;
      }
      if ((m = /^set\s+([\w]+)\s*=\s*(.*)$/i.exec(line))) { env[m[1]] = m[2]; continue; }
      if (/^pause\b/i.test(line)) { print('Naciśnij Enter…', 'warn'); await sh.pause(); continue; }
      if (/^call\s+/i.test(line)) {
        const pp = line.slice(5).trim().match(/(?:[^\s"]+|"[^"]*")+/g) || [];
        const t = cmdPath((pp[0] || '').replace(/^"|"$/g, ''), cwd);
        const nn = t && N(t);
        if (!nn) { print('CALL: brak ' + pp[0], 'err'); errorlevel = 1; continue; }
        const pd = sh.scriptDir;
        sh.scriptDir = nn.parent;
        errorlevel = await sh.batch(await nodeText(nn), { name: nn.name, args: pp.slice(1), depth: depth + 1 });
        sh.scriptDir = pd;
        continue;
      }
      await sh.exec(line);
      if (o.stepDelay) await delay(o.stepDelay);
    }
    ret = aborted ? errorlevel : (ret || errorlevel);
    Object.keys(env).forEach(k => { if (!(k in saved) && !/^\d$/.test(k)) delete env[k]; });
    aborted = prevAbort;
    print('└─ kod ' + ret, ret ? 'warn' : 'ok');
    errorlevel = ret;
    return ret;
  };

  function evalIf(expr) {
    let s = expr.trim(), neg = false;
    if (/^not\s+/i.test(s)) { neg = true; s = s.slice(4).trim(); }
    let cond = false, rest = '', m;
    const cmp = (x, y, op, ci) => {
      let a = String(x).replace(/^"|"$/g, ''), b = String(y).replace(/^"|"$/g, '');
      if (ci) { a = a.toLowerCase(); b = b.toLowerCase(); }
      return op === '==' ? a === b : a !== b;
    };
    if ((m = /^exist\s+(\S+)\s+([\s\S]+)$/i.exec(s))) { cond = !!cmdPath(m[1].replace(/^"|"$/g, ''), cwd); rest = m[2]; }
    else if ((m = /^defined\s+(\w+)\s+([\s\S]+)$/i.exec(s))) { cond = env[m[1]] != null; rest = m[2]; }
    else if ((m = /^errorlevel\s+(\d+)\s+([\s\S]+)$/i.exec(s))) { cond = errorlevel >= +m[1]; rest = m[2]; }
    else if ((m = /^\/i\s+(.+?)\s*(==|!=)\s*(.+?)\s+([\s\S]+)$/i.exec(s))) { cond = cmp(m[1], m[3], m[2], true); rest = m[4]; }
    else if ((m = /^(.+?)\s*(==|!=)\s*(.+?)\s+([\s\S]+)$/.exec(s))) { cond = cmp(m[1], m[3], m[2], false); rest = m[4]; }
    else { print('Zła składnia IF.', 'err'); return ''; }
    if (neg) cond = !cond;
    const p = splitElse(rest);
    let out = (cond ? p[0] : p[1]) || '';
    out = out.trim();
    if (out.charAt(0) === '(' && out.slice(-1) === ')') out = out.slice(1, -1).trim();
    return out;
  }
  return sh;
}

function openCmd(cwd) {

    build: w => buildCmd(w, cwd)

function buildCmd(win, initial) {
  let hi = -1, busy = false, pauseResolve = null;
  const root = h('div', 'cmd',
    '<div class="cmd-tool"><button class="mini-btn" id="cHelp">' + gl('info', 12) + ' Pomoc</button>' +
    '<button class="mini-btn" id="cClear">' + gl('x', 12) + ' Wyczyść</button>' +
    '<button class="mini-btn" id="cBats">' + gl('bat', 12) + ' Skrypty</button>' +
    '<button class="mini-btn" id="cUrls">' + gl('globe', 12) + ' Skróty WWW</button>' +
    '<button class="mini-btn" id="cRepair">' + gl('wrench', 12) + ' Napraw</button>' +
    '<button class="mini-btn" id="cCopy">' + gl('copy', 12) + ' Kopiuj</button>' +
    '<span style="flex:1"></span><span class="mini-btn" style="pointer-events:none">CMD ' + VER + '</span></div>' +
    '<div class="cmd-out" id="cOut"></div>' +
    '<div class="cmd-in" id="cInRow"><span class="ps" id="cPs"></span>' +
    '<input id="cIn" spellcheck="false" autocomplete="off" placeholder="wpisz polecenie… (help)"></div>' +
    '<div class="cmd-hint">↑/↓ historia • Tab uzupełnia • run plik.bat • url Nazwa | adres • cloud status • js</div>');
  win.body.append(root);
  const out = $('#cOut', root), inp = $('#cIn', root), ps = $('#cPs', root), inRow = $('#cInRow', root);

  const print = (t, c) => {
    const l = h('div', 'l ' + (c || ''));
    l.textContent = t;
    out.append(l);
    out.scrollTop = out.scrollHeight;
  };
  const prompt = () => { if (!pauseResolve) ps.textContent = sh.promptText() + '>'; };
  const sh = createShell({
    cwd: initial || DESK, print: print,
    clear: () => { out.innerHTML = ''; },
    setTitle: t => win.setTitle(t),
    close: () => win.close(),
    setColor: c => { root.dataset.scheme = c; },
    onCd: prompt,
    onPause: res => {
      pauseResolve = res;
      inRow.classList.add('paused');
      ps.textContent = 'PAUSE ▸';
      inp.placeholder = 'Naciśnij Enter…';
      inp.focus();
    }
  });
  prompt();
  print('PulpitOS [Wersja ' + VER + '] — konsola systemowa', 'head');
  print('Wpisz "help", "batlist", "urls" lub "repair".' + (cloudOnly() ? ' TRYB CHMUROWY aktywny.' : ''), 'dim');
  print('', '');

  const run = async line => {
    const raw = line.trim();
    if (!raw) return;
    print(sh.promptText() + '>' + raw, 'echo');
    state.cmdHistory = (state.cmdHistory || []).filter(x => x !== raw).concat(raw).slice(-150);
    save();
    hi = -1; busy = true;
    try { await sh.exec(raw); }
    catch (e) { print('Błąd: ' + e.message, 'err'); }
    finally { busy = false; prompt(); }
  };

  inp.onkeydown = async e => {
    e.stopPropagation();
    if (e.key === 'Enter') {
      if (pauseResolve) {
        const r = pauseResolve;
        pauseResolve = null;
        inRow.classList.remove('paused');
        inp.placeholder = 'wpisz polecenie… (help)';
        inp.value = '';
        prompt(); r();
        return;
      }
      if (busy) return;
      const v = inp.value;
      inp.value = '';
      await run(v);
      return;
    }
    if (busy) return;
    if (e.key === 'ArrowUp') {
      const hh = state.cmdHistory || [];
      if (!hh.length) return;
      hi = hi < 0 ? hh.length - 1 : Math.max(0, hi - 1);
      inp.value = hh[hi];
      e.preventDefault();
    } else if (e.key === 'ArrowDown') {
      const hh = state.cmdHistory || [];
      if (hi < 0) return;
      hi++;
      inp.value = hi >= hh.length ? '' : hh[hi];
      if (hi >= hh.length) hi = -1;
      e.preventDefault();
    } else if (e.key === 'Tab') {
      e.preventDefault();
      const v = inp.value, sp = v.lastIndexOf(' '), frag = v.slice(sp + 1).toLowerCase();
      if (sp < 0) {
        const m = Object.keys(sh.commands).filter(k => k.indexOf(frag) === 0);
        if (m.length === 1) inp.value = m[0] + ' ';
        else if (m.length > 1) print(m.join('  '), 'dim');
      } else {
        const cur = cmdPath('.', sh.cwd);
        const m = children(cur).filter(n => n.name.toLowerCase().indexOf(frag) === 0);
        if (m.length === 1) inp.value = v.slice(0, sp + 1) + m[0].name + (m[0].type === 'folder' ? '\\' : ' ');
        else if (m.length > 1) print(m.map(x => x.name).join('  '), 'dim');
      }
    } else if (e.ctrlKey && e.key === 'l') {
      e.preventDefault(); out.innerHTML = '';
    } else if (e.ctrlKey && e.key === 'c' && busy) sh.abort();
  };
  root.onclick = e => {
    if (!e.target.closest('button') && !(window.getSelection() || '').toString()) inp.focus();
  };
  $('#cHelp', root).onclick = () => run('help');
  $('#cClear', root).onclick = () => { out.innerHTML = ''; inp.focus(); };
  $('#cBats', root).onclick = () => run('batlist');
  $('#cUrls', root).onclick = () => run('urls');
  $('#cRepair', root).onclick = () => run('repair');
  $('#cCopy', root).onclick = async () => {
    try { await navigator.clipboard.writeText(out.innerText); toast('Skopiowano zawartość konsoli.', { type: 'success', timeout: 2000 }); }
    catch (e) {}
  };
  win.api = {
    run: run,
    clear: () => { out.innerHTML = ''; },
    cd: p => { const t = cmdPath(p, sh.cwd); if (t) { sh.cwd = t; prompt(); } },
    print: print, shell: sh
  };
  win.cleanup.push(() => sh.abort());
  setTimeout(() => inp.focus(), 90);
}

function openFileNode(n) {

async function importDropped(files, parent) {
  let ok = 0, cloud = 0, err = 0;
  for (const f of files) {
    try {
      if (f.size > 80 * 1048576) throw new Error('Plik > 80 MB');
      if (/\.url$/i.test(f.name)) {
        const txt = await f.text();
        const m = /URL\s*=\s*(.+)/i.exec(txt);
        if (m) {
          makeShortcut({ url: normalizeUrl(m[1].trim()) }, f.name.replace(/\.url$/i, ''));
          ok++;
          continue;
        }
      }
      if (rootOf(parent) === 'Z' && cloudOk()) {
        await importSingle(f.name, f.type || mimeOf(f.name), f, { parent: parent, shortcut: false });
        cloud++;
      } else if (isBatName(f.name) || /^text\//.test(f.type)) {

async function fileToIconDataURL(file) {
  if (!/^(image\/|application\/octet-stream)/.test(file.type) && !/\.(ico|png|jpe?g|gif|webp|svg)$/i.test(file.name)) {
    throw new Error('Wybierz plik obrazu.');
  }
  if (file.size > 8 * 1048576) throw new Error('Obraz zbyt duży (8 MB).');
  const url = mkURL(file);
  try {
    const img = await new Promise((res, rej) => {
      const i = new Image();
      i.onload = () => res(i);
      i.onerror = () => rej(new Error('Nie można wczytać obrazu.'));
      i.src = url;
    });
    const c = document.createElement('canvas');
    c.width = c.height = 128;
    const x = c.getContext('2d');
    const iw = img.naturalWidth || 128, ih = img.naturalHeight || 128;
    const sc = Math.max(128 / iw, 128 / ih), w = iw * sc, hh = ih * sc;
    x.drawImage(img, (128 - w) / 2, (128 - hh) / 2, w, hh);
    let out = c.toDataURL('image/png');
    if (out.length > 180000) out = c.toDataURL('image/webp', .85);
    return out;
  } finally { rmURL(url); }
}

const appFrames = new Set();
const nodeInfo = n => ({
  id: n.id, name: n.name, type: n.type, parent: n.parent, drive: rootOf(n.id),
  size: sizeOf(n), created: n.created, modified: n.modified, mime: n.mime || null,
  app: n.app || null, target: n.target || null, bat: isBat(n), url: isUrlShortcut(n) ? n.target.url : null
});
function attachBridge(win, iframe, app, file) {
  const entry = { iframe: iframe, win: win, app: app };
  appFrames.add(entry);
  win.cleanup.push(() => appFrames.delete(entry));
  const post = d => { try { iframe.contentWindow.postMessage(d, '*'); } catch (e) {} };
  win.bridgePost = post;
  iframe.addEventListener('load', () => {
    post({
      channel: 'pulpitos', event: 'ready',
      data: {
        version: VER, system: 'PulpitOS', accent: state.settings.accent,
        theme: currentTheme(), mode: currentTheme(), driveMode: Drive.mode,
        cloudOnly: cloudOnly(), appId: app.id, appName: app.name, window: win.getSize(),
        dirs: {
          desktop: DESK, apps: DIRS.apps, appdata: DIRS.appdata, documents: DIRS.documents,
          downloads: DIRS.downloads, system: DIRS.system, scripts: DIRS.scripts,
          logs: DIRS.logs, web: DIRS.web
        }
      }
    });
    if (file) post({ channel: 'pulpitos', event: 'file.open', data: nodeInfo(file) });
  });
  const handler = async e => {
    if (e.source !== iframe.contentWindow) return;
    const d = e.data;
    if (!d || d.channel !== 'pulpitos' || !d.method || d.id == null) return;
    let result, error;
    try { result = await bridgeCall(d.method, d.params || {}, entry); }
    catch (err) { error = String((err && err.message) || err); }
    post({ channel: 'pulpitos', id: d.id, ok: !error, result: result, error: error });
  };
  window.addEventListener('message', handler);
  win.cleanup.push(() => window.removeEventListener('message', handler));
}
function broadcastApps(event, data) {
  appFrames.forEach(f => { try { f.iframe.contentWindow.postMessage({ channel: 'pulpitos', event: event, data: data }, '*'); } catch (e) {} });
}
bus.on('fs', d => broadcastApps('fs.change', d || {}));
bus.on('settings', d => {
  if (!d || !d.theme) broadcastApps('theme.change', { mode: currentTheme(), theme: currentTheme(), accent: state.settings.accent });
});
bus.on('drive', () => broadcastApps('drive.change', { mode: Drive.mode, state: Drive.state, cloudOnly: cloudOnly() }));

async function bridgeCall(m, p, ctx) {
  const need = id => { const n = N(id); if (!n) throw new Error('Nie znaleziono: ' + id); return n; };
  const gp = () => {
    const par = resolveDir(p.parent != null ? p.parent : 'C');
    if (!par || (['C', 'Z'].indexOf(par) < 0 && (!N(par) || N(par).type !== 'folder'))) {
      throw new Error('Nieprawidłowy folder');
    }
    return par;
  };
  switch (m) {
    case 'system.info': return {
      system: 'PulpitOS', version: VER, accent: state.settings.accent,
      theme: currentTheme(), mode: currentTheme(), driveMode: Drive.mode,
      driveState: Drive.state, cloudOnly: cloudOnly(),
      limits: { code: limitBytes('code'), read: limitBytes('read'), blob: limitBytes('blob') },
      dirs: {
        desktop: DESK, apps: DIRS.apps, appdata: DIRS.appdata, documents: DIRS.documents,
        downloads: DIRS.downloads, system: DIRS.system, scripts: DIRS.scripts,
        logs: DIRS.logs, web: DIRS.web
      },
      icons: Object.keys(ICO)
    };
    case 'system.theme': return { mode: currentTheme() };
    case 'system.icons': return { presets: Object.keys(ICO), folders: FOLDER_PRESETS };
    case 'system.repair': return { ok: true, report: repairSystem() };
    case 'system.log': systemLog('app:' + ctx.app.id, String(p.message || '')); return { ok: true };
    case 'fs.list': return children(gp()).map(nodeInfo);
    case 'fs.stat': return nodeInfo(need(p.id));
    case 'fs.search': {
      const q = String(p.query || '').toLowerCase();
      return Object.keys(state.nodes).map(k => state.nodes[k])
        .filter(n => !isTrashedRoot(n) && n.name.toLowerCase().indexOf(q) >= 0)
        .slice(0, 50).map(nodeInfo);
    }
    case 'fs.read': {
      const n = need(p.id), t = await nodeText(n), lim = limitBytes('read');
      if (lim && t.length > lim) throw new Error('Limit ' + fmtSize(lim));
      return { text: t, name: n.name };
    }
    case 'fs.readBlob': {
      const n = need(p.id), b = await nodeBlob(n);
      if (!b) throw new Error('Brak zawartości');
      return { name: n.name, mime: n.mime || mimeOf(n.name), dataURL: 'data:' + (n.mime || mimeOf(n.name)) + ';base64,' + await blob64(b) };
    }
    case 'fs.write': {
      if (p.id) {
        const n = need(p.id);
        if (n.type !== 'text') throw new Error('Tylko pliki tekstowe');
        n.content = String(p.content || '');
        n.modified = Date.now();
        commit('write', n.id);
        return nodeInfo(n);
      }
      const n = await createNode(isBatName(p.name || '') ? 'bat' : 'text', gp(),
        { name: p.name, content: String(p.content || '') });
      if (!n) throw new Error('Nie utworzono');
      return nodeInfo(n);
    }
    case 'fs.writeBlob':
      return nodeInfo(await importSingle(p.name || 'plik.bin', p.mime || mimeOf(p.name || ''),
        b64blob(p.base64, p.mime), { parent: gp(), shortcut: !!p.shortcut }));
    case 'fs.create': {
      const t = p.type || 'folder';
      if (['folder', 'text', 'bat', 'gdoc', 'gsheet', 'gslides'].indexOf(t) < 0) throw new Error('Nieobsługiwany typ');
      const n = await createNode(t, gp(), { name: p.name, content: p.content });
      if (!n) throw new Error('Nie utworzono');
      if (p.icon && ICO[p.icon]) { n.iconPreset = p.icon; commit('icon', n.id); }
      return nodeInfo(n);
    }
    case 'fs.rename': { const n = need(p.id); renameNode(n, String(p.name || n.name)); return nodeInfo(n); }
    case 'fs.setIcon': {
      const n = need(p.id);
      if (p.dataURL) { n.iconData = p.dataURL; delete n.iconPreset; }
      else if (p.preset && ICO[p.preset]) { n.iconPreset = p.preset; delete n.iconData; }
      else { delete n.iconPreset; delete n.iconData; }
      commit('icon', n.id); renderDesktop();
      return nodeInfo(n);
    }
    case 'fs.move': { moveNodes([p.id], gp()); return nodeInfo(N(p.id)); }
    case 'fs.delete': return { trashed: trashNodes([p.id]).length > 0 };
    case 'fs.restore': restoreNodes([p.id]); return { restored: true };
    case 'fs.purge': await purgeNodes([p.id]); return { purged: true };
    case 'bat.run': {
      const n = p.id ? need(p.id) : N(cmdPath(String(p.path || ''), gp()));
      if (!n || !isBat(n)) throw new Error('Nie znaleziono skryptu');
      return { ok: true, exitCode: await runBatNode(n, { silent: !!p.silent, args: p.args || [] }) | 0 };
    }
    case 'bat.list':
      return Object.keys(state.nodes).map(k => state.nodes[k]).filter(n => isBat(n) && !n.trashed).map(nodeInfo);
    case 'bat.exec': {
      const lines = [];
      const sh = createShell({ cwd: gp(), print: (t, c) => lines.push((c === 'err' ? '[BŁĄD] ' : '') + t) });
      const code = await sh.batch(String(p.script || ''), { name: p.name || 'inline.bat' });
      return { exitCode: code, output: lines };
    }
    case 'app.state': {
      const dir = appDataDir(ctx.app.id);
      const key = String(p.key || 'state').replace(/[\\/:*?"<>|]/g, '_');
      const ex = children(dir).filter(n => n.type === 'text' && n.name === key + '.json')[0];
      if (p.value === undefined) return { value: ex ? ex.content : null };
      const val = typeof p.value === 'string' ? p.value : JSON.stringify(p.value);
      if (ex) { ex.content = val; ex.modified = Date.now(); commit('write', ex.id); }
      else await createNode('text', dir, { name: key + '.json', content: val });
      return { ok: true };
    }
    case 'desktop.icons': return children(DESK).map(nodeInfo);
    case 'desktop.appShortcut': {
      const d = appDesc(String(p.app || '')) || appDesc('custom:' + String(p.app || ''));
      if (!d) throw new Error('Nieznana aplikacja');

    }
    case 'desktop.sysIcon': {

      if (!s) throw new Error('pc lub trash');
      if (p.visible === false) hideSysIcon(s.id); else showSysIcon(s.id);
      return { ok: true };

async function purgeLocal() {
  for (const k in state.nodes) if (state.nodes[k].blobKey) await Blobs.del(state.nodes[k].blobKey);
  for (const id in state.apps) if (state.apps[id].htmlKey) await Blobs.del(state.apps[id].htmlKey);
  for (const id in (state.appTrash || {})) {
    const r = state.appTrash[id];
    if (r.app && r.app.htmlKey) await Blobs.del(r.app.htmlKey);
  }
  await Blobs.del('wp-custom');
  state.nodes = {};
  state.apps = {};
  state.appTrash = {};
  state.recent = [];
  state.cloudPending = false;
  state.cfgPushedAt = 0;
  state.cfgHash = null;
  ensureSystemIcons(true);
  saveNow();
  renderDesktop();
  tbSync();
  bus.emit('apps');
}
async function cloudShutdownSync() {
  if (!cloudOnly() || !cloudOk()) return;
  const w = $('#wipe');
  w.classList.add('on');
  $('#wipeMsg').textContent = 'Tryb chmurowy: wysyłanie danych na Dysk Google i czyszczenie pamięci lokalnej…';
  try {
    await Drive.fullSync(false);
    await purgeLocal();
  } catch (e) {
    toast('Nie udało się dokończyć synchronizacji chmurowej: ' + e.message, { type: 'error' });
  }
  w.classList.remove('on');
}

/* ============================================================
   24. Naprawa systemu
   ============================================================ */
function repairSystem() {
  const rep = [], now = Date.now();
  const mk = (id, name, parent) => {
    if (!state.nodes[id]) {
      state.nodes[id] = {
        id: id, type: 'folder', name: name, parent: parent,
        iconPreset: DIR_ICON[id] || 'folder', origin: 'local', created: now, modified: now
      };
      rep.push('Utworzono folder ' + name);
    } else {
      const n = state.nodes[id];
      n.type = 'folder';
      n.parent = parent;
      if (!n.iconPreset && DIR_ICON[id]) n.iconPreset = DIR_ICON[id];
      delete n.trashed;
    }
  };
  mk(DIRS.apps, 'aplikacje', 'C');
  mk(DIRS.appdata, 'appdata', DIRS.apps);
  mk(DIRS.user, 'użytkownik', 'C');
  mk(DESK, 'pulpit', DIRS.user);
  mk(DIRS.downloads, 'pobrane', DIRS.user);
  mk(DIRS.documents, 'dokumenty', DIRS.user);
  mk(DIRS.web, 'strony www', DIRS.user);
mk(DIRS.music, 'muzyka', DIRS.user);
mk(DIRS.videos, 'wideo', DIRS.user);
mk(DIRS.pictures, 'zdjęcia', DIRS.user);
  mk(DIRS.system, 'system', 'C');
  mk(DIRS.logs, 'logs', DIRS.system);
  mk(DIRS.config, 'config', DIRS.system);
  mk(DIRS.scripts, 'skrypty', DIRS.system);

  let orph = 0;
  Object.keys(state.nodes).map(k => state.nodes[k]).forEach(n => {
    if (['C', 'Z'].indexOf(n.parent) < 0 && !state.nodes[n.parent]) {
      n.parent = (n.system || n.type === 'appshortcut') ? DESK : DIRS.documents;
      delete n.pos;
      orph++;
    }
  });
  if (orph) rep.push('Naprawiono osierocone elementy: ' + orph);

  const made = ensureSystemIcons(true);
  rep.push(made ? 'Odtworzono ikony systemowe: ' + made : 'Ikony systemowe obecne');

  let an = 0;
  for (const id in state.apps) {
    const has = Object.keys(state.nodes).map(k => state.nodes[k])
      .some(x => x.type === 'app' && x.app === id && !x.trashed);
    if (!has) { ensureAppNode(id); an++; }
  }
  if (an) rep.push('Utworzono pliki aplikacji: ' + an);

  let dead = 0;
  Object.keys(state.nodes).map(k => state.nodes[k]).forEach(n => {
    if (n.type === 'app' && !n.trashed && !state.apps[n.app] && !(state.appTrash && state.appTrash[n.app])) {
      n.trashed = true; n.trashedAt = now; n.restoreParent = n.parent; dead++;
    }
  });
  if (dead) rep.push('Odłączono pliki usuniętych aplikacji: ' + dead);

  if (!state.nodes['sys-log']) {
    state.nodes['sys-log'] = {
      id: 'sys-log', type: 'text', name: 'dziennik-zdarzeń.log', parent: DIRS.logs,
      origin: 'local', content: '', created: now, modified: now, noSync: true
    };
    rep.push('Utworzono dziennik zdarzeń');
  }
  if (cloudOnly() && state.settings.drive.autoLogin) {
    state.settings.drive.autoLogin = false;
    state.settings.drive.autoLoginLock = true;
    rep.push('Tryb chmurowy: wyłączono automatyczne logowanie');
  }
  state.fsVersion = 7;
  save();
  renderDesktop();
  tbSync();
  bus.emit('apps');
  rep.push('Struktura dysku C: zweryfikowana');
  return rep;
}

save();

Drive.setSt(d.mode === 'google' ? 'idle' : 'demo');

  function renderDefaults() {
    const da = state.settings.defaultApps || {};
    const custom = (state.settings.customExts || []).slice().sort();
    const BASE = [
      ['txt', 'Dokument tekstowy'], ['bat', 'Skrypt wsadowy — uruchamia konsolę'],
      ['html', 'Strona HTML / aplikacja'], ['pdf', 'Dokument PDF'],
      ['png', 'Obraz PNG'], ['jpg', 'Obraz JPEG'], ['mp3', 'Audio MP3'],
      ['mp4', 'Wideo MP4'], ['*', 'Wszystkie inne pliki']
    ];
    const opts = (cur, ext) =>
      '<option value="system"' + (cur === 'system' ? ' selected' : '') + '>' +
      (ext === 'bat' ? 'Uruchom skrypt' : 'Domyślna systemowa') + '</option>' +
      (ext === 'bat' ? '<option value="batedit"' + (cur === 'batedit' ? ' selected' : '') + '>Edytor skryptów</option>' : '') +
(ext === 'html' ? '<option value="browser"' + (cur === 'browser' ? ' selected' : '') + '>Przeglądarka systemowa</option>' : '') +
      '<option value="notepad"' + (cur === 'notepad' ? ' selected' : '') + '>Notatnik</option>' +
      '<option value="download"' + (cur === 'download' ? ' selected' : '') + '>Pobierz</option>' +
      Object.keys(state.apps).map(id => {
        const a = state.apps[id];
        return '<option value="app:' + a.id + '"' + (cur === 'app:' + a.id ? ' selected' : '') + '>Aplikacja: ' + esc(a.name) + '</option>';
      }).join('');
    const row = (e, label, del) =>
      '<div class="def-row"><span class="ext">' + (e === '*' ? 'inne' : '.' + esc(e)) + '</span>' +
      '<span class="desc">' + esc(label) + '</span>' +
      '<select class="inp" data-ext="' + esc(e) + '">' + opts(da[e] || 'system', e) + '</select>' +
      (del ? '<button class="def-del" data-del="' + esc(e) + '">' + gl('trash', 13) + '</button>' : '') + '</div>';

    pane.innerHTML = '<h2>Aplikacje domyślne</h2><div class="sub">Czym otwierać poszczególne typy plików</div>' +
      '<div class="set-card"><div class="def-sec">Podstawowe</div>' +
      BASE.map(e => row(e[0], e[1])).join('') +
      '<div class="def-sec">Niestandardowe rozszerzenia</div>' +
      (custom.length ? custom.map(e => row(e, 'Własne rozszerzenie', true)).join('')
        : '<div class="hint">Nie dodano własnych rozszerzeń.</div>') +
      '<div class="def-add"><input class="inp" id="defExt" placeholder="np. psd" maxlength="16">' +
      '<button class="btn" id="defAdd">' + gl('plus', 13) + ' Dodaj</button></div>' +
      '<div class="set-row" style="margin-top:12px"><button class="btn" id="defReset">Przywróć domyślne</button></div>' +
      '<div class="hint">Skróty do stron WWW otwierają się zawsze w przeglądarce systemowej.</div></div>';

    $$('select[data-ext]', pane).forEach(s => {
      s.onchange = () => { state.settings.defaultApps[s.dataset.ext] = s.value; save(); };
    });
    $$('[data-del]', pane).forEach(b => {
      b.onclick = () => {
        const e = b.dataset.del;
        state.settings.customExts = (state.settings.customExts || []).filter(x => x !== e);
        delete state.settings.defaultApps[e];
        save(); render();
      };
    });
    const add = () => {
      const e = $('#defExt', pane).value.trim().toLowerCase().replace(/^\./, '');
      if (!/^[a-z0-9][a-z0-9_-]{0,15}$/.test(e)) { toast('Podaj poprawne rozszerzenie.', { type: 'warn' }); return; }
      if (BASE.some(b => b[0] === e) || (state.settings.customExts || []).indexOf(e) >= 0) {
        toast('To rozszerzenie już jest na liście.', { type: 'warn' }); return;
      }
      state.settings.customExts.push(e);
      save(); render();
    };
    $('#defAdd', pane).onclick = add;
    $('#defExt', pane).onkeydown = e => { if (e.key === 'Enter') add(); };
    $('#defReset', pane).onclick = () => {
      state.settings.defaultApps = {};
      state.settings.customExts = [];
      save(); render();
    };
  }

}

});

  F(DIRS.config, 'config', DIRS.system);

  add({ id: 'sys-pc', type: 'system', target: 'pc', name: 'Ten komputer', parent: DESK, system: true, origin: 'local', pos: { c: 0, r: 0 }, created: now, modified: now });
  add({ id: 'sys-trash', type: 'system', target: 'trash', name: 'Kosz', parent: DESK, system: true, origin: 'local', pos: { c: 0, r: 1 }, created: now, modified: now });

  add({ id: 'sys-log', type: 'text', name: 'dziennik-zdarzeń.log', parent: DIRS.logs, origin: 'local', content: '', created: now, modified: now, noSync: true });

  BAT('bat-hello', 'Witaj.bat', BAT_HELLO);

  add({ id: 'f-proj', type: 'folder', name: 'Projekty', iconPreset: 'folderProjects', parent: DIRS.documents, origin: 'local', created: now, modified: now });
  add({ id: 'f-photo', type: 'folder', name: 'Zdjęcia', iconPreset: 'folderPictures', parent: DIRS.documents, origin: 'local', created: now, modified: now });
  add({ id: 't-ideas', type: 'text', name: 'Pomysły.txt', parent: DIRS.documents, origin: 'local',
